name: Publish

concurrency:
  group: publish
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simulate a publish without any external side effects (no push, no PR, no CDN/Discord/RSS uploads, fail at the end to not clog list of successfu PRs because workflow relies on that).
        required: false
        default: false
        type: boolean
      version:
        description: Optional version tag to apply to the released commit and push (used as-is, e.g. 'v2026.08.0'); adds no tag when empty.
        required: false
        type: string
  # schedule:
   # - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}

    steps:
    - name: Announce dry run
      if: ${{ github.event.inputs.dry_run == 'true' }}
      run: |
        echo "################################################################################"
        echo "#                            DRY RUN IS RUNNING                                #"
        echo "#  Nothing will be committed, pushed, tagged, uploaded or posted.              #"
        echo "#  This run is expected to fail at the end and never counts as a publish.      #"
        echo "################################################################################"

    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml python3-requests python3-yaml

    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0
        filter: blob:none

    # DS14-secrets-start
    - name: Setup secrets
      env:
        SSH_KEY: ${{ secrets.SECRETS_PRIVATE_KEY }}
      if: ${{ env.SSH_KEY != '' }}
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SECRETS_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "HOST *" > ~/.ssh/config
        echo "StrictHostKeyChecking no" >> ~/.ssh/config
        echo "::group::Cloning secrets"
        git clone git@github.com:dead-space-server/space-station-14-secrets.git Secrets
        echo "::endgroup::"
        if [ ! -d "Secrets" ]; then
          echo "::error::Failed to clone secrets repository"
          exit 1
        fi
        echo "Secrets cloned OK"
        cp -R Secrets/Resources/Prototypes Resources/Prototypes/DeadSpaceSecrets
        cp -R Secrets/Resources/ServerPrototypes Resources/Prototypes/DeadSpaceSecretsServer
        cp -R Secrets/Resources/Locale Resources/Locale/ru-RU/deadspace-secrets
        cp -R Secrets/Resources/Textures Resources/Textures/DeadSpaceSecrets
        echo "Resources copied OK"

    - name: Verify secrets
      run: |
        if [ -d "Secrets" ]; then
          echo "Secrets: OK"
        else
          echo "::warning::Secrets not loaded - SECRETS_PRIVATE_KEY may not be configured"
        fi
    # DS14-secrets-end

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Get last publish SHA
      id: last-publish
      run: Tools/actions_get_last_publish_sha.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update changelog
      run: |
        dotnet tool install --global SpaceWizards.ChangelogTool --version 1.0.8
        ss14-changelog update -d Resources/Changelog -s ${LAST_PUBLISH_SHA}
      env:
        REPO: ${{ github.repository }}
        BRANCH: stable
        CHANGELOG_REPO_PATH: Resources/Changelog
        EXTRA_CATEGORIES: Admin,Maps,Rules
        GITHUB_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}
        LAST_PUBLISH_SHA: ${{ steps.last-publish.outputs.last_publish_sha }}

    - name: Commit and push changelog changes
      id: changelog
      run: |
        git config user.name "Space-Wizards-Bot"
        git config user.email "bot@spacestation14.com"
        if [ -n "$(git status --porcelain Resources/Changelog)" ]; then
          git add Resources/Changelog
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY-RUN: staged files:"
            git diff --cached --name-only | sed 's/^/DRY-RUN:   /'
            if git commit -m "Update changelog"; then
              git push --dry-run "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}" || true
              # Roll back the throwaway commit. Required by following step dry-run mode.
              git reset --soft HEAD~1
            fi
          else
            git commit -m "Update changelog"
            git -c http.https://github.com/.extraheader= \
              push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:${GITHUB_REF_NAME}"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
        fi
      env:
        GH_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}

    - name: Tag version commit
      if: ${{ github.event.inputs.version != '' }}
      env:
        GH_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}
        VERSION_TAG: ${{ github.event.inputs.version }}
      run: |
        HEAD_SHA=$(git rev-parse HEAD)
        if [ "$DRY_RUN" = "true" ]; then
          echo "DRY-RUN: would create tag '${VERSION_TAG}' at ${HEAD_SHA} and push it."
        else
          git tag "${VERSION_TAG}"
          git -c http.https://github.com/.extraheader= \
            push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${VERSION_TAG}"
        fi

    - name: Create PR from stable to master
      env:
        GH_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}
      run: |
        if [ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --head stable --base master --state open --json number --jq '.[].number')" ]; then
          if [ "$DRY_RUN" = "true" ]; then
            gh pr create --dry-run --repo "$GITHUB_REPOSITORY" --base master --head stable --title "Stable to master sync after release" --body "Sync from release to master." || echo "::warning::DRY-RUN: PR would not be created (see gh output above)."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base master --head stable --title "Update changelog" --body "Sync from release to master."
          fi
        else
          echo "Merge from stable to master PR already exist, skipping."
        fi

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform linux-x64 # only linux, no: --platform win-x64 --platform osx-x64 --platform linux-arm64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      run: python3 -u Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}

    - name: Publish changelog (Discord)
      continue-on-error: true
      run: python3 -u Tools/actions_changelogs_since_last_run.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
        LAST_PUBLISH_SHA: ${{ steps.last-publish.outputs.last_publish_sha }}

    # - name: Publish changelog (RSS)
    #   if: ${{ github.event.inputs.dry_run != 'true' }}
    #   continue-on-error: true
    #   run: Tools/actions_changelog_rss.py
    #   env:
    #     CHANGELOG_RSS_KEY: ${{ secrets.CHANGELOG_RSS_KEY }}

    - name: Finalize dry run (not a publish)
      if: ${{ github.event.inputs.dry_run == 'true' }}
      run: |
        echo "::error::Dry run completed - nothing was actually published. Exiting non-zero so this run is never recorded as a successful publish and is excluded from future 'Get last publish SHA' lookups."
        exit 1
