- type: entity
  abstract: true
  id: CMStockAttachmentBase
  parent: CMBaseAttachable
  components:
  - type: Sprite
    sprite: _CM14/Objects/Weapons/Guns/Attachments/stock.rsi
  - type: Tag
    tags:
    - CMAttachableStock

- type: entity
  parent: CMStockAttachmentBase
  id: CMAttachmentM39Stock
  name: submachinegun stock
  description: A rare ARMAT stock distributed in small numbers to USCM forces. Compatible with the M39, this stock reduces recoil and improves accuracy, but at a reduction to handling and agility.
  components:
  - type: Sprite
    state: smgstock

- type: entity
  parent: CMStockAttachmentBase
  id: CMAttachmentM39StockCollapsible
  name: submachinegun folding stock
  description: A Kirchner brand K2 M39 folding stock, standard issue in the USCM. This stock can collapse in, removing all positive and negative effects.
  components:
  - type: Sprite
    state: smgstockcc
  - type: Tag
    tags:
    - CMAttachableStock
    - CMAttachableStockSMGCollapsible
  - type: AttachableToggleable
  - type: AttachableVisuals
    showActive: true
  - type: AttachableToggleableSizeModifier
    activeSizeModifier: 1

- type: entity
  parent: CMStockAttachmentBase
  id: CMAttachmentM41ASolidStock
  name: M41A solid stock
  description: A solid stock for the M41A pulse rifle.
  components:
  - type: Sprite
    state: 44stock

- type: Tag
  id: CMAttachableStock
- type: Tag
  id: CMAttachableStockSMGCollapsible
