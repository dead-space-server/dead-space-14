- type: entity
  abstract: true
  id: CMUnderAttachmentBase
  parent: CMBaseAttachable
  components:
  - type: Sprite
    sprite: _CM14/Objects/Weapons/Guns/Attachments/under.rsi
  - type: Tag
    tags:
    - CMAttachmentUnderbarrel

- type: entity
  parent: CMUnderAttachmentBase
  id: CMAttachmentU7UnderbarrelShotgun
  name: U7 underbarrel shotgun
  description: An underbarrel shotgun attachment. Allows the user to fire shotgun shells from the host weapon.
  components:
  - type: Sprite
    state: masterkey
  - type: Tag
    tags:
    - CMAttachmentUnderbarrel
    - CMAttachmentU7UnderbarrelShotgun
  - type: Gun
    soundGunshot:
      path: /Audio/_CM14/Weapons/Guns/Gunshots/gun_shotgun_u7.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    cycleable: false
    whitelist:
      tags:
      - ShellShotgun
    capacity: 5
    proto: null
    soundInsert:
      path: /Audio/_CM14/Weapons/Guns/Reload/gun_sg_reload.ogg
  - type: UniqueAction
  - type: PumpAction
  - type: UseDelayOnShoot
  - type: UseDelay
    delay: 2
  - type: AttachableToggleable
    attachedOnly: true
    supercedeHolder: true
    activateSound: /Audio/_CM14/Attachable/gun_u7_activate.ogg
  - type: AttachableVisuals
  - type: AttachableToggleableSimpleActivate

- type: entity
  parent: CMUnderAttachmentBase
  id: CMAttachmentVerticalGrip
  name: vertical grip
  description: A vertical grip for better handling.
  components:
  - type: Sprite
    state: verticalgrip

- type: Tag
  id: CMAttachmentUnderbarrel
- type: Tag
  id: CMAttachmentU7UnderbarrelShotgun
