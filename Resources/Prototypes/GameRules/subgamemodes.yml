- type: entity
  parent: BaseGameRule
  id: Thief
  components:
  - type: ThiefRule
  # DS14-start: instead of random steal objectives the thief has a single goal —
  # earn a million dirty credits through the ВорПРО program, then escape.
  - type: AntagObjectives
    objectives:
    - EarnCreditsThiefObjective
    - EscapeThiefShuttleObjective
  - type: AntagSelection
    agentName: thief-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Thief ]
      max: 3
      playerRatio: 20 # DS14
      lateJoinAdditional: true
      allowNonHumans: true
      multiAntagSetting: NotExclusive
      startingGear: ThiefGear
      # components:
      # - type: Pacified # DS14 no pacified thiefs
      mindRoles:
      - MindRoleThief
      sponsorsPriority: true
      briefing:
        sound: "/Audio/Misc/thief_greeting.ogg"
  - type: DynamicRuleCost
    cost: 75
  - type: GameRule
    cancelPresetOnTooFewPlayers: false

# Needs testing
- type: entity
  parent: BaseWizardRule
  id: SubWizard
  components:
  - type: AntagSelection
    agentName: wizard-round-end-name
    selectionTime: PrePlayerSpawn
    definitions:
    - prefRoles: [ Wizard ]
      max: 1
      playerRatio: 1
      spawnerPrototype: SpawnPointGhostWizard
      roleLoadout:
      - RoleSurvivalExtended
      briefing:
        text: wizard-role-greeting
        color: Turquoise
        # TODO: Need Wizard Start sound
        #sound: "/Audio/Ambience/Antag/wizard_start.ogg"
      startingGear: WizardBlueGear
      # TODO: WizardComp as needed
      components:
      - type: NpcFactionMember
        factions:
        - Wizard
      - type: RandomMetadata
        nameSegments:
        - NamesWizardFirst
        - NamesWizardLast
        nameFormat: name-format-wizard
      mindRoles:
      - MindRoleWizard
      sponsorsPriority: true
  - type: GameRule
    cancelPresetOnTooFewPlayers: false

- type: entity
  parent: BaseXenoborgsRule
  id: SubXenoborgs
  components:
  - type: GameRule
    minPlayers: 30
    cancelPresetOnTooFewPlayers: false
  - type: AntagMultipleRoleSpawner
    antagRoleToPrototypes:
      MothershipCore: [ MothershipCore ]
      Xenoborg: [ XenoborgEngi, XenoborgHeavy, XenoborgScout, XenoborgStealth, XenoborgMiner ] # DS14
    pickAndTake: true
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    definitions:
    - prefRoles: [ MothershipCore ]
      fallbackRoles: [ Xenoborg ]
      spawnerPrototype: SpawnPointGhostRoleMothershipCore
      mindRoles:
      - MindRoleMothershipCore
      sponsorsPriority: true
    - prefRoles: [ Xenoborg ]
      fallbackRoles: [ MothershipCore ]
      spawnerPrototype: SpawnPointGhostRoleXenoborg
      mindRoles:
      - MindRoleXenoborg
      sponsorsPriority: true
      # DS14-start
      min: 5
      max: 5
      # DS14-end
  - type: DynamicRuleCost
    cost: 200
