- type: entity
  parent: BaseGameRule
  id: Thief
  components:
  - type: ThiefRule
  - type: AntagRandomObjectives
    sets:
    - groups: ThiefBigObjectiveGroups
      prob: 0.7
      maxPicks: 1
    - groups: ThiefObjectiveGroups
      maxPicks: 10
    maxDifficulty: 2.5
  - type: AntagSelection
    agentName: thief-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Thief ]
      max: 3
      playerRatio: 20 # DS14
      lateJoinAdditional: true
      allowNonHumans: true
      multiAntagSetting: NotExclusive
      startingGear: ThiefGear
      # components:
      # - type: Pacified # DS14 no pacified thiefs
      mindRoles:
      - MindRoleThief
      sponsorsPriority: true
      briefing:
        sound: "/Audio/Misc/thief_greeting.ogg"
  - type: DynamicRuleCost
    cost: 75
  - type: GameRule
    cancelPresetOnTooFewPlayers: false

- type: entity
  id: Changeling
  parent: [BaseGameRule, BaseRoundstartAntagRule]
  components:
  - type: ChangelingRule
  - type: GameRule
    minPlayers: 20
    delay:
      min: 240
      max: 420
    cancelPresetOnTooFewPlayers: false
  - type: AntagSelection
    agentName: changeling-round-end-agent-name
    lateJoinAdditional: true
    selectionTime: PrePlayerSpawn
    antags:
    - !type:LinearAntagCount
      proto: Changeling
      playerRatio: 15
      range:
        min: 1
        max: 3
  - type: AntagRandomObjectives
    sets:
    - groups: ChangelingObjectiveGroupDevourDummy
      maxPicks: 1
    - groups: ChangelingObjectiveGroupEscapeDummy
      maxPicks: 1
    - groups: ChangelingObjectiveGroupKillDummy
      maxPicks: 1
    maxDifficulty: 8
  - type: DynamicRuleCost
    cost: 75

# Needs testing
- type: entity
  parent: BaseWizardRule
  id: SubWizard
  components:
  - type: GameRule
    cancelPresetOnTooFewPlayers: false

- type: entity
  parent: BaseXenoborgsRule
  id: SubXenoborgs
  components:
  - type: GameRule
    minPlayers: 30
    cancelPresetOnTooFewPlayers: false
  - type: AntagMultipleRoleSpawner
    antagRoleToPrototypes:
      MothershipCore: [ MothershipCore ]
      Xenoborg: [ XenoborgEngi, XenoborgHeavy, XenoborgScout, XenoborgStealth, XenoborgMiner ] # DS14
    pickAndTake: true
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    definitions:
    - prefRoles: [ MothershipCore ]
      fallbackRoles: [ Xenoborg ]
      spawnerPrototype: SpawnPointGhostRoleMothershipCore
      mindRoles:
      - MindRoleMothershipCore
      sponsorsPriority: true
    - prefRoles: [ Xenoborg ]
      fallbackRoles: [ MothershipCore ]
      spawnerPrototype: SpawnPointGhostRoleXenoborg
      mindRoles:
      - MindRoleXenoborg
      sponsorsPriority: true
      # DS14-start
      min: 5
      max: 5
      # DS14-end
  - type: DynamicRuleCost
    cost: 200
