- type: entityTable
  id: BasicCalmEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: AnomalySpawn
    - id: BluespaceArtifact
    - id: BluespaceLocker
    - id: BreakerFlip
    - id: BureaucraticError
    - id: ClericalError
    - id: CockroachMigration
    - id: GasLeak
    - id: GreytideVirus
    - id: IonStorm # its calm like 90% of the time smh
    - id: KudzuGrowth
    - id: MassHallucinations
    - id: MouseMigration
    - id: PowerGridCheck
    - id: RandomSentience
    - id: SlimesSpawnHorde
    - id: SolarFlare
    - id: SnakeSpawnHorde
    - id: SpiderClownSpawnHorde
    - id: SpiderSpawnHorde
    - id: VendorMalfunction
    - id: VentClog
    # DS14-start
    - id: LowVirusPandemic
    # DS14-end

- type: entityTable
  id: BasicAntagEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: ClosetSkeleton
    - id: KingRatMigration
    - id: RevenantSpawn
    - !type:NestedSelector
      tableId: DerelictBorgEventTable
    # DS14-start
    - id: MonkeyKingSpawn # DS14 возможно временно тут, может быть будет перенесён в ModerateAntag, нужно чтобы игроки наигрались
    - id: MediumVirusPandemic
    # DS14-end

- type: entityTable
  id: ModerateAntagEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: DragonSpawn
    - id: NinjaSpawn
    - id: ParadoxCloneSpawn
    - id: SleeperAgents
    - id: ZombieOutbreak
    - id: Xenoborgs # DS14
    - id: SpiderTerrorOutbreak # DS14
    - id: LoneOpsSpawn
    - id: GeistMidroundSpawn # DS14
    - id: WizardSpawn
    # DS14-start
    - id: SyndicateRaid
    - id: PirateRaid
    - id: ZaratanaSpawn
    - id: RenegadeSpawn
    - id: ShadowlingMidround
    - id: ShadowDemonInvasion
    - id: DemonsInvasion
    - id: BlobSpawn
    - id: HardVirusPandemic
    - id: SentientVirusEvent
    # DS14-end
    - !type:NestedSelector
      tableId: DerelictBorgEventTable

- type: entityTable
  id: DerelictBorgEventTable #For Derelict Borg spawns
  table: !type:GroupSelector
    children:
    - !type:GroupSelector # Standard NT Borgs
      weight: 85
      children:
        - id: DerelictEngineerCyborgSpawn
        - id: DerelictGenericCyborgSpawn
        - id: DerelictJanitorCyborgSpawn
        - id: DerelictMedicalCyborgSpawn
        - id: DerelictMiningCyborgSpawn
    - !type:GroupSelector # Other Borgs
      weight: 15
      children:
        - id: DerelictSyndicateAssaultCyborgSpawn

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseAntagGhostRoleRule
  components:
  - type: AntagSelection
    selectionTime: Never

- type: entity
  id: BaseStationEvent
  parent: BaseGameRule
  abstract: true
  components:
  - type: GameRule
    delay:
      min:  10
      max:  20

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseStationEventVeryShortDelay
  components:
  - type: GameRule
    delay:
      min:  5
      max:  10

- type: entity
  id: BaseStationEventShortDelay
  parent: BaseGameRule
  abstract: true
  components:
  - type: GameRule
    delay:
      min:  10
      max:  20

- type: entity
  id: BaseStationEventLongDelay
  parent: BaseGameRule
  abstract: true
  components:
  - type: GameRule
    delay:
      min:  40
      max:  60

- type: entity
  id: AnomalySpawn
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncementColor: "#18abf5"
    startAudio:
      path: /Audio/_DeadSpace/Announcements/flux.ogg # DS14-Announcements
      params:
        volume: -2
    weight: 8
    duration: 35
    minimumPlayers: 10 # DS14
  - type: AnomalySpawnRule
  - type: DynamicRuleCost
    cost: 10

- type: entity
  id: BluespaceArtifact
  parent: BaseStationEventShortDelay
  components:
