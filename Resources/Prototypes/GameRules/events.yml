    startAudio:
      path: /Audio/_DeadSpace/Announcements/blusp_anomalies.ogg # DS14-Announcements
      params:
        volume: -2
    weight: 8
    duration: 35
  - type: BluespaceArtifactRule
  - type: DynamicRuleCost
    cost: 10

- type: entity
