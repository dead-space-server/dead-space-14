- type: entity
  parent: [ BaseAntagGhostRoleRule, BaseNukeopsRule ]
  id: LoneOpsSpawn
  components:
  - type: StationEvent
    earliestStart: 35
    weight: 3
    minimumPlayers: 40
    duration: null # LoneOpsSpawn needs an infinite duration so that it inherits the NukeOpsRule things of an actually appropriate end screen (not always "Neutral outcome!") and... ending the game if the station is nuked.
    occursDuringRoundEnd: false
  - type: RuleGrids
  - type: LoadMapRule
    mapPath: /Maps/Nonstations/ds_lone_ops_outpost.yml #DS14
  - type: NukeopsRule
    roundEndBehavior: Nothing
  - type: AntagSelection
    definitions:
    - spawnerPrototype: SpawnPointLoneNukeOperative
      min: 1
      max: 1
      pickPlayer: false
      startingGear: SyndicateLoneOperativeGearFull
      roleLoadout:
      - RoleSurvivalNukie
      components:
      # DS14-start
      - type: CustomNameOnSpawn
        namePrefix: "Оперативник"
      # DS14-end
      - type: NukeOperative
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicatePrefix
        - NamesSyndicateNormal
        nameFormat: name-format-nukie-generic
      - type: NpcFactionMember
        factions:
        - Syndicate
      mindRoles:
      - MindRoleLoneops
  - type: DynamicRuleCost
    cost: 75

