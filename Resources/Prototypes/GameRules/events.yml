  - type: DynamicRuleCost
    cost: 50

- type: entity
  parent: BaseAntagGhostRoleRule
  id: DragonSpawn
  components:
  - type: StationEvent
    startAnnouncement: station-event-dragon-spawn-announcement
    startAudio:
      path: /Audio/_DeadSpace/Announcements/carps.ogg # DS14-Announcements
      params:
        volume: -2
    weight: 6.5
    earliestStart: 40
    reoccurrenceDelay: 20
    minimumPlayers: 25 # DS14
    duration: null
    occursDuringRoundEnd: false
  - type: SpaceSpawnRule
    spawnDistance: 0
  - type: AntagSpawner
    prototype: MobDragon
  - type: DragonRule
  - type: AntagObjectives
    objectives:
    - CarpRiftsObjective
    - DragonSurviveObjective
  - type: AntagSelection
    agentName: dragon-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: Dragon
  - type: DynamicRuleCost
    cost: 75

- type: entity
  parent: BaseAntagGhostRoleRule
  id: SpaceChangelingSpawn
  components:
  - type: StationEvent
    weight: 6
    earliestStart: 20 # can start early since lings need time to start doing stuff
    reoccurrenceDelay: 40
    minimumPlayers: 20
    duration: null
    occursDuringRoundEnd: false
  - type: SpaceSpawnRule
    spawnDistance: 80
  - type: AntagSpawner
    prototype: MobHeadSlugElder
  - type: ChangelingRule
  - type: AntagRandomObjectives
    sets:
    - groups: ChangelingObjectiveGroupDevourDummy
      maxPicks: 1
    - groups: ChangelingObjectiveGroupEscapeDummy
      maxPicks: 1
    - groups: ChangelingObjectiveGroupKillDummy
      maxPicks: 1
    maxDifficulty: 8
  - type: AntagSelection
    agentName: changeling-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: SpaceChangeling
  - type: DynamicRuleCost
    cost: 75

- type: entity
  parent: BaseAntagGhostRoleRule
  id: NinjaSpawn
  components:
  #DS14-start
  - type: LoadMapRule
    mapPath: /Maps/_DeadSpace/Ninja/ninja.yml
  - type: RuleGrids
  #DS14-end
  - type: StationEvent
    weight: 3 # DS14
    duration: null
    occursDuringRoundEnd: false
    earliestStart: 30
    reoccurrenceDelay: 30 # DS14
    minimumPlayers: 30
  #- type: SpaceSpawnRule ##DS14
  - type: AntagLoadProfileRule
  # DS14-start
    speciesOverride: Human
    speciesOverrideBlacklist:
    - Arachnid
    - Diona
    - Dwarf
    # - Human
    - Moth
    - Reptilian
    - SlimePerson
    - Vox
    - Demon
    - Shark
    - Tajaran
    - Vulpkanin
    - Felinid
    - Kobolt
    - Xenomorph
    - IPC
  # DS14-end
  - type: AntagObjectives
    objectives:
    - StealResearchObjective
    # - DoorjackObjective # DS14 ninja balance
    - SpiderChargeObjective
    - TerrorObjective
    # - MassArrestObjective # DS14
    - NinjaSurviveObjective
    - NinjaKillRandomPersonObjective # DS14 ninja balance
    #DS14-start
    - NinjaKillRandomPersonObjective
    - NinjaAiHackObjective
    - NinjaProtectPersonObjective
    - NinjaInfoScanObjective
    - NinjaStealMoneyObjective
    #DS14-end
  - type: AntagSelection
    agentName: ninja-round-end-agent-name
    definitions:
    - spawnerPrototype: SpawnPointGhostSpaceNinja
      min: 1
      max: 1
      pickPlayer: false
      startingGear: SpaceNinjaGear
      roleLoadout:
      - RoleSurvivalSpaceNinja
      briefing:
        text: ninja-role-greeting
        color: Green
        sound: /Audio/Misc/ninja_greeting.ogg
      components:
      - type: CustomNameOnSpawn #DS14
      - type: RenegadeCANTSubordinate #DS14
      - type: SpaceNinja
      - type: NpcFactionMember
        factions:
        - Ninja ## DS14
      - type: RandomMetadata
        nameSegments:
        - NamesNinjaTitle
        - NamesNinja
        nameFormat: name-format-ninja
      mindRoles:
      - MindRoleNinja
  - type: DynamicRuleCost
    cost: 75

