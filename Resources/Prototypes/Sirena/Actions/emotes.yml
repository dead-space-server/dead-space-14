# steps это кадры. at (сек) обязателен, строго растёт. Остальные не обязательны
# наследуются от прошлого кадра, можно менять только нужное
#   at = время кадра в секундах
#   shift = сдвиг в тайлах (1.0 = 32 px, |x|,|y| <= 2)
#   tilt = градусы поворота спрайта, |tilt| <= 720
#   face = градусы поворота тела, кратно 90, в конце кратно 360
#   size = сжаите и растижение (x, y, каждое от 0.2 до 3)
#   fade = прозрачность (от 0.15 до 1)
#   color = цвет (#ff0000 / red)
#   frame = state из RSI (с layer один раз на анимацию)

# flip animation
- type: entity
  id: EmoteFlip
  name: сделать сальто
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: Interface/Actions/blight.png
  - type: InstantAction
    event: !type:EmoteFlipActionEvent

# jump animation
- type: entity
  id: EmoteJump
  name: прыгнуть
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: Interface/Actions/blight.png
  - type: InstantAction
    event: !type:EmoteJumpActionEvent

  # turn around in 4 directions animation
- type: entity
  id: EmoteTurn
  name: кружится
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: Interface/Actions/blight.png
  - type: InstantAction
    event: !type:EmoteTurnActionEvent

  # stop-tail animation
- type: entity
  id: EmoteStopTail
  name: перестать вилять хвостом
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: Interface/Actions/blight.png
  - type: InstantAction
    event: !type:EmoteStopTailActionEvent

  # start-tail animation
- type: entity
  id: EmoteStartTail
  name: начать вилять хвостом
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: Interface/Actions/blight.png
  - type: InstantAction
    event: !type:EmoteStartTailActionEvent

# Using EmoteAnimation from IC action chat
