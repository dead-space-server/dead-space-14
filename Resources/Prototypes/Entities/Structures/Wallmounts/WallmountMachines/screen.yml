- type: entity
  parent: BaseWallmountMachine
  id: Screen
  name: screen
  description: Displays text or time.
  components:
  - type: Rotatable
  - type: TextScreenVisuals
    # DS14-start: align the new text renderer with the restored screen geometry.
    textOffset: 0,3
    timerOffset: 0,-4
    # DS14-end
    rows: 2
    rowLength: 5 # DS14 - match the width of the restored screen sprite.
    scrollEnabled: true
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Wallmounts/screen.rsi
    state: screen
    noRot: true # DS14 - the restored wall-mounted screen sprite has a fixed orientation.
  - type: Appearance
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: Screen
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: ShuttleTimer

# Dummy screen for comms console
- type: entity
  parent: Screen
  id: ScreenDummy
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    offset: 0, -0.25

- type: entity
  id: ArrivalsShuttleTimer
  parent: Screen
  name: arrivals screen
  description: Displays time of arrivals shuttle ETA.
  components:
  - type: DeviceNetwork
    deviceNetId: Private
    receiveFrequencyId: ArrivalsShuttleTimer
