    - state: lights_working
      map: ["enum.OrganPrinterVisuals.Working"]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OrganPrinterVisuals.Working:
        enum.OrganPrinterVisuals.Working:
          True: { visible: true }
          False: { visible: false }
