- type: entity
  id: OrganPrinter
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: ОрганоМех-3000
  description: Печатает свежие органы прямо из биомассы. Доставка тела не требуется, гарантия производителя не распространяется на мозг.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _DeadSpace/Structures/Machines/bioprinter.rsi
    snapCardinals: true
    layers:
    - state: roboprinter
      map: ["base"]
    - state: lights_working
      map: ["enum.OrganPrinterVisuals.Working"]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OrganPrinterVisuals.Working:
        enum.OrganPrinterVisuals.Working:
          True: { visible: true }
          False: { visible: false }
  - type: OrganPrinter
    printDuration: 6
    entries:
    - product: OrganHumanHeart
      cost: 30
    - product: OrganHumanLungs
      cost: 25
    - product: OrganHumanLiver
      cost: 25
    - product: OrganHumanKidneys
      cost: 20
    - product: OrganHumanStomach
      cost: 20
    - product: OrganHumanEyes
      cost: 15
    - product: OrganHumanTongue
      cost: 15
    - product: OrganHumanEars
      cost: 15
    - product: OrganHumanAppendix
      cost: 10
    - product: OrganHumanBrain
      cost: 50
    - product: OrganAnimalHeart
      cost: 30
    - product: OrganAnimalLiver
      cost: 25
    - product: OrganTajaranStomach
      cost: 20
    - product: OrganReptilianStomach
      cost: 20
    - product: OrganVulpkaninStomach
      cost: 20
  - type: MaterialStorage
    materialWhiteList:
    - Biomass
  - type: Machine
    board: OrganPrinterMachineCircuitboard
  - type: UserInterface
    interfaces:
      enum.OrganPrinterUiKey.Key:
        type: OrganPrinterBoundUserInterface
  - type: ActivatableUI
    key: enum.OrganPrinterUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: PointLight
    radius: 1.5
    energy: 1.2
    color: "#ff6b6b"
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StrongMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 500
