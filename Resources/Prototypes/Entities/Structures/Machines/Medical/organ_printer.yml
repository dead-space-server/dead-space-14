  - type: MaterialStorage
    materialWhiteList:
    - Biomass
  - type: Machine
    board: OrganPrinterMachineCircuitboard
  - type: UserInterface
    interfaces:
      enum.OrganPrinterUiKey.Key:
        type: OrganPrinterBoundUserInterface
  - type: ActivatableUI
    key: enum.OrganPrinterUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: PointLight
    radius: 1.5
    energy: 1.2
    color: "#ff6b6b"
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StrongMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
