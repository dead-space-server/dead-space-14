- type: entity
  id: OperatingTable
  parent: Bed
  name: operating table
  description: Special medical table for surgery. This one just seems to be a useless prop, though.
  components:
  - type: SurgerySurface
    place: Table
  - type: SurgeryTankMount # DS14
  - type: ItemSlots # DS14
    slots:
      surgery_tank:
        name: surgery-tank-slot
        whitelist:
          components:
          - GasTank
  - type: Sprite
    sprite: Structures/Furniture/Tables/optable.rsi
    state: operating_table
    noRot: true
  - type: Icon
    sprite: Structures/Furniture/Tables/optable.rsi
    state: operating_table
