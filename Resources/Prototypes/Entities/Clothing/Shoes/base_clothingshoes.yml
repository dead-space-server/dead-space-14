- type: entity
  abstract: true
  parent: [SolutionFood, SolutionToolNormal, Clothing]
  id: ClothingShoesBase
  components:
  - type: Clothing
    slots:
    - FEET
  # DS14
  - type: LimbCover
    zones:
    - FootLeft
    - FootRight
  - type: Sprite
    state: icon
  - type: Item
    size: Normal
  - type: Edible
    requiresSpecialDigestion: true
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 30
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
  - type: ProtectedFromStepTriggers
  #DS14-Start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_DeadSpace/Items/Handing/shoes/sneakers_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_DeadSpace/Items/Handing/shoes/sneakers_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_DeadSpace/Items/Handing/shoes/sneakers_drop.ogg
  #DS14-End

- type: entity
  abstract: true
  parent: [ClothingShoesBase, BaseSlicingRefinable]
  id: ClothingShoesBaseButcherable
  components:
  - type: ToolRefinable
    refineResult:
    - id: MaterialCloth1
      amount: 1
  - type: PhysicalComposition # 50% of the amount of cloth you'd obtain upon butchering
    materialComposition:
      Cloth: 50
  - type: FootstepModifier # Corvax-Sounds
    footstepSoundCollection:
      collection: FootstepBoots

# stuff common to all military boots
- type: entity
  abstract: true
  parent: [ClothingShoesBase, ClothingSlotBase]
  id: ClothingShoesMilitaryBase
  components:
  - type: Matchbox
  - type: ItemSlots
    slots:
      item:
        name: clothing-boots-sidearm
        priority: 4
        ejectOnBreak: true
        whitelist:
          tags:
          - Knife
          - Sidearm
  - type: FootstepModifier # DS14-Sounds
    footstepSoundCollection:
      collection: FootstepJackboots
      params:
        volume: -1

- type: entity
  abstract: true
  id: ClothingShoesBootsSecFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      item:
      - CombatKnife

- type: entity
  abstract: true
  parent: [ ClothingShoesBaseButcherable, TemperatureProtectionMinimal ]
  id: ClothingShoesBaseWinterBoots
  description: Fluffy boots to help survive even the coldest of winters.
