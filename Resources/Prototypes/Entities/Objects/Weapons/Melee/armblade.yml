- type: entity
  name: arm blade
  parent: BaseItem
  id: ArmBlade
  description: A grotesque blade made out of bone and flesh that can pry open doors and cleaves through people as a hot knife through butter.
  components:
  - type: Tool
    qualities:
    - Slicing
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    sprite: Objects/Weapons/Melee/armblade.rsi
    state: icon
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    wideAnimationRotation: 90
    attackRate: 1
    damage:
      types:
        Slash: 10
        Piercing: 10
        Caustic: 5
        Structural: 15
  - type: Item
    size: Normal
    sprite: Objects/Weapons/Melee/armblade.rsi
  - type: Prying
    speedModifier: 1.5 # Jaws of life speed
    pryPowered: true
  #DS14-Start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_DeadSpace/Items/Handing/knife/knife_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_DeadSpace/Items/Handing/knife/knife_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_DeadSpace/Items/Handing/knife/knife_drop.ogg
  #DS14-End
