- type: entity
  parent: [ BaseItem, MobCombat ]
  id: MrChips
  name: mr chips
  suffix: Dummy
  description: It's a dummy, dummy!
  components:
  - type: Sprite
    sprite: Objects/Fun/mrchips.rsi
    layers:
    - state: icon
  - type: Input
    context: "human"
  - type: DoAfter
  - type: VentriloquistPuppet
  - type: Item
    size: Normal
  # DS14-start: puppet prototypes live in this split file on the current branch.
  - type: PermanentStatusEffects
    statusEffects:
    - StatusEffectVentriloquistPuppetMuted
  # DS14-end
  - type: TypingIndicator
    proto: robot
  - type: TTS # Corvax-TTS
    voice: Baya
  - type: Actions
  - type: MobState
    allowedStates:
      - Alive
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/boxingpunch1.ogg
    angle: 30
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 2
  #DS14-Start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_DeadSpace/Items/Handing/glove_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_DeadSpace/Items/Handing/glove_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_DeadSpace/Items/Handing/glove_drop.ogg
  #DS14-End

- type: entity
  parent: MrChips
  id: MrDips
  name: mr dips
  components:
  - type: Sprite
    sprite: Objects/Fun/mrdips.rsi
    layers:
    - state: icon
  - type: TTS # Corvax-TTS
    voice: Baya
