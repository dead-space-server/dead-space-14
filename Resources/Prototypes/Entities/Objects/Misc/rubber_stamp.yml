- type: entity
  name: generic rubber stamp
  parent: BaseItem
  id: RubberStampBase
  description: A rubber stamp for stamping important documents.
  abstract: true
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-default
    stampState: "paper_stamp-generic"
    stampedColor: "#a23e3e"
    sound:
      path: /Audio/Items/Stamp/thick_stamp_sub.ogg
      params:
        volume: -2
        maxDistance: 5
  - type: Sprite
    sprite: Objects/Misc/stamps.rsi
    state: stamp-mime
  - type: Item
    sprite: Objects/Misc/stamps.rsi # DS14 - keep inherited in-hand layers on the common RSI when a child replaces its world sprite.
    size: Tiny
    inhandVisuals:
      left:
      - state: stamp-inhand-left
      - state: handle-inhand-left
        color: "#f8f8f8"
      right:
      - state: stamp-inhand-right
      - state: handle-inhand-right
        color: "#f8f8f8"
  - type: StealTarget
    stealGroup: Stamp
  #DS14-Start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_DeadSpace/Items/Handing/disk_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_DeadSpace/Items/Handing/disk_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_DeadSpace/Items/Handing/disk_drop.ogg
  #DS14-End

