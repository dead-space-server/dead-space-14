- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: AccessBreakerUnlimited
  suffix: Unlimited
  name: authentication disruptor
  description: A hacked access configurator, specialized to unlock and erase access from digital locks.
  components:
  - type: Emag
    emagImmuneTag: AccessBreakerImmune
    emagType: Access
  - type: Sprite
    sprite: Objects/Tools/access_breaker.rsi
    state: syndi-icon
  - type: Item
    sprite: Objects/Tools/access_breaker.rsi
  #DS14-Start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_DeadSpace/Items/Handing/gas_analyzer/gas_analyzer_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_DeadSpace/Items/Handing/gas_analyzer/gas_analyzer_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_DeadSpace/Items/Handing/gas_analyzer/gas_analyzer_drop.ogg
  #DS14-End

- type: entity
  parent: AccessBreakerUnlimited
  id: AccessBreaker
  suffix: Limited
  components:
  - type: LimitedCharges
  - type: AutoRecharge
  - type: StaticPrice
    price: 2000

- type: entity
  parent: [ BaseXenoborgContraband, AccessBreaker ]
  id: XenoborgAccessBreaker
  suffix: Limited
  name: xenoborg authentication disruptor
  description: An access scrubbing device, engineered by xenoborgs for disrupting digital locks.
  components:
  - type: Emag
    emagImmuneTag: AccessBreakerImmune
    emagType: Access
  - type: Sprite
    sprite: Objects/Tools/access_breaker.rsi
    state: xorg-icon
