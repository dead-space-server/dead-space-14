- type: entity
  id: FloorChasmEntity
  name: chasm
  description: You can't even see the bottom.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Chasm
#DS14-start
  - type: Drain
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 1000
  - type: DumpableSolution
    solution: drainBuffer
#DS14-end
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.25
    blacklist:
      tags:
      - Catwalk
  # DS14-Start: ignore entities that are guaranteed not to fall into chasms.
  - type: StepTriggerCollisionFilter
    ignoreCanMoveInAir: true
    ignoreLavalandChasmImmune: true
  # DS14-End
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    sprite: Tiles/TileEntities/chasm.rsi
    drawdepth: BelowFloor
  - type: Icon
    sprite: Tiles/TileEntities/liquid-phoron.rsi
    state: full
  - type: IconSmooth
    key: chasm
    states:
    - !type:CornerSpriteSmoothing
      mask: [ chasm, walls ]
      base: chasm_
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - WallLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: Tag
    tags:
    - HideContextMenu
