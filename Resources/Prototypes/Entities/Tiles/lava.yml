- type: entity
  id: FloorLavaEntity
  name: lava
  description: Don't jump in. It's not worth it, no matter how funny it is.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Lava
  - type: TileEmission
    color: "#FF4500"
  # DS14-Start: ash and sparks rising from the lava.
  - type: LavalandParticleEmitter
    kind: Ember
    rate: 0.35
    colors: [ "#ffb347", "#ff7a1f", "#ffd27a", "#ff4d1a" ]
    lifetimeMin: 0.9
    lifetimeMax: 2
    sizeMin: 0.025
    sizeMax: 0.055
    speed: 0.9
    spread: 0.45
    altKind: Ash
    altRate: 0.2
    altColors: [ "#6b6460", "#8a827c", "#4a4542" ]
  # DS14-End
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
        - Catwalk
  # DS14-Start: lavaland fauna and flying entities do not need persistent lava contacts.
  - type: StepTriggerCollisionFilter
    ignoreCanMoveInAir: true
    ignoreLavalandFauna: true
  # DS14-End
  - type: TileEntityEffect
    effects:
    - !type:Flammable
      multiplier: 3.75
      multiplierOnExisting: 0.75
    - !type:Ignite
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: Tiles/Planet/lava.rsi
    drawdepth: BelowFloor
    layers:
      - state: lava
        shader: unshaded
  - type: Icon
    sprite: Tiles/Planet/lava.rsi
    state: full
  - type: IconSmooth
    key: floor
    additionalKeys:
    - walls
    base: lava
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
  - type: Tag
    tags:
      - HideContextMenu
