- type: entity
  save: true  # DeadSpace: существа должны переживать перезагрузку карты
  parent:
  - BaseMob
  - MobDamageable
  - MobPolymorphable
  id: BaseSimpleMob
  suffix: AI
  abstract: true
  components:
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
      Acidic: [Touch, Ingestion]
  - type: MovementSpeedModifier
    baseWalkSpeed : 4
    baseSprintSpeed : 4
  - type: StatusEffects
    allowed:
    - Electrocution
    - TemporaryBlindness
    - Pacified
    - Flashed
    - RadiationProtection
    - Adrenaline
  - type: Buckle
  - type: StandingState
  - type: Tag
    tags:
    - DoorBumpOpener
    - StunImmune
  - type: Sanity # DS14
  - type: ExamineBlood # DS14
  - type: Language # DS14
  - type: Blindable

- type: entity
  abstract: true
  parent:
  - BaseSimpleMob
  - MobAtmosExposed
  - MobCombat
  - MobBloodstream
  - MobFlammable
  id: SimpleSpaceMobBase # Mob without barotrauma, freezing and asphyxiation (for space carps!?)
  suffix: AI
  components:
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: HTN
    rootTask:
      task: IdleCompound
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
  - type: Body
    prototype: Animal
  - type: Climbing
  - type: NameIdentifier
    group: GenericNumber
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      80: 0.5
  - type: MobPrice
    price: 1000 # Living critters are valuable in space.
  - type: Perishable

- type: entity
  parent:
  - MobAtmosExposed # DS14: no lungs, so no respirator and no barotrauma
  - SimpleSpaceMobBase
  # DS14-start: keep satiation on the current air-breathing simple-mob base.
  - BaseHungerThirstSlowdown
  # DS14-end
  id: SimpleMobBase # for air breathers
  suffix: AI
  abstract: true
  components:
  - type: Satiation
    satiations:
      Hunger:
        prototype: SimpleMobBaseHunger
      Thirst:
        prototype: SimpleMobBaseThirst
  - type: StatusEffects
    allowed:
    - SeeingRainbows # DS14
    - Drunk # DS14
    - Electrocution
    - TemporaryBlindness
    - Pacified
    - Flashed
    - RadiationProtection
    - Adrenaline
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 150
  - type: MobPrice
    price: 150
  - type: FloatingVisuals
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 250
    sweatHeatRegulation: 500
    shiveringHeatRegulation: 500
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: TemperatureDamage
    heatDamageThreshold: 325
    coldDamageThreshold: 260
    coldDamage:
      types:
        Cold: 1
    heatDamage:
      types:
        Heat: 1.5

# DS14: cockroaches, mice, bees and butterflies. No blood, lungs, hunger or organs.
- type: entity
  parent:
  - BaseMob
  - MobDamageable
  - MobPolymorphable
  - MobCombat
  - MobFlammable
  id: CritterMobBase
  suffix: AI
  abstract: true
  components:
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
      Acidic: [Touch, Ingestion]
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: StatusEffects
    allowed:
    - Electrocution
    - TemporaryBlindness
    - Pacified
    - Flashed
    - RadiationProtection
    - Adrenaline
  - type: Buckle
  - type: StandingState
  - type: Tag
    tags:
    - DoorBumpOpener
    - StunImmune
  - type: Language
  - type: Blindable
  - type: CritterGraze
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: HTN
    constantlyReplan: false
    planCooldown: 2
    rootTask:
      task: CritterSnackCompound
  - type: Body
    prototype: Critter
  - type: Climbing
  - type: NameIdentifier
    group: GenericNumber
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      80: 0.5
  - type: MobPrice
    price: 50
  - type: Perishable
  - type: ThermalVisible
