- type: entity
  parent: [ MobHuman, StorePresetChangeling ]
  id: MobLing
  name: Urist McLing
  suffix: Non-Antag
  components:
  - type: ChangelingDevour
  - type: ChangelingIdentity
  - type: ChangelingTransform
  - type: AddMetabolism
    addedMetabolizer: Changeling
  - type: DestructionResistance
  - type: RevolutionaryImmune
  - type: ZombieImmune
  - type: ActionGrant
    removeOnShutdown: false
    actions:
    - ActionChangelingStore
    - ActionChangelingStasis
  - type: SatiationGrant
    removeOnShutdown: false
    satiation:
      Chemicals:
        prototype: ChemicalsChangeling
  - type: Store
    balance:
      ChangelingDNA: 60
  - type: UserInterface # DS14 - this engine does not create the store BUI automatically.
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
        requireInputValidation: false
      # DS14-start: role-assigned changelings need this BUI before the transform component starts.
      enum.ChangelingTransformUiKey.Key:
        type: ChangelingTransformBoundUserInterface
      # DS14-end
      enum.VoiceMaskUIKey.Key:
        type: VoiceMaskBoundUserInterface

- type: entity
  parent:
  - MobRespirator
  - MobAtmosStandard
  - SimpleSpaceMobBase
  id: MobHeadSlug
  name: headslug
  description: A small, slug-like creature with a large, gaping maw. It's covered in a thick, slimy mucus.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 15
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: Sprite
    drawdepth: SmallMobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: slug
      sprite: Mobs/Animals/headslug.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: slug
      Critical:
        Base: slug_dead
      Dead:
        Base: slug_dead
  - type: Deathgasp
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritFakeDeath
      - ActionCritLastWords
  - type: MobThresholds
    thresholds:
      0: Alive
      25: Critical
      50: Dead
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.25
    damageRecovery:
      types:
        Asphyxiation: -0.25
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.1
  - type: MovementSpeedModifier # Slightly faster than regular mobs
    baseWalkSpeed: 3
    baseSprintSpeed: 5
  - type: MeleeWeapon
    altDisarm: false
    damage:
      types:
        Blunt: 5
        Structural: 15 # to destroy lockers in which bodies could be hidden
  - type: ChangelingSlug
  - type: NightVision # DS14 - local night-vision implementation.
    isNightVision: true
    color: "#FFFFFF15"
  - type: ActionGrant
    actions:
    - ActionChangelingStasisWeak
  - type: ReplacementAccent
    accent: genericAggressive
  - type: Tag # Removes DoorBumpOpener
    tags:
      []

- type: entity # dummy prototype for the store listing
  id: ChangelingFleshClothingAbilityStoreDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: ChangelingFleshClothingAbility
    clothingPrototypes:
      shoes: ChangelingFleshClothingFeet
      jumpsuit: ChangelingFleshClothingInner
      outerClothing: ChangelingFleshClothingOuter
      gloves: ChangelingFleshClothingGloves
      neck: ChangelingFleshClothingNeck
      mask: ChangelingFleshClothingMask
      eyes: ChangelingFleshClothingEyes
      ears: ChangelingFleshClothingEars
      head: ChangelingFleshClothingHead
      suitstorage: ChangelingFleshClothingSuitStorage
      #id: TODO: chameleon PDA that is not a functional PDA
      belt: ChangelingFleshClothingBelt
      back: ChangelingFleshClothingBack

- type: entity # dummy prototype for the store listing
  id: ChangelingVoiceMimicDummy
  categories: [ HideSpawnMenu ]
  components:
  - type:  VoiceMask
    action: ActionChangelingVoiceMimic
    changeIDName: false
    # this is set to false as to not mess with a changeling's ability to disguise.
    accentHide: false

- type: entity # dummy prototype for the store listing
  id: ChangelingNightVisionDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: NightVision
    isNightVision: false
    actionToggleNightVision: ActionChangelingNightVision

- type: entity # dummy prototype for the store listing
  id: ChangelingFakeMindshieldDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: FakeMindShield
  - type: ActionGrant # DS14 - local fake mindshield component does not grant its own action.
    removeOnShutdown: false
    actions:
    - ActionChangelingFakeMindshieldToggle
