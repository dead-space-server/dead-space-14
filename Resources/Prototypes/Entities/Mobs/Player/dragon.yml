# DS14-start
- type: damageModifierSet
  id: DragonScale
  coefficients:
    Blunt: 0.7
    Piercing: 0.7
    Slash: 0.7
    Heat: 0.7
    Radiation: 0.7
    Caustic: 0.7
# DS14-end

- type: entity
  parent: [ SimpleSpaceMobBase, FlyingMobBase, BaseSlicingRefinableButchering, MobNightVision, BaseMobIrradiated ]
  id: BaseMobDragon
  suffix: ""
  name: space dragon
  description: A flying leviathan, loosely related to space carps.
  abstract: true
  components:
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 650
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-space-dragon-name
    description: ghost-role-information-space-dragon-description
    rules: ghost-role-information-space-dragon-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: HTN
    rootTask:
      task: XenoCompound
    blackboard:
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: NpcFactionMember
    factions:
    - Dragon
  - type: Speech
    speechVerb: LargeMob
  - type: CombatMode
  - type: MobMover
  - type: InputMover
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 5
    baseWeightlessModifier: 1.5
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        alive: Rainbow
  - type: Sprite
    sprite: Mobs/Aliens/Carps/dragon.rsi
    noRot: true
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: alive-unshaded
    - map: [ "eyes" ]
      state: alive-eyes
      shader: unshaded
  - type: Appearance
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
        BaseUnshaded: alive-unshaded
      Critical:
        Base: crit
        BaseUnshaded: crit-unshaded
      Dead:
        Base: dead
        BaseUnshaded: dead-unshaded
#ds14-start
  - type: GenericVisualizer
    visuals:
      enum.MobStateVisuals.State:
        eyes:
          Alive: { visible: true }
          Critical: { visible: false }
          Dead: { visible: false }
#ds14-end
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.40
        density: 100
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: MobState
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritLastWords
  - type: MobThresholds
    thresholds:
      0: Alive
      500: Critical #DS14
      525: Dead #DS14
  # DS14-start
  - type: Damageable
    damageModifierSet: DragonScale
  - type: ExplosionResistance
    worn: false # only the dragon itself gets this resistance
    damageCoefficient: 0.6 # 40% explosion resistance
  # DS14-end
  - type: SlowOnDamage
    speedModifierThresholds:
      325: 0.7 #DS14
      415: 0.5 #DS14
  # disable taking damage from fire, since its a fire breathing dragon
  - type: Flammable
    damage:
      types: {}
  - type: StatusEffects # Overwriting basesimplemob to remove flash, getting flashed as dragon just feelsbad
    allowed:
    - Electrocution
    - Pacified
    - Adrenaline
  - type: Temperature
  # DS14-start
  - type: TemperatureDamage
    heatDamageThreshold: 100000
    coldDamageThreshold: -100000
    heatDamage:
      types: {}
    coldDamage:
      types: {}
  # DS14-end
  - type: Metabolizer
    solutionOnBody: false
    updateInterval: 0.25
    metabolizerTypes: [ Dragon ]
    stages: [ Digestion, Bloodstream ]
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatDragon
      amount: 2
  - type: InteractionPopup
    successChance: 0.25 # It's no goose, but you better smell like carp.
    interactSuccessString: petting-success-dragon
    interactFailureString: petting-failure-dragon
    interactFailureSound:
      path: /Audio/Animals/space_dragon_roar.ogg
    soundPerceivedByOthers: false # A 75% chance for a loud roar would get old fast.
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Piercing: 19 #DS14
        Slash: 17 #DS14
  - type: Devourer
    foodPreferenceWhitelist:
      components:
      - HumanoidAppearance
    stomachStorageWhitelist:
      components:
      - MobState
    chemical: Ichor
    healRate: 7.0 #DS14
    whitelist:
      components:
      - MobState
      - Door
      - Wall
  - type: AntiRottingContainer
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - StunImmune
  - type: Puller
    needsHands: false
  - type: RandomMetadata
    nameSegments:
    - NamesDragon
    - NamesDragonTitle
    nameFormat: name-format-dragon
  - type: Grammar
    attributes:
      proper: true
  - type: NameIdentifier
    group: null  # Strips the numeric identifier from the dragon's name, since they already have randomly-generated names anyway
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 2.5 # fast because dragon strong
    useSound:
      path: /Audio/Items/crowbar.ogg
  # DS14-start
  - type: Language
    selectedLanguage: CarpDragonLanguage
    knownLanguages:
    - CarpDragonLanguage
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - CarpDragonChannel
  - type: ActiveRadio
    channels:
    - CarpDragonChannel
  - type: NightVision
    color: "#22334411"
    animation: true
    transitionSpeed: 100
  - type: DeadSpaceJumpAbility
    jumpSound:
      collection: MantisRush
  - type: AntiRottingContainer
  - type: NecromorfAfterInfection
    necroPrototype: NecroDragon # DS14
  - type: GhostRoleNotifys
    groupPrototype: Dragonping
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 700
      behaviors:
      - !type:GibBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 1500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:BurnBodyBehavior
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 15
      behaviors:
      - !type:PopupBehavior
        popup: mouth-taste-metal
        popupType: LargeCaution
        targetOnly: true
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 40
      behaviors:
      - !type:VomitBehavior
  # DS14-end

- type: entity
  parent: BaseMobDragon
  id: MobDragon
  components:
  # DS14-start
  - type: Stamina
    baseCritThreshold: 200
  # DS14-end
  - type: Dragon
    spawnRiftAction: ActionSpawnRift
  - type: GhostRole
    mindRoles:
    - MindRoleDragon
  - type: ActionGrant
    actions:
    - ActionDragonsBreath
  - type: GuideHelp
    guides:
    - MinorAntagonists

- type: entity
  categories: [ HideSpawnMenu ]
  id: DragonsBreathGun
  name: dragon's lung
  description: For dragon's breathing.
  components:
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 8 #ds14
    rechargeSound:
      path: /Audio/Animals/space_dragon_roar.ogg
  - type: BasicEntityAmmoProvider
    proto: ProjectileDragonsBreath
    capacity: 1
    count: 1
  - type: Gun
    soundGunshot:
      path: /Audio/Animals/space_dragon_roar.ogg
    soundEmpty: null
    projectileSpeed: 7 #DS14

- type: entity
  parent: BaseMobDragon
  id: MobDragonDungeon
  suffix: Dungeon
  components:
  - type: GhostRole
    description: ghost-role-information-space-dragon-dungeon-description
    rules: ghost-role-information-space-dragon-dungeon-rules
    requirements:
    - !type:OverallPlaytimeRequirement
      time: 36000 # 10h overall
    raffle:
      settings: default
  - type: SlowOnDamage
    speedModifierThresholds:
      100: 0.7
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  # less meat spawned since it's a lot easier to kill
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatDragon
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 12

- type: entity
  parent: BaseAction
  id: ActionSpawnRift
  name: Summon Carp Rift
  description: Summons a carp rift that will periodically spawns carps.
  components:
  - type: Action
    useDelay: 1
    priority: 3
  - type: Sprite
    sprite: Interface/Actions/carp_rift.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:DragonSpawnRiftActionEvent

- type: entity
  parent: BaseAction
  id: ActionDevour
  name: "[color=red]Devour[/color]"
  description: Attempt to break a structure with your jaws or swallow a creature.
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: 1
  - type: Sprite
    sprite: Interface/Actions/devour.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
    - state: icon-on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
      - Door
      - Wall
    event: !type:DevourActionEvent

- type: entity
  parent: BaseAction
  id: ActionDragonsBreath
  name: "[color=orange]Dragon's Breath[/color]"
  description: Spew out flames at anyone foolish enough to attack you!
  components:
  - type: Action
    useDelay: 5
    # TODO: actual sprite and iconOn
    itemIconStyle: BigAction
    priority: 2
    sound: !type:SoundPathSpecifier
      path: /Audio/Animals/space_dragon_breath.ogg
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileDragonsBreath
      projectileSpeed: 5
      rearVelocityCompensation: 1.0 # slow projectile, speed it up if shooting backwards

- type: entity
  parent: Smoke
  id: BloodSmoke
  name: smoke
  categories: [ HideSpawnMenu ]
  components:
  - type: Smoke
    spreadAmount: 3
    duration: 2
  - type: Sprite
    sprite: Effects/chemsmoke.rsi
    state: chemsmoke_white
