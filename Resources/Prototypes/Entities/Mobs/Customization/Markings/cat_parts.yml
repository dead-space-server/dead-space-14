- type: marking
  id: CatEars
  bodyPart: HeadTop
  markingCategory: HeadTop
  speciesRestriction: [Human, Dwarf]
  sponsorOnly: true
  coloring:
    default:
      type: !type:CategoryColoring
        category: Hair
      fallbackTypes:
      - !type:SkinColoring {}
  sprites:
  - sprite: Mobs/Customization/cat_parts.rsi
    state: ears_cat_outer
  - sprite: Mobs/Customization/cat_parts.rsi
    state: ears_cat_inner
    coloring:
      type: !type:SimpleColoring
        color: '#FFFFFF'

- type: marking
  id: CatTail
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Human, Dwarf]
  sponsorOnly: true
  coloring:
    default:
      type: !type:CategoryColoring
        category: Hair
      fallbackTypes:
      - !type:CategoryColoring
        category: FacialHair
      - !type:SkinColoring {}
  sprites:
  - sprite: Mobs/Customization/cat_parts.rsi
    state: tail_cat_wag
