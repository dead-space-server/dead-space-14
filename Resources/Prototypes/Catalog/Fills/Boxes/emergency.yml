- type: entity
  parent: BoxCardboardSmall
  id: BaseBoxSurvival
  abstract: true
  components:
  - type: Item
    shape:
      - 0,0,1,2
  - type: Storage
    grid:
      - "0,0,1,2"

- type: entity
  parent: BaseBoxSurvival
  id: BoxSurvival
  name: O2 survival box
  description: A small box containing a breath mask, an emergency oxygen tank, and an emergency medipen. Standard-issue for most oxygen-breathing crew.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: EmergencyOxygenTankFilled
        - id: EmergencyMedipen
        - id: Flare
        - id: PillPotassiumIodide
  - type: Sprite
    layers:
    - state: internals
    - state: emergencytank

# DS14-Start
- type: entity
  parent: BoxBase
  id: BoxCardboardERTGamma
  name: cardboard box
  description: A cardboard box for storing things.
  suffix: ERT
  components:
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,3
  - type: Sprite
    layers:
    - state: internals
    - state: emergencytank
  - type: StorageFill
    contents:
      - id: ClothingMaskGasERT
      - id: DrinkMREFlask
      - id: BluespaceHandHeldMassScanner
      - id: Flare
      - id: EmergencyMedipen
      - id: AirlossAutoInjector
      - id: Flare
      - id: Flash
      - id: DoubleEmergencyOxygenTankFilled
      - id: NutritiousMedipen
      - id: NutritiousMedipen

