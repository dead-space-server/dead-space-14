- type: entity
  name: C4 box
  parent: BoxCardboard
  id: BoxC4ERT
  description: A box full of C-4.
  components:
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,3
  - type: StorageFill
    contents:
      - id: C4
        amount: 5
      - id: RemoteSignallerAdvanced
  - type: Sprite
    layers:
      - state: box
      - state: flashbang

- type: entity
  name: box "Blissful Sleep"
  parent: BoxCardboard
  id: BoxBlissfulSleep
  description: A box full lethal injection
  suffix: lethal injection
  components:
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,2
  - type: StorageFill
    contents:
      - id: SyringeLexorin
        amount: 9
  - type: Sprite
    layers:
      - state: box
      - state: syringe
