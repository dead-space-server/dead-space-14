- type: entity
  parent: CrateSecgear
  id: CrateRestraints
  name: restraints crate
  description: Contains two boxes each of handcuffs and zipties. Requires Security access to open.
  components:
  - type: StorageFill
    contents:
      - id: BoxHandcuff
        amount: 2
      - id: BoxZiptie
        amount: 2

- type: entity
  parent: CrateSecgear
  id: CrateSecurityBiosuit
  name: security bio suit crate
  description: Contains 3 biohazard suits to ensure that no disease will distract you from your duties. Requires Security access to open.
  components:
  - type: StorageFill
    contents:
      - id: ClothingOuterBioSecurity
        amount: 3
      - id: ClothingHandsGlovesLatex
        amount: 3
      - id: ClothingMaskSterile
        amount: 3

- type: entity
  parent: CrateSecgear
  id: CrateSecurityTrackingMindshieldImplants
  name: implanter crate
  description: Contains 4 MindShield implants and 4 tracking implant. Requires Security access to open.
  components:
  - type: StorageFill
    contents:
      - id: MindShieldImplanter
        amount: 4
      - id: TrackingImplanter
        amount: 2

- type: entity
  parent: CrateSecgear
  id: CrateSecNonlethalThrowables
  name: nonlethal throwables crate
  description: Contains one box each of flashbangs, stingers, tear gas grenades, and four bolas. Requires Security access to open.
  components:
  - type: StorageFill
    contents:
    - id: BoxFlashbang
      amount: 1
    - id: BoxStinger
      amount: 1
    - id: BoxTearGas
      amount: 1
    - id: Bola # replace with 4 e-bolas when added
      amount: 4

