- type: entity
  parent: Bed
  id: ADTDeckChair
  name: деревянный шезлонг
  description: Шезлонг для приобретения ровного загара под светом ближайшей звезды
  components:
  - type: Sprite
    sprite: _ADT/Structures/Furniture/deckchair.rsi
    state: deckchair
  - type: Construction
    graph: bed
    node: adtdeckchair
  # DS14-start
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 2
  # DS14-end
