- type: entity
  parent: ClothingOuterHardsuitBase
  id: ADTClothingOuterHardsuitCybersunBodyGuard
  name: скафандр телохранителя
  description: Тяжелобронированный скафандр элитного подразделения телохранителей в чёрно красном цвете. Вводит лекарства если вы упадёте в крит. Имеет привязку к ДНК, также не имеет летальный исход при надевании на другую особь данный скафанр.
  components:
  - type: Sprite
    sprite: _ADT/Clothing/OuterClothing/Hardsuits/cybersunbodyguard.rsi
  - type: Clothing
    sprite: _ADT/Clothing/OuterClothing/Hardsuits/cybersunbodyguard.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.5
        Heat: 0.5
        Radiation: 0.5
        Caustic: 0.5
  - type: AutoInjectReagentClothingOnAllowedState
    durationRegenReagents: 180
    allowedStates:
    - Critical
    reagents:
      DexalinPlus: 5
      Saline: 10
      Epinephrine: 15
      TranexamicAcid: 5
      Omnizine: 10
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ADTClothingHeadHelmetHardsuitCybersunBodyGuard
  - type: StaminaResistance #DS14
    damageCoefficient: 0.5
  - type: HardsuitIdentification
    nonlethal: true
  - type: Speech
  - type: TTS
    voice: Adjutant

- type: entity
  parent: ClothingOuterHardsuitBase
  id: ADTClothingOuterHardsuitCybersunCrysis
  name: скафандр суперсолдата Cybersun
  description: Самая передовая, секретная технология CyberSun в сфере защиты. Кажется эта разработка ведёт к созданию супер солдат. Пахнет пластитаном и бесчестным боем.
  components:
  - type: Sprite
    sprite: _ADT/Clothing/OuterClothing/Hardsuits/cybersun_crysis_hardsuit.rsi
  - type: Clothing
    sprite: _ADT/Clothing/OuterClothing/Hardsuits/cybersun_crysis_hardsuit.rsi
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: PressureProtection
    highPressureMultiplier: 0.2
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.3
        Slash: 0.3
        Piercing: 0.2
        Heat: 0.2
        Radiation: 0.1
        Caustic: 0.2
        Stun: 0.05 # what is stun?
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ADTClothingHeadHelmetHardsuitCybersunCrysis
  - type: HardsuitIdentification
  - type: Speech
  - type: TTS
    voice: Adjutant

