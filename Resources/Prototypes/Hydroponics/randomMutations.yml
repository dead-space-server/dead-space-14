- type: randomPlantMutationList
  id: RandomPlantMutations
  mutations:
    - name: Sentient
      description: mutation-plant-sentient
      baseOdds: 0.0072
      appliesToProduce: false
      persists: false
      effect: !type:MakeSentient # existing effect.
    - name: Slippery
      description: mutation-plant-slippery
      baseOdds: 0.036
      appliesToPlant: false
      effect: !type:Slipify
    - name: Unviable
      baseOdds: 0.109
      persists: false
      effect: !type:PlantChangeTraits
        trait: PlantTraitUnviable
        toggle: true # DS14
    - name: ChangeWaterConsumption
      baseOdds: 0.018
      persists: false
      effect: !type:PlantChangeStat
        targetComponent: PlantGrowth
        targetDataField: WaterConsumption
        applyRange:
          min: 0.3
          max: 0.9
        up: !type:PlantAdjustWaterConsumption
          amount: 0.1 # DS14
        down: !type:PlantAdjustWaterConsumption
          amount: -0.1 # DS14
