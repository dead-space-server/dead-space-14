- type: entity
  id: ToggleNoiseCancellingAction
  name: Перекл. шумоподавление
  description: Переключает режим шумоподавления.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: Clothing/Multiple/headphones.rsi
      state: icon-on
    itemIconStyle: BigAction
  - type: InstantAction
    event: !type:ToggleNoiseCancellingActionEvent {}

- type: entity
  parent: BaseAction
  id: ActionDrinkFromBeerHat
  name: Попить
  description: Попить из пивной шляпы?
  components:
  - type: Action
    useDelay: 1
  - type: InstantAction
    event: !type:ActionEat