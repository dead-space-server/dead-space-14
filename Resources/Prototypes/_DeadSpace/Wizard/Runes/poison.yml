# Сущности

- type: entity
  parent: BaseBullet
  id: RuneProjectileVenom
  name: ядовитый плевок
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: spell
      color: "#8bd450"
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Poison: 14

- type: entity
  id: RuneMiasmaTile
  name: миазмы
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: spell
      color: "#8bd45088"
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        layer:
        - MidImpassable
  - type: DamageContacts
    damage:
      types:
        Poison: 3
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.75
    sprintSpeedModifier: 0.75
  - type: PointLight
    color: "#8bd450"
    radius: 1.5
    energy: 1
  - type: TimedDespawn
    lifetime: 12
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: RuneToxinPuddle
  parent: PuddleTemporary
  suffix: Маг, токсин
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionContainerManager
    solutions:
      puddle:
        maxVol: 1000
        reagents:
        - ReagentId: Toxin
          Quantity: 20

- type: entity
  id: RuneViperBloodTemplate
  categories: [ HideSpawnMenu ]
  components:
  - type: RuneWard
    modifier: RuneViperBlood

- type: damageModifierSet
  id: RuneViperBlood
  coefficients:
    Poison: 0
    Radiation: 0.5

- type: entity
  id: RuneAnimatePoisonTemplate
  categories: [ HideSpawnMenu ]
  components:
  - type: NpcFactionMember
    factions:
    - Wizard
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4
  - type: MeleeWeapon
    animation: WeaponArcBite
    wideAnimation: WeaponArcBite
    altDisarm: false
    soundHit: /Audio/Effects/bite.ogg
    range: 1.2
    angle: 0.0
    damage:
      types:
        Blunt: 3
        Poison: 6
  - type: PointLight
    color: "#8bd450"
    radius: 1.5
    energy: 1

- type: entity
  parent: MobSmallPurpleSnake
  id: RuneSummonSnake
  suffix: Призыв мага
  categories: [ HideSpawnMenu ]
  components:
  - type: NpcFactionMember
    factions:
    - Wizard

- type: entity
  parent: MobCobraSpace
  id: RuneSummonCobra
  suffix: Призыв мага
  categories: [ HideSpawnMenu ]
  components:
  - type: NpcFactionMember
    factions:
    - Wizard

- type: polymorph
  id: RuneMorphCockroach
  configuration:
    entity: MobCockroach
    forced: true
    transferName: true
    transferDamage: true
    inventory: None
    revertOnCrit: true
    revertOnDeath: true
    duration: 20
