# Смерть

- type: wizardRuneFusion
  id: RuneFusionAsh
  name: rune-fusion-ash
  first: RuneElementDeath
  second: RuneElementFire
  strain: 14
  loudness: 2
  effects:
  - !type:RuneDamageEffect
    target: Auto
    radius: 2.5
    ignoreResistances: true
    damage:
      types:
        Heat: 12
  - !type:RuneGibEffect
    target: Auto
    radius: 2.5
    onlyDead: true

- type: wizardRuneFusion
