  - !type:RuneStaminaEffect
    target: Auto
    radius: 2.5
    amount: 50

- type: wizardRuneFusion
  id: RuneFusionTime
  name: rune-fusion-time
  first: RuneElementDeath
  second: RuneElementLife
  strain: 8
  loudness: 1
  absurdity: 1
  effects:
  - !type:RuneDecayEffect
    radius: 2.5
    damage:
      types:
        Structural: 40
        Blunt: 20
  - !type:RuneSlowEffect
    target: Auto
    radius: 2.5
    time: 15
    multiplier: 0.7
  - !type:RuneStaminaEffect
    target: Auto
    radius: 2.5
    amount: 25
  - !type:RuneSpeakEffect
    target: Auto
    radius: 2.5
    lines: RuneOldAgeLines
  formEffects:
    RuneFormSelf:
    - !type:RuneDamageEffect
      target: Caster
      ignoreResistances: true
      damage:
        groups:
          Brute: -20
          Burn: -20
          Toxin: -10
    - !type:RuneExtinguishEffect
      target: Caster
    RuneFormWave:
    - !type:RuneDecayEffect
      aroundCaster: true
      radius: 4
      damage:
        types:
          Structural: 30
          Blunt: 15
    - !type:RuneSlowEffect
      target: AroundCaster
      radius: 4
      time: 12
      multiplier: 0.7
    - !type:RuneSpeakEffect
      target: AroundCaster
      radius: 4
      lines: RuneOldAgeLines
    RuneFormUltimate:
    - !type:RuneTimeStopEffect
      radius: 5
      duration: 30

