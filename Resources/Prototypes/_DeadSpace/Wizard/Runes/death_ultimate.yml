# Срывы смерти

- type: wizardRuneSurge
  id: RuneSurgeDeath
  entries:
  - weight: 3
    popup: rune-surge-death-touch
    effects:
    - !type:RuneDamageEffect
      target: Caster
      damage:
        types:
          Asphyxiation: 20
          Cold: 10
  - weight: 2
    popup: rune-surge-death-vision
    effects:
    - !type:RuneParalyzeEffect
      target: Caster
      time: 4

- type: wizardRuneSurge
  id: RuneFatalDeath
  entries:
  - popup: rune-fatal-death
    effects:
    - !type:RuneDamageEffect
      target: Caster
      ignoreResistances: true
      damage:
        types:
          Asphyxiation: 500

# Сущности

- type: entity
  id: RuneTimeStopField
  name: остановленное время
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Structures/Walls/clock.rsi
    drawdepth: Overdoors
    layers:
    - state: wall_gear
      shader: unshaded
      color: "#ffe9a8"
  - type: PointLight
    color: "#ffe9a8"
    radius: 6
    energy: 1.5
  - type: TimedDespawn
    lifetime: 120

- type: entity
  id: RuneTimeStopTile
  name: застывший миг
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Tiles/Misc/clockwork/clockwork_lattice.rsi
    drawdepth: FloorObjects
    layers:
    - state: clock_lattice
      color: "#ffe9a8aa"
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: RuneTimeStopGear
  name: часовая шестерня
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Structures/Walls/clock.rsi
    drawdepth: Overdoors
    layers:
    - state: clock0
      shader: unshaded
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: BasePortal
  id: RuneWizardPortal
  name: рунный портал
  description: Мерцающая дверь в пространстве. Ведёт туда, куда захотел маг.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: portal-blue
      color: "#c08aff"
  - type: PointLight
    color: "#a77bff"
    radius: 3
    energy: 1.5
    netsync: false

- type: entity
  id: RuneArenaBarrier
  name: барьер арены
  description: Отсюда только смотреть.
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Sprite
    sprite: Structures/Magic/forcewall.rsi
    layers:
    - state: forcewall
      color: "#ff6ad5aa"

- type: startingGear
  id: RuneArenaChallengerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorPurple
    head: ClothingHeadHatVioletwizard
    outerClothing: ClothingOuterWizardViolet
    shoes: ClothingShoesWizard

- type: entity
  parent: MobHuman
  id: RuneArenaChallenger
  suffix: Арена мага
  categories: [ HideSpawnMenu ]
  components:
  - type: GhostRole
    name: ghost-role-information-rune-challenger-name
    description: ghost-role-information-rune-challenger-description
    rules: ghost-role-information-rune-challenger-rules
  - type: GhostTakeoverAvailable
  - type: Loadout
    prototypes:
    - RuneArenaChallengerGear
  - type: RandomMetadata
    nameSegments:
    - NamesWizardFirst
    - NamesWizardLast
    nameFormat: name-format-wizard

- type: entity
  id: RuneMeteorStrike
  name: падающий метеор
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/meteor.rsi
    drawdepth: Overdoors
    layers:
    - state: large
      shader: unshaded
  - type: PointLight
    color: "#ff7a2e"
    radius: 3
    energy: 3
  - type: TimedDespawn
    lifetime: 1
  - type: SpawnOnDespawn
    prototype: RuneMeteorBlast

- type: entity
  id: RuneMeteorBlast
  categories: [ HideSpawnMenu ]
  components:
  - type: TriggerOnSpawn
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 40
    intensitySlope: 5
    maxIntensity: 8
    maxTileBreak: 0
    canCreateVacuum: false
    deleteAfterExplosion: true
  - type: TimedDespawn
    lifetime: 0.5

- type: entity
  id: RuneFuelPuddle
  parent: PuddleTemporary
  suffix: Маг, топливо
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionContainerManager
    solutions:
      puddle:
        maxVol: 1000
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 20

- type: entity
  id: RuneWaterPuddle
  parent: PuddleTemporary
  suffix: Маг, вода
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionContainerManager
    solutions:
      puddle:
        maxVol: 1000
        reagents:
        - ReagentId: Water
          Quantity: 30

- type: localizedDataset
  id: RuneOldAgeLines
  values:
    prefix: rune-old-age-line-
    count: 6

- type: localizedDataset
  id: RuneDeadLines
  values:
    prefix: rune-dead-line-
    count: 6

# Гримуар

- type: listing
  id: SpellbookRuneElementDeath
  name: rune-element-death-name
  description: rune-element-death-desc
  icon: { sprite: Objects/Magic/magicactions.rsi, state: gib }
  productEvent: !type:RuneLearnProductEvent
    rune: RuneElementDeath
  raiseProductEventOnUser: true
  disableRefund: true
  cost:
    WizCoin: 2
  categories:
  - SpellbookRuneElements
  conditions:
  - !type:ListingLimitedStockCondition
    stock: 1

