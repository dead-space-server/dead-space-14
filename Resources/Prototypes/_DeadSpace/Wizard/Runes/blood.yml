# Срывы крови

- type: wizardRuneSurge
  id: RuneSurgeBlood
  entries:
  - weight: 3
    popup: rune-surge-blood-boil
    effects:
    - !type:RuneDamageEffect
      target: Caster
      damage:
        types:
          Bloodloss: 20
          Slash: 10
  - weight: 2
    popup: rune-surge-blood-eyes
    effects:
    - !type:RuneSpawnRandomEffect
      prototypes:
      - PuddleBloodSmall
      pattern: AtCaster
      count: 2
    - !type:RuneSlowEffect
      target: Caster
      time: 6
      multiplier: 0.5

- type: wizardRuneSurge
  id: RuneFatalBlood
  entries:
  - popup: rune-fatal-blood
    effects:
    - !type:RuneSpawnRandomEffect
      prototypes:
      - PuddleBlood
      pattern: AreaAtPoint
      size: 2
      count: 6
    - !type:RuneGibEffect
      target: Caster

# Сущности

- type: entity
  parent: BaseBullet
  id: RuneProjectileBloodSpear
  name: кровавое копьё
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: magicm_red
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Piercing: 14
        Slash: 8
  - type: PointLight
    color: "#d4141f"
    radius: 1.5
    energy: 2

- type: entity
  parent: RuneWaterCurtain
  id: RuneBloodSpikes
  name: кровавые шипы
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: magicm_red
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: DamageContacts
    damage:
      types:
        Piercing: 6
  - type: TimedDespawn
    lifetime: 12

- type: entity
  id: RuneAnimateBloodTemplate
  categories: [ HideSpawnMenu ]
  components:
  - type: NpcFactionMember
    factions:
    - Wizard
  - type: MeleeWeapon
    animation: WeaponArcPunch
    wideAnimation: WeaponArcPunch
    altDisarm: false
    soundHit: /Audio/Weapons/bladeslice.ogg
    range: 1.2
    angle: 0.0
    damage:
      types:
        Slash: 12
  - type: PassiveDamage
    damage:
      groups:
        Brute: -2
  - type: PointLight
    color: "#d4141f"
    radius: 1.5
    energy: 1

- type: entity
  parent: MobFleshGolem
  id: RuneSummonFleshGolem
  suffix: Призыв мага
  categories: [ HideSpawnMenu ]
  components:
  - type: NpcFactionMember
    factions:
    - Wizard

- type: polymorph
  id: RuneMorphFlesh
  configuration:
    entity: MobFleshClamp
    forced: true
    transferName: true
    transferDamage: true
    inventory: None
    revertOnCrit: true
    revertOnDeath: true
    duration: 20
