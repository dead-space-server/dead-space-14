- type: wizardRuneSpell
  id: RuneSpellCleanse
  name: rune-spell-cleanse
  form: RuneFormSelf
  element: RuneElementWater
  targeting: Self
  strain: 16
  cooldown: 30
  effects:
  - !type:RuneExtinguishEffect
    target: Caster
  - !type:RuneDamageEffect
    target: Caster
    ignoreResistances: true
    damage:
      groups:
        Toxin: -25
        Burn: -10
        Airloss: -30
  - !type:RuneStatusEffect
    target: Caster
    status: StatusEffectPressureImmunity
    time: 90
  - !type:RuneComponentsEffect
    target: Caster
    template: RuneWaterGuardTemplate
    duration: 90
  - !type:RuneComponentsEffect
    target: Caster
    template: RuneWaterBubbleTemplate
    duration: 90
    alert: RuneAlertWaterBubble

- type: wizardRuneSpell
