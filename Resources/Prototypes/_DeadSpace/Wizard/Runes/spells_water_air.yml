# Вода

- type: wizardRuneSpell
  id: RuneSpellWaterJet
  name: rune-spell-water-jet
  form: RuneFormProjectile
  element: RuneElementWater
  range: 12
  strain: 10
  cooldown: 2.5
  effects:
  - !type:RuneProjectileEffect
    prototype: RuneProjectileWater
    speed: 22
    onHit:
