- type: wizardRuneSurge
  id: WizardRuneSurge
  entries:
  - weight: 2
    popup: rune-surge-chicken
    effects:
    - !type:RunePolymorphEffect
      target: Caster
      polymorph: RuneChaosChicken
  - weight: 3
    popup: rune-surge-burn
    effects:
    - !type:RuneDamageEffect
      target: Caster
      damage:
        types:
          Heat: 15
    - !type:RuneIgniteEffect
      target: Caster
      fireStacks: 2
  - weight: 2
    popup: rune-surge-rainbow
    effects:
    - !type:RuneSpeakEffect
      target: AroundCaster
      radius: 6
      includeCaster: true
      lines: RuneChaosLines
    - !type:RuneSlowEffect
      target: AroundCaster
      radius: 6
      includeCaster: true
      time: 5
      multiplier: 0.6
  - weight: 3
    popup: rune-surge-drain
    effects:
    - !type:RuneStaminaEffect
      target: Caster
      amount: 80
  - weight: 2
    popup: rune-surge-furniture
    effects:
    - !type:RuneAnimateEffect
      template: RuneAnimateChaosTemplate
      count: 2
      radius: 4
  - weight: 2
    popup: rune-surge-boom
    effects:
    - !type:RuneSpawnEffect
      prototype: WizardEffectLightningExplosion
      pattern: AtCaster
      skipBlocked: false
  - weight: 2
    popup: rune-surge-tear
    effects:
    - !type:RuneKnockdownEffect
      target: Caster
      time: 3
    - !type:RunePushEffect
      speed: 8
      radius: 4

