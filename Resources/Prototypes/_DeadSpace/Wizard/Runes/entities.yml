# Действия

- type: entity
  parent: BaseAction
  id: ActionWizardRuneCircle
  name: Рунный круг
  description: Начертите формулу курсором. Форма, стихия, модификаторы. ПКМ творит заклинание.
  components:
  - type: Action
    clientExclusive: true
    checkCanInteract: false
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: magicmissile
  - type: InstantAction
    event: !type:RuneCircleActionEvent

- type: entity
  parent: BaseAction
  id: ActionWizardRuneScroll
  name: Рунный свиток
  description: Мгновенно прочесть записанную формулу. Свиток сгорит.
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -19
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: spell_default
  - type: TargetAction
    range: 30
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:RuneScrollActionEvent

# Свиток

- type: entity
  parent: [ BaseItem, BaseMagicalContraband ]
  id: WizardRuneScroll
  name: рунный свиток
  description: Бумага, исписанная светящимися рунами. Прочесть её может кто угодно. Пережить сможет не каждый.
  components:
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: spell_default
      color: "#d9b3ff"
  - type: Item
    size: Tiny
  - type: RuneScroll
  - type: PointLight
    color: "#b07bff"
    radius: 1.2
    energy: 1

# Статус

- type: entity
  parent: StatusEffectSlowdown
  id: RuneSlowStatusEffect
  name: рунное замедление

# Снаряды

- type: entity
