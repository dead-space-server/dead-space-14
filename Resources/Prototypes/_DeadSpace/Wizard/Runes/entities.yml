# Плитки и стены

- type: entity
  id: RuneFireTile
  name: рунное пламя
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
  - type: Sprite
    sprite: _DeadSpace/Effects/fire.rsi
    layers:
    - state: fire
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        layer:
        - MidImpassable
  - type: PointLight
    color: "#ff8c00"
    radius: 2
    energy: 2
  - type: IgniteOnCollide
    fireStacks: 0.6
    count: 30
    fixtureId: fix1
  - type: DamageContacts
    damage:
      types:
        Heat: 6
  - type: TimedDespawn
    lifetime: 8
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
