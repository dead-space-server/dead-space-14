# Действия

- type: entity
  parent: BaseAction
  id: ActionWizardRuneCircle
  name: Рунный круг
  description: Начертите формулу курсором. Форма, стихия, модификаторы. ПКМ творит заклинание.
  components:
  - type: Action
    clientExclusive: true
    checkCanInteract: false
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: _DeadSpace/Wizard/rune_hud.rsi
      state: circle
  - type: InstantAction
    event: !type:RuneCircleActionEvent

# Свиток и перо

- type: entity
  parent: BaseItem
  id: WizardRuneQuill
  name: рунное перо
  description: Перо, что пишет светом. Коснитесь им чистого рунного свитка и начертите на нём форму и стихию. Неверный штрих сожжёт свиток.
  components:
  - type: Sprite
    sprite: _DeadSpace/Wizard/rune_quill.rsi
    layers:
    - state: icon
    - state: glow
      shader: unshaded
  - type: Item
    sprite: _DeadSpace/Wizard/rune_quill.rsi
    size: Tiny
  - type: RuneQuill
  - type: PointLight
    color: "#b07bff"
    radius: 1
    energy: 0.8

- type: entity
  parent: BaseGuidebook
  id: BookWizardRunes
  name: рунный манускрипт
  description: Потрёпанный учебник рунной магии. Формы, стихии, модификаторы, сплавы и свитки, всё по порядку.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_old
      color: "#3f2a7a"
    - state: decor_wingette_circle
      color: "#d59941"
    - state: icon_pentagramm
      color: "#b07bff"
    - state: icon_corner
      color: gold
  - type: GuideHelp
    openOnActivation: true
    guides:
    - Wizard

- type: entity
  parent: BaseBullet
  id: RuneProjectileChaosMorph
  name: болт превращения
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: spell
      color: "#ff6ad5"
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Blunt: 1
  - type: PointLight
    color: "#ff6ad5"
    radius: 1.5
    energy: 2

- type: entity
  parent: [ BaseItem, BaseMagicalContraband ]
  id: WizardRuneScroll
  name: чистый рунный свиток
  description: Пустой свиток, готовый принять руны. Коснитесь его рунным пером и начертите форму и стихию.
  components:
  - type: Sprite
    sprite: _DeadSpace/Wizard/rune_scroll.rsi
    layers:
    - state: scroll
    - state: form-RuneFormProjectile
      map: [ "rune-form" ]
      visible: false
      shader: unshaded
    - state: element-RuneElementFire
      map: [ "rune-element" ]
      visible: false
      shader: unshaded
  - type: Item
    size: Small
  - type: RuneScroll
  - type: PointLight
    color: "#b07bff"
    radius: 1.2
    energy: 1

