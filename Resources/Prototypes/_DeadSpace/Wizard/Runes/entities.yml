    sprite: _DeadSpace/Effects/fire.rsi
    layers:
    - state: fire
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
