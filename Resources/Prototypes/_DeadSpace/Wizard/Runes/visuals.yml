- type: shader
  id: RuneAdditive
  kind: canvas
  light_mode: unshaded
  blend_mode: Add

- type: runeMarkIcon
  id: RuneMarkIconBase
  abstract: true
  priority: 3
  locationPreference: Right
  isShaded: false
  hideOnStealth: true
  showTo:
    components:
    - RuneCaster

- type: runeMarkIcon
  parent: RuneMarkIconBase
  id: RuneMarkIconBurning
  icon:
    sprite: /Textures/_DeadSpace/Wizard/rune_marks.rsi
    state: burning

- type: runeMarkIcon
  parent: RuneMarkIconBase
  id: RuneMarkIconWet
  icon:
    sprite: /Textures/_DeadSpace/Wizard/rune_marks.rsi
    state: wet

