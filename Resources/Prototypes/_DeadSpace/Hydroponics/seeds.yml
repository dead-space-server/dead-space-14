# DS14: custom plants migrated to entity prototypes for the botany refactor.

- type: entity
  parent: BasePlant
  id: sakura
  name: sakura
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Specific/Hydroponics/sakura_plant.rsi
  - type: PlantData
    name: seeds-sakura-display-name
    packetPrototype: SakuraSeeds
    productPrototypes: [ FoodSakuraFlower ]
  - type: Plant
    lifespan: 55
    maturation: 6
    production: 3
    yield: 3
    potency: 10
    growthStages: 4
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantGrowth
    waterConsumption: 0.6
  - type: PlantChemicals
    chemicals:
      Nutriment:
        min: 1
        max: 4
        potencyDivisor: 20
      Vitamin:
        min: 1
        max: 4
        potencyDivisor: 25
      SakuraJuice:
        min: 1
        max: 5
        potencyDivisor: 5

- type: entity
  parent: BasePlant
  id: tritiumCannabis
  name: tritium cannabis
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/cannabis.rsi
  - type: PlantData
    name: seeds-tritium-cannabis-name
    packetPrototype: TritiumCannabisSeeds
    productPrototypes: [ LeavesCannabisTritium ]
  - type: Plant
    lifespan: 75
    maturation: 8
    production: 12
    yield: 2
    potency: 20
    growthStages: 3
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantGrowth
    waterConsumption: 0.4
  - type: PlantAtmospheric
    lowHeatTolerance: 288
    highHeatTolerance: 308
  - type: PlantConsumeExudeGas
    exudeGasses:
      Tritium: 0.1
  - type: PlantChemicals
    chemicals:
      THC:
        min: 1
        max: 10
        potencyDivisor: 10
      SpaceDrugs:
        min: 1
        max: 5
        potencyDivisor: 20

