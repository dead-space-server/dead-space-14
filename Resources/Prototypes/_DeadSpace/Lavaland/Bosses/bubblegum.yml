- type: lavalandBossArena
  id: LavalandBubblegumArena
  arenaName: арена баблгама
  bossPrototype: MobLavalandBubblegum
  floorTile: FloorBubblegumArena
  wallPrototype: WallBubblegumArena
  lightPrototype: LavalandBubblegumArenaLight
  cave:
    # The whole ring is the boss's own wall, 3 tiles, no ore; then a thin band of basalt over the land.
    thickness: 3
    shell: 3
    surround: 3
    shellRock: WallBubblegumArena
    roughness: 0
    passages: 2
    passageHalfWidth: 1
    collapseChance: 0
    rubbleChance: 0
    exitLength: 30
    exitWander: 0.35
    oreVeins: 18
    oreVeinMin: 3
    oreVeinMax: 7
    ores:
      WallRockBasaltTin: 30
      WallRockBasaltCoal: 30
      WallRockBasaltPlasma: 15
      WallRockBasaltQuartz: 15
      WallRockBasaltSalt: 10
      WallRockBasaltSilver: 10
      WallRockBasaltGold: 8
      WallRockBasaltUranium: 6
      WallRockBasaltDiamond: 3
      WallRockBasaltGibtonite: 3
      WallRockBasaltMagmite: 2
      WallRockBasaltBluespaceCrystal: 2
      WallRockBasaltArtifactFragment: 2
  decorations:
  # Ash trees along the walls, like on the land around.
  - prototype: FloraTreeLavalandAsh
    count: 7
    spawnAttempts: 120
    minDistance: 15
    maxDistance: 21
    edgePadding: 1
    minSeparation: 3
  - prototype: FloorLavaEntity
    pool: true
    count: 28
    spawnAttempts: 80
    clusterSize: 6
    clusterRadius: 1
    minDistance: 12
    maxDistance: 22
    edgePadding: 4
    minSeparation: 0
  - prototype: FloraRockSolid
    count: 7
    spawnAttempts: 90
    minDistance: 18
    maxDistance: 22
    edgePadding: 3
    minSeparation: 3
  - prototype: BasaltRandom
    count: 95
    spawnAttempts: 110
    minDistance: 5
    maxDistance: 23
    edgePadding: 2
    minSeparation: 1
  size: 49
  spawnAttempts: 200
  minDistance: 190
  maxDistance: 335
  mapEdgePadding: 40
  landingExclusionRadius: 90
  outpostExclusionRadius: 100
  ftlBeaconExclusionRadius: 64
  gridSeparation: 48
  resetOnEmpty: true
  emptyResetDelay: 10
  emptyResetHealFraction: 5
  emptyResetMinHeal: 450
  intro:
    style: BloodRitual
    titleColor: "#e0182d"
    arenaZoom: 1.05
    landSound: /Audio/_DeadSpace/Lavaland/Bubblegum/meteorimpact.ogg
    subtitle: lavaland-boss-intro-bubblegum

- type: tile
  id: FloorBubblegumArena
  name: tiles-bubblegum-arena-floor
  parent: FloorBasalt
  weather: false

- type: entity
  parent: WallRockBasaltLavalandBoundary
  id: WallBubblegumArena
  name: базальт
  description: Неразрушимая базальтовая стена, отделяющая логово от остального Лаваленда.
  suffix: Lavaland, Indestructible

- type: entity
  id: LavalandBubblegumArenaLight
  name: свет арены баблгама
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: PointLight
    radius: 30
    energy: 1.55
    softness: 1
    color: "#d94040"
    castShadows: false
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: LavalandBubblegumEffectBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Tag
    tags:
    - HideContextMenu
  - type: TimedDespawn
    lifetime: 1

# A tile of the wall of blood across the way of whoever runs from Bubblegum: drawn by the client as the Circle's
# blink blood, no sprite of its own.
- type: entity
  id: LavalandBubblegumBloodWall
  name: стена крови
  description: Густая кровь стоит стеной и не пускает дальше.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        hard: true
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: Tag
    tags:
    - HideContextMenu
  - type: LavalandBloodWall
    lifetime: 6
  - type: TimedDespawn
    lifetime: 6

- type: entity
  parent: LavalandBubblegumEffectBase
  id: LavalandBubblegumBloodPool
  name: кровь баблгама
