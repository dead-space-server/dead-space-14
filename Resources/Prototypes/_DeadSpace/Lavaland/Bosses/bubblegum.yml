- type: entity
  parent: [ BaseMobAsteroid, BaseMobLavalandFauna ]
  id: MobLavalandBubblegum
  name: баблгам
  description: Король демонов резни, оставляющий за собой следы густой крови.
  suffix: Lavaland, Boss
  categories: [ HideSpawnMenu ]
  components:
  - type: DestructionResistance
  - type: LavalandTrophyDrop
    trophy: CrusherTrophyDemonClaws
    chance: 1
    requiredFraction: 0.6
    proportional: false
  - type: IgnoreKudzu
  - type: Insulated
  - type: StunImmune
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeadSpace/Lavaland/Mobs/Bubblegum.rsi
    layers:
    - state: bubblegum
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  # The boss HUD shows its health; no health bar over it through a medical visor.
  - type: Damageable
    damageContainer: Biological
    healthBarThreshold: 1000000
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 1000000
      behaviors:
      - !type:GibBehavior { }
  - type: LavalandBoss
    bossName: баблгам
    maxHealth: 2500
    music: /Audio/_DeadSpace/Lavaland/Bosses/bubblegum_fight.ogg
    deathSound: /Audio/_DeadSpace/Lavaland/Bubblegum/enter_blood.ogg
    deathRewards:
    - LavalandNecropolisChestHardsuit
    - LavalandNecropolisChest
    - LavalandNecropolisChest
    # Either the armour-piercing spell blade or the soulscythe.
    - LavalandBubblegumWeaponSpawner
    - LavalandMayhemBottle
    - ClothingOuterLavalandHeckSuit
    - BubblegumTrophy
  - type: LavalandBubblegum
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        64
      AggroVisionRadius: !type:Single
        64
      NavSmash: !type:Bool
        false
  - type: MeleeWeapon
    soundHit:
      path: /Audio/_DeadSpace/Lavaland/Bubblegum/demon_attack1.ogg
    angle: 0
    attackRate: 0.8
    animation: WeaponArcBite
    damage:
      types:
        Slash: 40
        Structural: 40
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.3
    baseSprintSpeed: 3
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.75
        density: 320
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: NoSlip
  - type: RequireProjectileTarget
  - type: Tag
    tags:
    - CannotSuicide

- type: entity
  parent: [ BaseMobAsteroid, FlyingMobBase, BaseMobLavalandFauna ]
  id: MobLavalandBubblegumSlaughterling
  name: slaughterling
  description: A half-formed demon crawling out of Bubblegum's blood.
  suffix: Lavaland
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeadSpace/Lavaland/Mobs/Bloodbrood.rsi
    layers:
    - state: bloodbrood
  - type: MobThresholds
    thresholds:
      0: Alive
      1: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3.5
  - type: MeleeWeapon
    soundHit:
      path: /Audio/_DeadSpace/Lavaland/Bubblegum/pierce.ogg
    angle: 0
    attackRate: 1.2
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 2
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        32
      AggroVisionRadius: !type:Single
        32
      NavSmash: !type:Bool
        false
  - type: TimedDespawn
    lifetime: 10
  - type: NoSlip
  - type: Tag
    tags:
    - CannotSuicide

- type: entity
  parent: LavalandBubblegumRightPaw
