- type: entity
  parent: [ BaseMobAsteroid, BaseMobLavalandFauna ]
  id: MobLavalandHierophant
  name: Иерофант
  description: Массивная машина, покрытая пульсирующими квадратными узорами.
  suffix: Lavaland, Boss
  categories: [ HideSpawnMenu ]
  components:
  - type: DestructionResistance
  - type: LavalandTrophyDrop
    trophy: CrusherTrophyVortexTalisman
    chance: 1
    requiredFraction: 0.6
    proportional: false
  - type: IgnoreKudzu
  - type: Insulated
  - type: StunImmune
  - type: Sprite
    drawdepth: Mobs
    scale: 1.2, 1.2
    sprite: _DeadSpace/Lavaland/Mobs/Hierophant.rsi
    layers:
    - state: hierophant
  - type: MobThresholds
    thresholds:
      0: Alive
      2750: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 1000000
      behaviors:
      - !type:GibBehavior { }
  - type: LavalandBoss
    bossName: Иерофант
    maxHealth: 2750
    music:
      path: /Audio/_DeadSpace/Lavaland/Bosses/hierophant_fight.ogg
      params:
        volume: 4
    deathSound: /Audio/_DeadSpace/Lavaland/Hierophant/repulse.ogg
    deathRewards:
    - WeaponGrapplingGun # the only way out of the chromite caves
    - LavalandNecropolisChestHardsuit
    - LavalandNecropolisChest
    - LavalandNecropolisChest
    - LavalandHierophantStaff
    - HierophantTrophy
  - type: LavalandHierophant
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        64
      AggroVisionRadius: !type:Single
        64
      NavSmash: !type:Bool
        false
  - type: MeleeWeapon
    soundHit:
      path: /Audio/_DeadSpace/Lavaland/Hierophant/sonic_jackhammer.ogg
    angle: 0
    attackRate: 0.8
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 15
        Structural: 40
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.7
    baseSprintSpeed: 2.7
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 200
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: NoSlip
  - type: RequireProjectileTarget

