- type: entity
  parent: BaseWall
  id: WallHierophantArena
  name: стена Иерофанта
  description: Гладкая стена, покрытая светящимися квадратными узорами.
  suffix: Lavaland, Indestructible
  components:
  - type: Sprite
    sprite: _DeadSpace/Lavaland/Structures/HierophantWall.rsi
  - type: Icon
    sprite: _DeadSpace/Lavaland/Structures/HierophantWall.rsi
  - type: IconSmooth
    key: walls
    base: hierophant
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 4000
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: RadiationBlocker
    resistance: 5

