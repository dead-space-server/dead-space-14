- type: lavalandBossArena
  id: LavalandHierophantArena
  arenaName: Арена Иерофанта
  gridPath: /Maps/_DeadSpace/Lavaland/hierophant_arena.yml
  tileMovement: true
  bossPrototype: MobLavalandHierophant
  floorTile: FloorHierophantArena
  wallPrototype: WallHierophantArena
  spawnAttempts: 160
  minDistance: 170
  maxDistance: 320
  mapEdgePadding: 32
  landingExclusionRadius: 90
  outpostExclusionRadius: 100
  ftlBeaconExclusionRadius: 64
  gridSeparation: 32
  resetOnEmpty: true
  emptyResetDelay: 10
  emptyResetHealFraction: 5
  emptyResetMinHeal: 450
  intro:
    style: Bowling
    # Only at the very middle of the arena.
    startDistance: 2.5
    titleColor: "#c47bff"
    roarSound: /Audio/_DeadSpace/Lavaland/Hierophant/sonic_jackhammer.ogg
    impactSound: /Audio/_DeadSpace/Lavaland/Hierophant/repulse.ogg
    subtitle: lavaland-boss-intro-hierophant

