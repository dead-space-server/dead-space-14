- type: lavalandBossArena
  id: LavalandAshDrakeArena
  arenaName: арена пепельного дракона
  bossPrototype: MobLavalandAshDrake
  floorTile: FloorAshDrakeArena
  wallPrototype: WallAshDrakeArena
  lightPrototype: LavalandAshDrakeArenaLight
  cave:
    # The whole ring is the boss's own wall, 3 tiles, no ore; then a thin band of basalt over the land.
    thickness: 3
    shell: 3
    surround: 3
    shellRock: WallAshDrakeArena
    roughness: 0
    passages: 2
    passageHalfWidth: 1
    collapseChance: 0
    rubbleChance: 0
    exitLength: 30
    exitWander: 0.35
    oreVeins: 18
    oreVeinMin: 3
    oreVeinMax: 7
    ores:
      WallRockBasaltTin: 30
      WallRockBasaltCoal: 30
      WallRockBasaltPlasma: 15
      WallRockBasaltQuartz: 15
      WallRockBasaltSalt: 10
      WallRockBasaltSilver: 10
      WallRockBasaltGold: 8
      WallRockBasaltUranium: 6
      WallRockBasaltDiamond: 3
      WallRockBasaltGibtonite: 3
      WallRockBasaltMagmite: 2
      WallRockBasaltBluespaceCrystal: 2
      WallRockBasaltArtifactFragment: 2
  decorations:
  # Ash trees along the walls, like on the land around.
  - prototype: FloraTreeLavalandAsh
    count: 7
    spawnAttempts: 120
    minDistance: 15
    maxDistance: 21
    edgePadding: 1
    minSeparation: 3
  - prototype: FloorLavaEntity
    pool: true
    count: 34
    spawnAttempts: 80
    clusterSize: 7
    clusterRadius: 1
    minDistance: 10
    maxDistance: 20
    edgePadding: 3
    minSeparation: 0
  - prototype: FloraRockSolid
    count: 5
    spawnAttempts: 80
    minDistance: 16
    maxDistance: 20
    edgePadding: 3
    minSeparation: 3
  - prototype: BasaltRandom
    count: 85
    spawnAttempts: 100
    minDistance: 5
    maxDistance: 21
    edgePadding: 2
    minSeparation: 1
  size: 45
  spawnAttempts: 180
  minDistance: 180
  maxDistance: 330
  mapEdgePadding: 36
  landingExclusionRadius: 90
  outpostExclusionRadius: 100
  ftlBeaconExclusionRadius: 64
  gridSeparation: 42
  resetOnEmpty: true
  emptyResetDelay: 10
  emptyResetHealFraction: 5
  emptyResetMinHeal: 450
  intro:
    roarSound: /Audio/_DeadSpace/Lavaland/AshDrake/demon_dies.ogg
    landSound: /Audio/_DeadSpace/Lavaland/AshDrake/meteorimpact.ogg
    subtitle: lavaland-boss-intro-ash-drake

- type: tile
  id: FloorAshDrakeArena
  name: tiles-ash-drake-arena-floor
  parent: FloorBasalt
  weather: false

- type: entity
  parent: WallRockBasaltLavalandBoundary
  id: WallAshDrakeArena
  name: базальт
  description: Неразрушимая базальтовая стена, отделяющая логово от остального Лаваленда.
  suffix: Lavaland, Indestructible

- type: entity
  id: LavalandAshDrakeArenaLight
  name: свет арены пепельного дракона
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: PointLight
    radius: 28
    energy: 1.45
    softness: 1
    color: "#ff8a4b"
    castShadows: false
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
