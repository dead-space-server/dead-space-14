- type: entity
  parent: [ BaseMobAsteroid, BaseMobLavalandFauna ]
  id: MobLavalandAshDrake
  name: пепельный дракон
  description: Огромный крылатый хранитель некрополя.
  suffix: Lavaland, Boss
  categories: [ HideSpawnMenu ]
  components:
  - type: DestructionResistance
  - type: LavalandTrophyDrop
    trophy: CrusherTrophyTailSpike
    chance: 1
    requiredFraction: 0.6
    proportional: false
  - type: IgnoreKudzu
  - type: Insulated
  - type: StunImmune
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeadSpace/Lavaland/Mobs/AshDrake.rsi
    layers:
    - state: dragon
      map: ["enum.LavalandAshDrakeVisualLayers.Base"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.LavalandAshDrakeVisuals.State:
        enum.LavalandAshDrakeVisualLayers.Base:
          Dragon: { state: dragon }
          Shadow: { state: shadow }
          Swoop: { state: swoop }
          Dead: { state: dragon_dead }
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  # The boss HUD shows its health; no health bar over it through a medical visor.
  - type: Damageable
    damageContainer: Biological
    healthBarThreshold: 1000000
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 1000000
      behaviors:
      - !type:GibBehavior { }
  - type: LavalandBoss
    bossName: пепельный дракон
    maxHealth: 2500
    music: /Audio/_DeadSpace/Lavaland/Bosses/drake_fight.ogg
    deathSound: /Audio/_DeadSpace/Lavaland/AshDrake/demon_dies.ogg
    deathRewards:
    - LavalandNecropolisChest
    - ClothingOuterSuitAshDrake
    - LavalandSpectralBlade
    - LavalandAshDrakeFireballSpellbookDrop
    - LavalandLavaStaff
    - AshDrakeTrophy
  - type: LavalandAshDrake
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        64
      AggroVisionRadius: !type:Single
        64
      NavSmash: !type:Bool
        false
  - type: MeleeWeapon
    soundHit:
      path: /Audio/_DeadSpace/Lavaland/AshDrake/demon_attack1.ogg
    angle: 0
    attackRate: 0.8
    animation: WeaponArcBite
    damage:
      types:
        Slash: 40
        Structural: 40
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2.8
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.65
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: NoSlip
  - type: RequireProjectileTarget

- type: entity
  id: LavalandAshDrakeFireballSpellbookDrop
  name: fireball spellbook drop
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: EntityTableSpawner
    offset: 0
    table: !type:AllSelector
      children:
      - id: FireballSpellbook
        prob: 0.01

