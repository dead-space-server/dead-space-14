  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 3.5
  - type: MeleeWeapon
    angle: 0
    attackRate: 1
    animation: WeaponArcBite
    damage:
      types:
        Slash: 8
        Heat: 12
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        32
      AggroVisionRadius: !type:Single
        32
      NavSmash: !type:Bool
        false
  - type: TimedDespawn
    lifetime: 15
  - type: NoSlip

