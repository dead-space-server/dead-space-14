      shader: unshaded
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - Impassable
        layer:
        - Impassable
        - HighImpassable
        - MidImpassable
        - LowImpassable
  - type: TimedDespawn
    lifetime: 10
  - type: PointLight
    radius: 2.0
    energy: 1.4
    color: "#ff1200"

