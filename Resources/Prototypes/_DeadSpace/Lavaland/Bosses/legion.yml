    maxDistance: 15
    edgePadding: 3
    minSeparation: 0
  - prototype: FloraRockSolid
    count: 4
    spawnAttempts: 80
    minDistance: 12
    maxDistance: 15
    edgePadding: 3
    minSeparation: 3
  - prototype: FloraTreeLavalandAsh
    count: 5
    spawnAttempts: 80
    minDistance: 10
    maxDistance: 15
    edgePadding: 3
    minSeparation: 4
  - prototype: LavalandEmberWild
    count: 4
    spawnAttempts: 60
    minDistance: 6
    maxDistance: 15
    edgePadding: 2
    minSeparation: 3
  - prototype: BasaltRandom
    count: 70
    spawnAttempts: 100
    minDistance: 4
    maxDistance: 16
    edgePadding: 2
    minSeparation: 1
  - decals:
    - FlowersBROne
    - FlowersBRTwo
    - FlowersBRThree
    decalColor: "#ff6b24"
    count: 40
    spawnAttempts: 120
    minDistance: 3
    maxDistance: 16
    edgePadding: 1
    minSeparation: 0
  size: 35
  spawnAttempts: 160
  minDistance: 170
  maxDistance: 320
  mapEdgePadding: 32
  landingExclusionRadius: 90
  outpostExclusionRadius: 100
