- type: lavalandBossArena
  id: LavalandLegionArena
  arenaName: Башня Некрополиса
  gridPath: /Maps/_DeadSpace/Lavaland/legion_necropolis.yml
  summonOnGate: true
  bossUnbound: true
  bossPrototype: MobLavalandLegionMegafauna
  floorTile: FloorLegionArena
  wallPrototype: WallLegionArena
  lightPrototype: LavalandLegionArenaLight
  size: 35
  spawnAttempts: 160
  minDistance: 170
  maxDistance: 320
  mapEdgePadding: 32
  landingExclusionRadius: 90
  outpostExclusionRadius: 100
  ftlBeaconExclusionRadius: 64
  gridSeparation: 32
  resetOnEmpty: true
  emptyResetDelay: 10
  emptyResetHealFraction: 5
  emptyResetMinHeal: 450
  intro:
    style: GateBreak
    titleColor: "#e0182d"
    impactSound: /Audio/Effects/metal_thud1.ogg
    landSound: /Audio/Effects/explosion_small1.ogg
    roarSound: /Audio/Effects/demon_dies.ogg
    subtitle: lavaland-boss-intro-legion

- type: tile
  id: FloorLegionArena
  name: lavaland-legion-floor-name
  parent: FloorBasalt
  weather: false

- type: entity
  parent: WallRockBasaltLavalandBoundary
  id: WallLegionArena
  name: базальт
  description: Неразрушимая базальтовая стена, отделяющая логово от остального Лаваленда.
  suffix: Lavaland, Indestructible

- type: entity
  id: LavalandLegionArenaLight
  name: свет логова Легиона
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: PointLight
    radius: 24
    energy: 1.3
    softness: 1
    color: "#b8323a"
    castShadows: false
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  abstract: true
  parent: [ BaseMobAsteroid, BaseMobLavalandFauna ]
  id: BaseMobLavalandLegionMegafauna
  name: Легион
  description: Один из многих.
  categories: [ HideSpawnMenu ]
  components:
  - type: DestructionResistance
  - type: IgnoreKudzu
  - type: StunImmune
  - type: NoSlip
  - type: LavalandSpin
    speed: 5
  - type: MobThresholds
    thresholds:
      0: Alive
      100000: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 1000000
      behaviors:
      - !type:GibBehavior { }
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        13
      AggroVisionRadius: !type:Single
        80
      NavSmash: !type:Bool
        true
  - type: MeleeWeapon
    resistanceBypass: true
    soundHit:
      path: /Audio/Effects/demon_attack1.ogg
    angle: 0
    attackRate: 1
    animation: WeaponArcBite
    damage:
      types:
        Blunt: 25
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.6
    baseSprintSpeed: 3.6
  - type: RequireProjectileTarget

- type: entity
  parent: BaseMobLavalandLegionMegafauna
  id: MobLavalandLegionMegafauna
  suffix: Lavaland, Boss
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeadSpace/Lavaland/Mobs/Legion.rsi
    offset: 0,0.5
    layers:
    - state: legion
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 1.1
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: LavalandBoss
    bossName: Легион
    maxHealth: 3550
    music: /Audio/_DeadSpace/Lavaland/Bosses/legion_fight.ogg
    deathSound: /Audio/Effects/demon_dies.ogg
    deathRewards:
    - LavalandStormStaff
    - LavalandNecropolisChest
  # Two hands floating by its sides: they slam the floor and throw things.
  - type: LavalandLegionHands
  - type: LavalandLegionMegafauna
    size: 3
    dormant: true
    bodyHealth: 700
    splitHealthPool: 2850
    splitInto:
    - MobLavalandLegionMegafaunaLeft
    - MobLavalandLegionMegafaunaEye
    - MobLavalandLegionMegafaunaRight
    chargeDamage:
      types:
        Blunt: 22
    chargeWindupSound: /Audio/_DeadSpace/Lavaland/Hierophant/sonic_jackhammer.ogg
    chargeImpactSound: /Audio/Effects/explosion_small1.ogg
    sentinelSound: /Audio/Effects/bone_rattle.ogg

