- type: entity
  id: LavalandLegionBeamEndpoint
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 1.5

# The Legion's hands. Sprites by golubok_epta, one for every pose for now.
- type: entity
  id: LavalandLegionHandLeft
  name: рука Легиона
  description: Сросшиеся кости и черепа, сжатые в огромный кулак. Каждый удар по ней отзывается во всём Легионе.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: _DeadSpace/Lavaland/Mobs/LegionHands.rsi
    drawdepth: Mobs
    noRot: true
    layers:
    - state: left
      map: [ "enum.LavalandLegionHandLayers.Base" ]
  # Open palm, clenched fist drawn back, knuckles-first punch.
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.LavalandLegionHandVisuals.Pose:
        enum.LavalandLegionHandLayers.Base:
          Open: { sprite: _DeadSpace/Lavaland/Mobs/LegionHands.rsi, state: left }
          Fist: { sprite: _DeadSpace/Lavaland/Mobs/LegionFists.rsi, state: fist-left }
          Punch: { sprite: _DeadSpace/Lavaland/Mobs/LegionFists.rsi, state: punch-left }
          Throw: { sprite: _DeadSpace/Lavaland/Mobs/LegionArms.rsi, state: arm-left }
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Kinematic
  # Bullets and blows land on it, players walk through.
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.6
        hard: true
        layer:
        - BulletImpassable
  - type: Damageable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/gib1.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          LavalandIntroRockParticle:
            min: 3
            max: 5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: LavalandLegionHandLeft
  id: LavalandLegionHandRight
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: right
      map: [ "enum.LavalandLegionHandLayers.Base" ]
  - type: GenericVisualizer
    visuals:
      enum.LavalandLegionHandVisuals.Pose:
        enum.LavalandLegionHandLayers.Base:
          Open: { sprite: _DeadSpace/Lavaland/Mobs/LegionHands.rsi, state: right }
          Fist: { sprite: _DeadSpace/Lavaland/Mobs/LegionFists.rsi, state: fist-right }
          Punch: { sprite: _DeadSpace/Lavaland/Mobs/LegionFists.rsi, state: punch-right }
          Throw: { sprite: _DeadSpace/Lavaland/Mobs/LegionArms.rsi, state: arm-right }

# A basalt rock falling from the sky or held in a hand.
- type: entity
