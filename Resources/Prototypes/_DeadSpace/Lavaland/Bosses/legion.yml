    chargeWindupSound: /Audio/_DeadSpace/Lavaland/Hierophant/sonic_jackhammer.ogg
    chargeImpactSound: /Audio/Effects/explosion_small1.ogg
    sentinelSound: /Audio/Effects/bone_rattle.ogg

- type: entity
  id: LavalandLegionSentinel
  name: страж Легиона
  description: Глаз пронзает твою душу.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 100
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeadSpace/Lavaland/Mobs/LegionSmall.rsi
    layers:
    - state: sentinel
      shader: unshaded
  - type: PointLight
    radius: 2
    energy: 0.5
    color: "#ff4040"
  - type: Clickable
  - type: InteractionOutline
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: LavalandLegionSentinel
    damage:
      types:
        Heat: 19
    aimSound: /Audio/_DeadSpace/Lavaland/Hierophant/airlockopen.ogg
    fireSound: /Audio/_DeadSpace/Lavaland/Hierophant/bin_close.ogg

- type: entity
  id: LavalandLegionSentinelTracer
  name: кровавый прицел
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Lavaland/Effects/LegionBeam.rsi
    drawdepth: Effects
    layers:
