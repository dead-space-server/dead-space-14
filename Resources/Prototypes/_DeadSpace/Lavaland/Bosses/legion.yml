  emptyResetDelay: 10
  emptyResetHealFraction: 5
  emptyResetMinHeal: 450

- type: tile
  id: FloorLegionArena
  name: lavaland-legion-floor-name
  parent: FloorBasalt
  weather: false

- type: entity
  parent: WallRockBasaltLavalandBoundary
  id: WallLegionArena
  name: стена логова Легиона
  description: Несокрушимая базальтовая стена, окружающая логово Легиона.
  suffix: Lavaland, Indestructible

- type: entity
  id: LavalandLegionArenaLight
  name: свет логова Легиона
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: PointLight
    radius: 24
    energy: 1.3
    softness: 1
    color: "#b8323a"
    castShadows: false
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  abstract: true
  parent: [ BaseMobAsteroid, BaseMobLavalandFauna ]
  id: BaseMobLavalandLegionMegafauna
  name: Легион
  description: Один из многих.
  categories: [ HideSpawnMenu ]
  components:
  - type: DestructionResistance
  - type: IgnoreKudzu
  - type: StunImmune
  - type: NoSlip
  - type: MobThresholds
    thresholds:
      0: Alive
      100000: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 1000000
      behaviors:
      - !type:GibBehavior { }
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        13
      AggroVisionRadius: !type:Single
        13
      NavSmash: !type:Bool
        false
  - type: MeleeWeapon
    resistanceBypass: true
    soundHit:
      path: /Audio/Effects/demon_attack1.ogg
    angle: 0
    attackRate: 1
    animation: WeaponArcBite
    damage:
      types:
        Blunt: 25
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.6
    baseSprintSpeed: 3.6
  - type: RequireProjectileTarget

- type: entity
  parent: BaseMobLavalandLegionMegafauna
  id: MobLavalandLegionMegafauna
  suffix: Lavaland, Boss
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeadSpace/Lavaland/Mobs/Legion.rsi
    offset: 0,0.5
    layers:
    - state: legion
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 1.1
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: LavalandBoss
    bossName: Легион
    maxHealth: 3550
    musicPool:
    - /Audio/_DeadSpace/Lavaland/Bosses/title1.ogg
    - /Audio/_DeadSpace/Lavaland/Bosses/drake_fight.ogg
    - /Audio/_DeadSpace/Lavaland/Bosses/bubblegum_fight.ogg
    - /Audio/_DeadSpace/Lavaland/Bosses/colossus_fight.ogg
    deathSound: /Audio/Effects/demon_dies.ogg
    deathRewards:
    - LavalandStormStaff
    - LavalandNecropolisChest
  - type: LavalandLegionMegafauna
    size: 3
    bodyHealth: 700
    splitHealthPool: 2850
    splitInto:
    - MobLavalandLegionMegafaunaLeft
    - MobLavalandLegionMegafaunaEye
    - MobLavalandLegionMegafaunaRight
    chargeDamage:
      types:
        Blunt: 22
    chargeWindupSound: /Audio/_DeadSpace/Lavaland/Hierophant/sonic_jackhammer.ogg
    chargeImpactSound: /Audio/Effects/explosion_small1.ogg
    sentinelSound: /Audio/Effects/bone_rattle.ogg

