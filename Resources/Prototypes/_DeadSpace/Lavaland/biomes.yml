- type: biomeTemplate
  id: LavalandSurface
  layers:
  # Fiery flowers are visual decals and never replace traversable ground.
  - !type:BiomeDecalLayer
    divisions: 2
    threshold: 0.84
    noise:
      seed: 51
      noiseType: OpenSimplex2
      frequency: 0.32
    allowedTiles:
    - FloorBasalt
    - FloorLavalandAsh
    - FloorLavalandPaleGrass
    color: "#ff6b24"
    decals:
    - FlowersBROne
    - FlowersBRTwo
    - FlowersBRThree

  - !type:BiomeEntityLayer
    threshold: 0.97
    noise:
      seed: 47
      noiseType: OpenSimplex2
      frequency: 0.16
    allowedTiles:
    - FloorBasalt
    - FloorLavalandAsh
    - FloorLavalandPaleGrass
    entities:
    - LavalandPolyporeWild
    - LavalandPorciniWild
    - LavalandInocybeWild
    - LavalandEmberWild
    - LavalandCactusWild

  - !type:BiomeEntityLayer
    threshold: 0.95
    noise:
      seed: 48
      noiseType: OpenSimplex2
      frequency: 0.2
    allowedTiles:
    - FloorBasalt
    - FloorLavalandAsh
    - FloorLavalandPaleGrass
    entities:
    - LavalandBasaltBoulder

  - !type:BiomeEntityLayer
    threshold: 0.96
    noise:
      seed: 13
      noiseType: OpenSimplex2
      frequency: 0.10
    allowedTiles:
    - FloorBasalt
    - FloorLavalandAsh
    - FloorLavalandPaleGrass
    entities:
    - BasaltRandom

  - !type:BiomeEntityLayer
    threshold: 0.965
    noise:
      seed: 14
      noiseType: OpenSimplex2
      frequency: 0.07
    allowedTiles:
    - FloorBasalt
    - FloorLavalandAsh
    - FloorLavalandPaleGrass
    entities:
    - LavalandBasaltBoulder
    - FloraStalagmite

  # Ash trees use deterministic spacing: they occur throughout open terrain,
  # while the biome system prevents neighboring trees from forming clusters.
  - !type:BiomeEntityLayer
    threshold: 0.20
    minimumDistance: 3
    noise:
      seed: 52
      noiseType: OpenSimplex2
      frequency: 0.85
    allowedTiles:
    - FloorBasalt
    - FloorLavalandAsh
    - FloorLavalandPaleGrass
    entities:
    - FloraTreeLavalandAsh

  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorBasalt
    - FloorLavalandAsh
    - FloorLavalandPaleGrass
    threshold: -0.28
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.052
      lacunarity: 2
      fractalType: FBm
      octaves: 5
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    entities:
    - WallRockBasalt

  - !type:BiomeDummyLayer
    id: Loot

  - !type:BiomeTileLayer
    threshold: -1
    tile: FloorBasalt

  - !type:BiomeTileLayer
    threshold: 0.30
    noise:
      seed: 12
      noiseType: OpenSimplex2
      frequency: 0.007
      fractalType: FBm
      octaves: 3
      lacunarity: 2
      gain: 0.45
    tile: FloorLavalandAsh

  - !type:BiomeTileLayer
    threshold: 0.68
    noise:
      seed: 53
      noiseType: OpenSimplex2
      frequency: 0.025
      fractalType: FBm
      octaves: 2
      lacunarity: 2
      gain: 0.42
    tile: FloorLavalandPaleGrass
