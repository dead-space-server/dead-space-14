- type: entity
  parent: FloorChasmEntity
  id: LavalandCelestialPit
  name: зияющая яма
  description: Со дна тянет холодом и чем-то фиолетовым. Кажется, там что-то есть.
  categories: [ HideSpawnMenu ]
  components:
  # The storm does not reach the pit (3x3) nor a couple of tiles around it.
  - type: LavalandStormShelter
    radius: 3
  - type: PointLight
    enabled: true
    color: "#9b4dff"
    radius: 4
    energy: 2
    softness: 2

- type: entity
  id: LavalandCelestialInvisibleWall
  name: невидимая стена
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Wall
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight

- type: entity
  id: LavalandCelestialHoleFence
  name: невидимая ограда
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - MidImpassable
        - LowImpassable

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectLavalandCelestialSleep
  name: сон Селестиала
  components:
  - type: ForcedSleepingStatusEffect

- type: entity
  id: LavalandCelestialFlower
  name: фиолетовый цветок
  description: Неестественно яркий цветок. Лепестки едва заметно шевелятся, хотя ветра здесь нет.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    noRot: true
    drawdepth: FloorObjects
    sprite: Decals/Flora/flora_flowers.rsi
    layers:
    - state: flowerspv1
      shader: unshaded
      scale: 1.4, 1.4
  - type: PointLight
    enabled: true
    color: "#b04dff"
    radius: 3
    energy: 2.5
    softness: 2

- type: entity
  id: LavalandCelestialSleepGas
  name: фиолетовый газ
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: true
    drawdepth: Effects
    sprite: Effects/chemsmoke.rsi
    layers:
    - state: chemsmoke
      color: "#9b4dffaa"
      scale: 1.6, 1.6
  - type: PointLight
    enabled: true
    color: "#9b4dff"
    radius: 1.5
    energy: 0.8
  - type: TimedDespawn
    lifetime: 20
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: BaseMob
  id: MobCelestialLavaland
  name: Селестиал
  description: Нам конец...
  categories: [ HideSpawnMenu ]
  components:
  - type: DestructionResistance
  - type: IgnoreKudzu
  - type: Insulated
  - type: StunImmune
  - type: NoSlip
  - type: Sprite
    sprite: _DeadSpace/Lavaland/Celestial/celestial.rsi
    layers:
    - state: Idle
  - type: PointLight
    enabled: true
    color: "#8A2BE2"
    radius: 9
    energy: 9
    softness: 3
  - type: MobThresholds
    thresholds:
      0: Alive
      6000: Dead
  - type: Damageable
    damageContainer: Biological
  - type: GravityAffected
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: CombatMode
  - type: MeleeWeapon
    hidden: true
    damage:
      groups:
        Brute: 15
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: MovementSpeedModifier
    baseWalkSpeed: 0
    baseSprintSpeed: 0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 3.4
        density: 2000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Celestial
    localizedEvents: true
    stationary: true
    breakTiles: false
    phase2Immortal: false
    circleCount: 40
    circleMaxDist: 16
    freezeBeamCount: 50
    freezeCircleCount: 25
    talkSounds:
    - path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Celestial_Talk_1.ogg
    - path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Celestial_Talk_2.ogg
    - path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Celestial_Talk_3.ogg
    variationSound:
      path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Fall_Variation_1.ogg
    beamSound:
      path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Fall_Variation_2.ogg
    volleySound:
      path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Fall_Final.ogg
    futilityCrackSound:
      path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Futile_Crack.ogg
    futilityOrbSounds:
    - path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Futile_Variation_1.ogg
    - path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Futile_Variation_2.ogg
    - path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Futile_Variation_3.ogg
    cutterChargeSound:
      path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Cutter_Charge.ogg
    cutterImpactSound:
      path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Cutter_Impact.ogg
    cutterFinalSound:
      path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Cutter_Final.ogg
    bloomChargeSound:
      path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Death_in_Bloom_Charge.ogg
    bloomFireSound:
      path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Death_in_Bloom_Firing.ogg
    teleportSound:
      path: /Audio/_DeadSpace/Lavaland/Celestial/sounds/Celestial_Talk_1.ogg

# Fight themes of the Celestial: one at random each fight.
- type: soundCollection
  id: LavalandCelestialFight
  files:
  - /Audio/_DeadSpace/Lavaland/Celestial/music/celestial_fight_1.ogg
  - /Audio/_DeadSpace/Lavaland/Celestial/music/celestial_fight_2.ogg
  - /Audio/_DeadSpace/Lavaland/Celestial/music/celestial_fight_3.ogg
