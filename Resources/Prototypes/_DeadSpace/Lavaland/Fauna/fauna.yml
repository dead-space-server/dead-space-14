- type: entity
  id: BaseMobLavalandFauna
  abstract: true
  components:
  - type: LavalandFauna
  # Explosions kill fauna but don't blow the bodies apart, like the bosses.
  - type: DestructionResistance
  - type: LavalandWeatherImmune
  - type: LavalandChasmImmune
  - type: PermanentStatusEffects
    statusEffects:
    - StatusEffectPressureImmunity
  - type: Flammable
    maximumFireStacks: 0
    firestacksOnIgnite: 0
    fireSpread: false
    canResistFire: false
    damage:
      types: {}
  - type: TemperatureDamage
    heatDamageThreshold: 100000
    coldDamageThreshold: -1
    heatDamage:
      types: {}
    coldDamage:
      types: {}

- type: entity
  id: MobLavalandGoliath
  parent: [ MobGoliath, BaseMobLavalandFauna ]
  suffix: Lavaland
  components:
  # The heaviest wall-breaker of lavaland.
  - type: LavalandFauna
    structuralDamage: 150
  - type: LavalandTrophyDrop
    trophy: CrusherTrophyGoliathTentacle
    chance: 0.25
  - type: Sprite
    sprite: _DeadSpace/Lavaland/Mobs/lavaland_monsters.rsi
  - type: Butcherable
    spawned:
    - id: FoodMeatGoliath
      amount: 2
    - id: MaterialGoliathHide1
      amount: 2
      maxAmount: 4
    - id: MaterialBones1
      amount: 2
    - id: PKAUpgradeDamageUp
      prob: 0.01

- type: entity
  id: MobLavalandBasilisk
  parent: [ MobBasilisk, BaseMobLavalandFauna ]
  suffix: Lavaland
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.1
    baseSprintSpeed: 3.1
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Slash: 10
        Piercing: 8
  - type: Butcherable
    spawned:
    - id: DiamondOre1
      amount: 2
      maxAmount: 4
  - type: LavalandDeathDrop
    drops:
    - id: PKAUpgradeExplosiveLavaland
      chance: 0.015

- type: entity
  id: MobLavalandGoldgrub
  parent: [ BaseMobAsteroid, BaseMobLavalandFauna ]
  name: goldgrub
  description: A skittish ore-fed grub with a hoard of valuable minerals in its gut.
  suffix: Lavaland
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeadSpace/Lavaland/Mobs/lavaland_monsters.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: goldgrub
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goldgrub
      Dead:
        Base: goldgrub_dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.6
    baseSprintSpeed: 4
  - type: LavalandGoldgrub
  - type: MobThresholds
    thresholds:
      0: Alive
      45: Dead
  - type: Reflect
    reflectProb: 1
  - type: Tag
    tags:
    - CannotSuicide
    - FootstepSound
  - type: NoSlip

- type: entity
  id: MobLavalandHivelord
  parent: [ MobHivelord, BaseMobLavalandFauna ]
  suffix: Lavaland
  components:
  - type: Sprite
    sprite: _DeadSpace/Lavaland/Mobs/lavaland_monsters.rsi
  - type: BasicEntityAmmoProvider
    proto: MobLavalandHivelordBrood
    capacity: 1
    count: 1

- type: entity
  id: MobLavalandHivelordBrood
  parent: [ MobHivelordBrood, BaseMobLavalandFauna ]
  suffix: Lavaland
  components:
  - type: Sprite
    sprite: _DeadSpace/Lavaland/Mobs/lavaland_monsters.rsi
  # The fauna's explosion resistance keeps its destruction from going off: gone the moment it dies instead.
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: DeleteOnTrigger

- type: entity
  id: MobLavalandLegion
  parent: [ BaseMobAsteroid, MobBloodstream, BaseMobLavalandFauna ]
  name: legion
  description: You can still see what was once human under the shifting mass of corruption.
  components:
  - type: LavalandTrophyDrop
    trophy: CrusherTrophyLegionSkull
    chance: 0.25
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeadSpace/Lavaland/Mobs/lavaland_monsters.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: legion
  - type: DamageStateVisuals
    states:
      Alive:
        Base: legion
      Dead:
        Base: legion_dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2.4
  - type: LavalandLegion
    maxActiveHeads: 2
  - type: MobThresholds
    thresholds:
      0: Alive
      250: Dead
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 0
    attackRate: 0.9
    animation: WeaponArcPunch
    damage:
      types:
        Slash: 15
        Structural: 30
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    showExamineText: false
    availableModes:
    - SemiAuto
    soundGunshot: null
  - type: RechargeBasicEntityAmmo
    showExamineText: false
    rechargeCooldown: 2
    rechargeSound: null
  - type: BasicEntityAmmoProvider
    proto: MobLavalandLegionHead
    capacity: 1
    count: 1
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: SpawnOnTrigger
    proto: MobLavalandLegionHead
    useMapCoords: true
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
    blackboard:
      VisionRadius: !type:Single
        15
      AggroVisionRadius: !type:Single
        16
      NavSmash: !type:Bool
        true
  - type: Tag
    tags:
    - CannotSuicide
    - FootstepSound
  - type: NoSlip
  - type: Butcherable
    spawned:
    # Now and then a legion leaves its soul behind.
    - id: LavalandLegionSoul
      amount: 1
      prob: 0.3
    - id: LavalandLegionSkull
      prob: 0.35
    - id: MaterialBones1
      amount: 2

- type: entity
  id: MobLavalandLegionHead
  parent: [ BaseMobAsteroid, FlyingMobBase, BaseMobLavalandFauna ]
  name: legion head
  description: One of many.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeadSpace/Lavaland/Mobs/lavaland_monsters.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: legion_head
  - type: DamageStateVisuals
    states:
      Alive:
        Base: legion_head
      Dead:
        Base: legion_head
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4.5
  - type: LavalandLegionHead
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 0
    attackRate: 1.2
    range: 0.75
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 10
  - type: Ammo
    muzzleFlash: null
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        15
      AggroVisionRadius: !type:Single
        16
      NavSmash: !type:Bool
        true
  - type: TimedDespawn
    lifetime: 14
  # No corpse left behind to trip over.
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: DeleteOnTrigger
  - type: Tag
    tags:
    - CannotSuicide

# A boulder of the lavaland's surface - now and then a rock mimic instead.
- type: entity
  parent: MarkerBase
  id: LavalandBasaltBoulderSpawner
  name: basalt boulder spawner
  suffix: Lavaland, sometimes a mimic
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _DeadSpace/Lavaland/Structures/basalt_boulder.rsi
      state: rock2
  - type: RandomSpawner
    prototypes:
    - LavalandBasaltBoulder
    rarePrototypes:
    - MobLavalandRockMimic
    rareChance: 0.08
    offset: 0

# Looks like a boulder (it even is the second of them). Seen, it may take a liking to the player and creep after them
# whenever nobody looks; it harms no one until it is hit. Broken, it dies and spills 1 to 6 of some ore.
- type: entity
  parent: [ BaseMobAsteroid, BaseMobLavalandFauna ]
  id: MobLavalandRockMimic
  name: basalt boulder
  description: A weathered block of basalt. Break it with a pickaxe to obtain building stone.
  suffix: Lavaland, мимик
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeadSpace/Lavaland/Mobs/rock_mimic.rsi
    layers:
    - state: rock
      map: [ "enum.LavalandRockMimicLayers.Base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.LavalandRockMimicVisuals.State:
        enum.LavalandRockMimicLayers.Base:
          Rock: { state: rock }
          Waking: { state: wake }
          Walking: { state: walk }
          Awake: { state: sleep }
          Dead: { state: dead }
  # Passes for a boulder: no health on examine, and no health bar (as the lavaland's bosses hide theirs).
  - type: LavalandRockDisguise
  - type: Damageable
    damageContainer: Biological
    healthBarThreshold: 1000000
  - type: LavalandRockMimic
    ores:
    - SteelOre
    - Coal
    - GoldOre
    - SilverOre
    - PlasmaOre
    - UraniumOre
    - DiamondOre
    - MagmiteOre
    angryComponents:
    - type: HTN
      rootTask:
        task: SimpleHostileCompound
      blackboard:
        NavSmash: !type:Bool
          false
  - type: MobThresholds
    thresholds:
      0: Alive
      90: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.6
    baseSprintSpeed: 3.2
  - type: MeleeWeapon
    angle: 0
    attackRate: 0.8
    animation: WeaponArcFist
    soundHit:
      path: /Audio/Effects/break_stone.ogg
    damage:
      types:
        Blunt: 14
        Structural: 20
  # Harms no one, until someone hits it: then that one.
  - type: NpcFactionMember
    factions:
    - Passive
  - type: NPCRetaliation
    attackMemoryLength: 20
  - type: FactionException
  - type: Tag
    tags:
    - CannotSuicide
