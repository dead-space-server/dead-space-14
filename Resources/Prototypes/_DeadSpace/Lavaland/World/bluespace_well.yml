- type: entity
  id: LavalandBluespaceWell
  parent: BaseMachine
  name: блюспейс колодец
  description: Собирает оставленную на лаваленде руду и моркит из подключённых трубами добытчиков. Альт-клик выгружает руду.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _DeadSpace/Lavaland/Structures/Machines/bluespace_well.rsi
    state: icon
  - type: LavalandBluespaceWell
    oreRaidPercents: [ 50 ]
    morkiteRaidPercents: [ 20 ]
    requiredOre: 1000
    collectionDelay: 60
    returnDelay: 60
    oreTypes: [SteelOre, Coal, GoldOre, SilverOre, PlasmaOre, SpaceQuartz, UraniumOre, BananiumOre, DiamondOre, SaltOre, MagmiteOre, BluespaceCrystalOre]
  - type: ContainerContainer
    containers:
      lavaland-well-ore: !type:Container
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [Destruction]

- type: entity
  id: LavalandBluespaceWellFlatpack
  parent: BaseFlatpack
  name: упаковка блюспейс колодца
  components:
  - type: Flatpack
    entity: LavalandBluespaceWell

- type: entity
  id: LavalandWellTeleportSmoke
  name: блюспейс дым
  components:
  - type: TimedDespawn
    lifetime: 2
  - type: Sprite
    sprite: Effects/chemsmoke.rsi
    state: chemsmoke
    drawdepth: Effects
    color: "#66bfffaa"
