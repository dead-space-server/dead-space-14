- type: entity
  id: LavalandObjectiveFolder
  parent: BoxFolderYellowEmpty
  name: папка экспедиционного задания
  description: Запечатанные распоряжения для ведущего утилизатора.
  components:
  - type: LavalandMorkiteMission
    extractorPrototype: LavalandMorkiteExtractor
    extractorCount: 4
    spawnDistance: 40
    morkiteChance: 0.5

- type: entity
  id: LavalandObjectivePaperOre
  parent: Paper
  name: "задание: блюспейс-доставка"
  components:
  - type: Paper
    content: lavaland-objective-paper-ore

- type: entity
  id: LavalandObjectivePaperMorkite
  parent: Paper
  name: "задание: добыча моркита"
  components:
  - type: Paper
    content: lavaland-objective-paper-morkite

- type: entity
  id: LavalandMorkiteExtractor
  parent: BaseMachine
  name: добытчик моркита
  description: Извлекает моркит из глубин Лаваленда при подключении к трубопроводу.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _DeadSpace/Lavaland/Structures/Machines/morkite_extractor.rsi
    state: icon
  - type: LavalandMorkiteExtractor
    requiredExtractionTime: 480
    outputPerSecond: 0.20833334
  - type: NodeContainer
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: Apc
  - type: PowerSupplier
    voltage: Apc
    supplyRate: 5000
  - type: PowerProvider
    voltage: Apc
  - type: ExtensionCableProvider
    transferRange: 1000
