- type: biomeTemplate
  id: LavalandSurface
  layers:
  - !type:BiomeDecalLayer
    divisions: 2
    threshold: 0.84
    noise:
      seed: 51
      noiseType: OpenSimplex2
      frequency: 0.32
    allowedTiles:
    - FloorBasalt
    - FloorLavalandAsh
    - FloorLavalandPaleGrass
    color: "#ff6b24"
    decals:
    - FlowersBROne
    - FlowersBRTwo
    - FlowersBRThree

  # Lava rivers as in the old lavaland generation, only on its own basalt and kept a few tiles off the new biomes
  # (ash, pale grass), so the dark rims of the lava never sit against them: lava is entered only where the ash
  # noise is well below the ash threshold (inverted), then the pale grass one (see LavalandLavaAwayFromAsh).
  - !type:BiomeMetaLayer
    threshold: -0.22
    invert: true
    noise:
      seed: 12
      noiseType: OpenSimplex2
      frequency: 0.007
      fractalType: FBm
      octaves: 3
      lacunarity: 2
      gain: 0.45
    template: LavalandLavaAwayFromAsh

  - !type:BiomeEntityLayer
    threshold: 0.97
    noise:
      seed: 47
      noiseType: OpenSimplex2
      frequency: 0.16
    allowedTiles:
    - FloorBasalt
    - FloorLavalandAsh
    - FloorLavalandPaleGrass
