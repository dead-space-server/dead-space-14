# Necropolis structures for mapping (tgstation): gates, arch, walls, floor, stone tiles.
- type: entity
  id: NecropolisGate
  name: ворота некрополя
  description: Массивные каменные врата.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: Walls
    sprite: _DeadSpace/Lavaland/Structures/Necropolis/necropolis_gate.rsi
    layers:
    - state: gate_dais
    - state: gate_top
    - state: door
      map: [ "enum.LavalandNecropolisGateLayers.Door" ]
  - type: Icon
    sprite: _DeadSpace/Lavaland/Structures/Necropolis/necropolis_gate.rsi
    state: gate_full
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.LavalandNecropolisGateVisuals.State:
        enum.LavalandNecropolisGateLayers.Door:
          Closed: { state: door, visible: true }
          Opening: { state: door_opening, visible: true }
          Open: { visible: false }
          Closing: { state: door_closing, visible: true }
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 4000
  - type: Occluder
  - type: PointLight
    radius: 8
    energy: 1.2
    color: "#c48a18"
  - type: LavalandNecropolisGate
  - type: LavalandStructureFront
    front: NecropolisGateFront

- type: entity
  id: NecropolisGateFront
  name: ворота некрополя
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    drawdepth: Overdoors
    sprite: _DeadSpace/Lavaland/Structures/Necropolis/necropolis_gate.rsi
    layers:
    - state: gate_bottom
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: NecropolisGate
  id: NecropolisGateLocked
  suffix: Заперты
  components:
  - type: LavalandNecropolisGate
    locked: true

- type: entity
  parent: NecropolisGate
  id: NecropolisGateLegion
  name: врата некрополя
  description: Огромные, невозможно большие врата, встроенные в массивную каменную башню.
  suffix: Легион
  components:
  - type: LavalandNecropolisGate
    legionGate: true

- type: entity
  id: NecropolisArch
  name: арка некрополя
  description: Массивная арка над вратами некрополя, встроенная в огромную каменную башню.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    drawdepth: Walls
    sprite: _DeadSpace/Lavaland/Structures/Necropolis/necropolis_arch.rsi
    offset: 0,0.75
    layers:
    - state: arch_top
  - type: Icon
    sprite: _DeadSpace/Lavaland/Structures/Necropolis/necropolis_arch.rsi
    state: arch_full
  - type: Clickable
  - type: LavalandStructureFront
    front: NecropolisArchFront

- type: entity
  id: NecropolisArchFront
  name: арка некрополя
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    drawdepth: Overdoors
    sprite: _DeadSpace/Lavaland/Structures/Necropolis/necropolis_arch.rsi
    offset: 0,0.75
    layers:
    - state: arch_bottom
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: NecropolisDrakeStatue
  name: статуя дракона
  description: Высокая базальтовая скульптура гордого и величественного дракона. Его глаза — шесть светящихся самоцветов.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeadSpace/Lavaland/Structures/Necropolis/drake_statue.rsi
    state: drake_statue
    offset: 0,0.5
    noRot: true
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 1000
        mask:
        - MachineMask
        layer:
        - WallLayer

- type: entity
  parent: NecropolisDrakeStatue
  id: NecropolisDrakeStatueFalling
  name: разрушающаяся статуя дракона
  description: Высокая базальтовая скульптура дракона. По её поверхности бегут трещины, а часть уже отвалилась.
  components:
  - type: Sprite
    state: drake_statue_falling

- type: entity
  id: WallNecropolisLavaland
  name: стена некрополя
  description: С виду непробиваемая стена.
  suffix: Некрополь, неразрушимая
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: Wall
  - type: IsRoof
  - type: Icon
    sprite: _DeadSpace/Lavaland/Structures/Necropolis/necropolis_wall.rsi
    state: full
  - type: Sprite
    drawdepth: Walls
    sprite: _DeadSpace/Lavaland/Structures/Necropolis/necropolis_wall.rsi
    layers:
    - state: full
  - type: PlacementReplacement
    key: walls
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 4000
  - type: Airtight
  - type: RadiationBlocker
    resistance: 2
  - type: BlockWeather
  - type: Occluder

