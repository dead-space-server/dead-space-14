- type: entity
  parent: BaseItem
  id: LavalandCleavingSaw
  name: пила-тесак
  description: Пила, отлично пускающая кровь зверям, раскладывается в длинный тесак. Сложенной бьёт очень быстро и копит кровотечение у фауны, разложенной рубит медленно, с бонусным уроном, и только она добивает - накопленное кровотечение взрывается мощным уроном.
  components:
  - type: Sprite
    sprite: _DeadSpace/Lavaland/Objects/Weapons/cleaving_saw.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: icon-on }
          False: { state: icon }
  - type: Item
    size: Large
    sprite: _DeadSpace/Lavaland/Objects/Weapons/cleaving_saw_inhands.rsi
  - type: ItemToggle
    onActivate: true
    soundActivate:
      collection: MantisExtend
    soundDeactivate:
      collection: MantisRetract
  - type: ItemTogglePrefix
    prefixOn: on
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Slash: 20
    deactivatedDamage:
      types:
        Slash: 12
  - type: MeleeWeapon
    wideAnimationRotation: -135
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    damage:
      types:
        Slash: 12
  - type: Sharp
  - type: LavalandCleavingSaw
  - type: LavalandCleavingSawEffects
    openBonusDamage:
      types:
        Slash: 30
    bleedBurstDamage:
      types:
        Slash: 200
  - type: UseDelay
    delay: 0.3
  - type: StaticPrice
    price: 5000

- type: entity
  parent: BaseItem
  id: LavalandSoulscythe
  name: коса душ
  description: Древняя реликвия ада, созданная дьяволами, чтобы утвердить свою власть над демонами. Сейчас она спит.
  components:
  - type: Sprite
    sprite: _DeadSpace/Lavaland/Objects/Weapons/soulscythe.rsi
    layers:
    - state: icon
    - state: gem
      shader: unshaded
      visible: false
      map: [ "enum.LavalandArtifactLayers.Base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.LavalandArtifactVisuals.Active:
        enum.LavalandArtifactLayers.Base:
          True: { visible: true }
          False: { visible: false }
  - type: LavalandSoulscythe
    maxBlood: 100
    bloodPerHit: 10
    moveCostPerTile: 1
    awakenComponents:
    - type: GhostRole
      name: lavaland-soulscythe-role-name
      description: lavaland-soulscythe-role-description
      rules: lavaland-soulscythe-role-rules
    - type: GhostTakeoverAvailable
    - type: CombatMode
  - type: Item
    size: Huge
    sprite: _DeadSpace/Lavaland/Objects/Weapons/soulscythe_inhands.rsi
  - type: MeleeWeapon
    wideAnimationRotation: -135
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    damage:
      types:
        Slash: 25
  - type: Sharp
  - type: StaticPrice
    price: 5000

- type: entity
  parent: BaseItem
  id: LavalandCainAndAbel
  name: Каин и Авель
  description: Парные кинжалы Колосса. Серия ударов по крупным существам усиливает каждый следующий удар и призывает огоньки; удар по вам сбрасывает серию. Клик вдаль выпускает огоньки в цель.
  components:
  - type: Sprite
    sprite: _DeadSpace/Lavaland/Objects/Weapons/cain_and_abel.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _DeadSpace/Lavaland/Objects/Weapons/cain_and_abel.rsi
  - type: MeleeWeapon
    wideAnimationRotation: -135
    # The demons' claw arc; right button - their arrow arc instead of swinging the sprite.
    animation: WeaponArcClaw
    wideAnimation: WeaponArcStatic
    range: 2.2
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    damage:
      types:
        Slash: 15
  - type: Sharp
  - type: LavalandDeepNightDark
  - type: PointLight
    radius: 3
    energy: 2
    color: "#3db9db"
  - type: LavalandCainAndAbel
    wispFireSound: /Audio/Magic/blink.ogg
    crystalsCooldown: 15
    launchCooldown: 7
    crystalRingRadius: 2
  - type: StaticPrice
    price: 5000

