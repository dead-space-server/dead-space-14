- type: entity
  parent: BaseItem
  id: LavalandStormStaff
  name: посох бурь
  description: Древний посох из останков Легиона. Ветер вздымается, когда его взмахивают. Удар по цели призывает молнию, использование в руке разгоняет пепельную бурю.
  components:
  - type: Sprite
    sprite: _DeadSpace/Lavaland/Objects/Weapons/storm_staff.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _DeadSpace/Lavaland/Objects/Weapons/storm_staff.rsi
  - type: MeleeWeapon
    wideAnimationRotation: -135
    soundHit:
      path: /Audio/Effects/Lightning/lightningshock.ogg
    damage:
      types:
        Heat: 20
  - type: LavalandStormStaff
    boltDamage:
      types:
        Shock: 15
    aimSound: /Audio/Effects/Lightning/lightningshock.ogg
    boltSound: /Audio/Effects/Lightning/lightningbolt.ogg
    dispelSound: /Audio/Magic/staff_change.ogg
  - type: StaticPrice
    price: 5000

