- type: htnCompound
  id: LavalandMinebotCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: InnateRangedCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: FollowCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

- type: entity
  parent: [ BaseSimpleMob, MobCombat, MobRobotic ]
  id: MobLavalandMinebot
  name: минбот
  description: Шахтёрский дрон. Следует за хозяином, отстреливает фауну, сам вскапывает рудные жилы и собирает руду во встроенную сумку боргов. Альт-клик — выгрузить руду; привязать к себе и переключить сбор — через меню.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeadSpace/Lavaland/Mobs/Minebot.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: minebot
  - type: HTN
    rootTask:
      task: LavalandMinebotCompound
    blackboard:
      FollowRange: !type:Single
        3
      FollowCloseRange: !type:Single
        1.5
  - type: NpcFactionMember
    factions:
    - PetsNT
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 60
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Dead
    showOverlays: false
    # A repaired minebot gets back to work.
    allowRevives: true
  # Like a borg: a welder mends the frame, cable coils the wiring (cables heal only silicon).
  - type: Damageable
    damageContainer: Silicon
  - type: Repairable
    damageValue: -10
    doAfterDelay: 1
    fuelCost: 0.5
    allowSelfRepair: false
  # Borg sounds as it breaks down.
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1.5
  - type: BasicEntityAmmoProvider
    proto: BulletKinetic
    capacity: 1
    count: 1
  - type: Gun
    fireRate: 0.7
    useKey: false
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 4.5
  - type: Tag
    tags:
    - DoorBumpOpener
    - Unimplantable
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg
  - type: LavalandWeatherImmune
  - type: LavalandChasmImmune
  - type: LavalandMinebot
    collectRange: 1.5
    oreTag: Ore

