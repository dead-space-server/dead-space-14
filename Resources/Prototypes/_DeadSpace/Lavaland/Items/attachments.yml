- type: entity
  parent: BaseCrusherTrophy
  id: CrusherTrophyVortexTalisman
  name: талисман вихря
  description: Светящаяся безделушка, бывшая когда-то маяком Иерофанта. Годится как трофей для кинетического крашера.
  components:
  - type: Sprite
