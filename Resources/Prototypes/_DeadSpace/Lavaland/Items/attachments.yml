- type: entity
  parent: BaseAction
  id: ActionAttachmentToggleLight
  name: Фонарик на оружии
  description: Включить или выключить фонарик, закреплённый на оружии.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0.5
    icon: { sprite: Objects/Tools/flashlight.rsi, state: flashlight }
    iconOn: { sprite: Objects/Tools/flashlight.rsi, state: flashlight-on }
  - type: InstantAction
    event: !type:AttachmentToggleLightActionEvent
