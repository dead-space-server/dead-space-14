          amount: 2
        - id: Crowbar
        - id: Wrench
        - id: Screwdriver
        - id: Wirecutter
        - id: Welder
        - id: ClothingHeadHatWelding
        - id: MaterialWoodPlank
          amount: 3
        - id: MaterialCloth
        - id: MaterialBones10
        - id: SheetSteel
        - id: PowerCellMedium
          amount: 3

- type: entity
  parent: CratePirate
  id: CrateAshWalkerSupplies
  name: ash walker provisions crate
  description: Eighteen bottles of drinking water and twelve cooked steaks for the settlement's first hunts.
  components:
