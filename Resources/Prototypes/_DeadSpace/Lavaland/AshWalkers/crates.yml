- type: entity
  parent: CratePirate
  id: CrateAshWalkerHunting
  name: ash walker hunting crate
  description: Bone armor, knives, bows and arrows for three hunters.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingOuterArmorBoneAshWalker
          amount: 3
        - id: ClothingHeadHelmetBoneAshWalker
          amount: 3
        - id: KitchenKnife
          amount: 3
        - id: BowImprovised
          amount: 3
        - id: ArrowImprovised
          amount: 12

- type: entity
  parent: CratePirate
  id: CrateAshWalkerTools
  name: ash walker workshop crate
  description: Mining and building tools, buckets, materials and spare light batteries for a small settlement.
  components:
