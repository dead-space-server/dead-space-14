- type: entity
  parent: BasePlant
  id: BaseLavalandPlant
  abstract: true
  components:
  - type: Sprite
    noRot: true
    scale: 0.5625, 0.5625
    offset: 0, -0.21875
  - type: Plant
    lifespan: 200
    oldAgeDamage: 0
    maturation: 4
    growthStages: 1
    potency: 20
    endurance: 100
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantGrowth
    waterConsumption: 0.5
    nutrientConsumption: 0.25
  - type: PlantWeedPest
    pestGrowthChance: 0
  - type: PlantAtmospheric
    lowHeatTolerance: 230
    highHeatTolerance: 400
    lowPressureTolerance: 0
    highPressureTolerance: 300

- type: entity
  parent: hydroponicsSoil
  id: BaseLavalandWildPlant
  abstract: true
  components:
  - type: PlantTray
    trayConsumptionMultiplier: 0
    weedGrowthChance: 0

- type: entity
  parent: BaseLavalandPlant
  id: LavalandPolyporePlant
  name: ash polypore
  components:
  - type: Sprite
    sprite: _DeadSpace/Lavaland/AshWalkers/polypore.rsi
  - type: Plant
    production: 8
    yield: 3
  - type: PlantData
    name: ash-walker-plant-polypore
    noun: seeds-noun-spores
    packetPrototype: LavalandPolyporeSeeds
    productPrototypes: [FoodLavalandPolypore]
  - type: PlantChemicals
    chemicals:
      Nutriment:
        min: 2
        max: 2
        potencyDivisor: 20
      Ethanol:
        min: 1
        max: 1
        potencyDivisor: 20

- type: entity
  parent: BaseLavalandWildPlant
  id: LavalandPolyporeWild
  name: wild ash polypore
  description: A hardy Lavaland plant rooted in a patch of fertile ash.
  components:
