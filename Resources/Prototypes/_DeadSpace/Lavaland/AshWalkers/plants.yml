    plant: LavalandPolyporePlant

- type: entity
  parent: SeedBase
  id: LavalandPolyporeSeeds
  name: ash polypore spores
  components:
  - type: Seed
    plantId: LavalandPolyporePlant

- type: entity
  parent: FoodProduceBase
  id: FoodLavalandPolypore
  name: polypore shavings
  description: Fibrous strips of mushroom. They can be pressed into timber, shaped into bowls or used for dressings.
  components:
  - type: Sprite
    sprite: _DeadSpace/Lavaland/AshWalkers/polypore.rsi
    state: produce
  - type: Produce
    plantId: LavalandPolyporePlant
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: Ethanol
          Quantity: 1
  - type: Extractable
    grindableSolutionName: food
  - type: Tag
    tags:
    - Mushroom
    - LavalandPolypore

