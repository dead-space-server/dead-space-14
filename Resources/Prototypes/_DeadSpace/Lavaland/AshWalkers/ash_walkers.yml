- type: entity
  parent: MobReptilian
  id: MobAshWalker
  name: ash walker
  description: A digitigrade reptilian native to Lavaland.
  components:
  - type: AshWalker
    faunaDamageMultiplier: 2.5
    gunWhitelist:
      tags:
      - AshWalkerUsableGun
    footwearWhitelist:
      tags:
      - AshWalkerWearableFootwear
  - type: AshWalkerTribeMember
  - type: PermanentStatusEffects
    statusEffects:
    - StatusEffectPressureImmunity
  - type: LavalandWeatherImmune
  - type: VirusImmun
    immunAll: true
  - type: TemperatureProtection
    heatingCoefficient: 0.25
    coolingCoefficient: 0.1
  - type: TemperatureDamage
    heatDamageThreshold: 500
    coldDamageThreshold: 260
  - type: TemperatureSpeed
    thresholds:
      260: 0.9
      240: 0.8
      220: 0.7
  - type: SlowOnDamage
    speedModifierThresholds:
      120: 0.7
      160: 0.5
  - type: Damageable
    damageModifierSet: AshWalker
  - type: MobThresholds
    thresholds:
      0: Alive
      180: PreCritical
      220: Critical
      350: Dead
  - type: Stamina
    baseCritThreshold: 180
    decay: 6
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.75
    baseSprintSpeed: 4.95
  - type: MeleeWeapon
    damage:
      types:
        Slash: 8
  - type: HumanoidAppearance
    customBaseLayers:
      LLeg:
        id: MobAshWalkerLLeg
      RLeg:
        id: MobAshWalkerRLeg
      LFoot:
        id: MobAshWalkerFoot
      RFoot:
        id: MobAshWalkerFoot
  - type: RandomHumanoidAppearance
    randomizeName: true
  - type: Language
    selectedLanguage: ReptilianLanguage
    knownLanguages:
    - ReptilianLanguage
  - type: NpcFactionMember
    factions:
    - AshWalker
  - type: Loadout
    prototypes:
    - AshWalkerStartingGear

- type: damageModifierSet
  id: AshWalker
  coefficients:
    Blunt: 0.75
    Slash: 0.75
    Piercing: 0.75
    Heat: 0.5
    Cold: 0.5
    Poison: 0.6
    Radiation: 0.6

- type: humanoidBaseSprite
  id: MobAshWalkerLLeg
  baseSprite:
    sprite: _DeadSpace/Lavaland/AshWalkers/legs.rsi
    state: digitigrade_1_l_leg

- type: humanoidBaseSprite
  id: MobAshWalkerRLeg
  baseSprite:
    sprite: _DeadSpace/Lavaland/AshWalkers/legs.rsi
    state: digitigrade_1_r_leg

- type: humanoidBaseSprite
  id: MobAshWalkerFoot

- type: npcFaction
  id: AshWalker
  hostile:
  - NanoTrasen
  - Syndicate
  - SyndicateAgent
  - SimpleHostile
  - Xeno
  - Zombie
  - AllHostile
  - Dragon
  - Revolutionary
  - Revenant
  - Ninja
  - Wizard
  - Xenoborg
  - CentralCommand
  - Taipan
  - Necromorfs
  - SpiderTerror
  - Blob

- type: Tag
  id: AshWalkerUsableGun

- type: Tag
  id: AshWalkerWearableFootwear

- type: entity
  parent: BaseStructure
  id: AshWalkerEgg
  name: ash walker egg
  description: A large yellow egg. A humanoid silhouette stirs beneath its shell.
  components:
  - type: AshWalkerEgg
  - type: Sprite
    sprite: _DeadSpace/Lavaland/AshWalkers/egg.rsi
    state: large_egg
    noRot: true
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.3
        density: 60
        hard: false
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: Pullable
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [Destruction]
  - type: GhostRole
    name: ghost-role-information-ash-walker-name
    description: ghost-role-information-ash-walker-description
    rules: ghost-role-information-ash-walker-rules
    makeSentient: false
    reregister: false
    job: AshWalker
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    - MindRoleAshWalker
  - type: GhostRoleMobSpawner
    prototype: MobAshWalker
    availableTakeovers: 1
    deleteOnSpawn: true

- type: entity
  parent: ClothingUniformJumpsuitGladiator
  id: ClothingUniformAshWalker
  name: ash walker uniform
  description: Simple tribal clothing, made for life among the ashes.
  components:
  - type: SuitSensor
    controlsLocked: true
    randomMode: false
    mode: SensorOff

- type: startingGear
  id: AshWalkerStartingGear
  equipment:
    jumpsuit: ClothingUniformAshWalker
    head: ClothingHeadHatGladiator
    back: ClothingBackpackSatchelLeather
  inhand:
  - SpearBone
  storage:
    back:
    - DrinkFlaskOldWater
    - FoodMeatCooked
    - Gauze5
    - AloeCream5
    - Lantern
    - BookAshWalkerRecipes
    - BookAshWalkerGuide
