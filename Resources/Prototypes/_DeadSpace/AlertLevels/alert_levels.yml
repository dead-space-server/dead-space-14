- type: alertLevels
  id: taipanStationAlerts
  defaultLevel: green
  levels:
    green:
      announcement: alert-level-green-announcement
      sound: /Audio/_DeadSpace/AlertLevels/green.ogg
      color: Green
      emergencyLightColor: LawnGreen
      shuttleTime: 600
    white:
      announcement: alert-level-white-announcement
      selectable: true
      sound: /Audio/_DeadSpace/AlertLevels/Taipan/white.ogg
      color: White
      emergencyLightColor: White
      forceEnableEmergencyLights: true
      shuttleTime: 600
    omega:
      announcement: alert-level-omega-announcement
      selectable: false
      sound: /Audio/_DeadSpace/AlertLevels/Taipan/omega.ogg
      color: Red
      emergencyLightColor: Red
      forceEnableEmergencyLights: true
    none:
      announcement: alert-level-none-announcement
      sound: null 
      color: Green
      emergencyLightColor: Green
      isSecondary: true
    audit:
      announcement: alert-level-audit-announcement
      selectable: false
      sound: /Audio/_DeadSpace/AlertLevels/Taipan/audit.ogg
      color: MidnightBlue
      emergencyLightColor: DarkBlue
      shuttleTime: 600
      isSecondary: true
    zeta:
      announcement: alert-level-zeta-announcement
      selectable: true
      sound: /Audio/_DeadSpace/AlertLevels/Taipan/zeta.ogg
      color: PowderBlue
      emergencyLightColor: PowderBlue
      forceEnableEmergencyLights: true
      isSecondary: true
    yellow:
      announcement: alert-level-yellow-announcement
      sound: /Audio/_DeadSpace/AlertLevels/yellow.ogg
      color: Yellow
      emergencyLightColor: Goldenrod
      forceEnableEmergencyLights: true
      shuttleTime: 600
      isSecondary: true