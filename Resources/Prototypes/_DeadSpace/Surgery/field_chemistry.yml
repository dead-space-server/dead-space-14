- type: reaction
  id: Hemostatin
  impact: Medium
  minTemp: 310
  priority: 1
  reactants:
    TranexamicAcid:
      amount: 1
    Iron:
      amount: 1
    Silicon:
      amount: 1
  products:
    Hemostatin: 2

- type: reaction
  id: Calcigen
  impact: Medium
  minTemp: 330
  reactants:
    Bicaridine:
      amount: 1
    Milk:
      amount: 1
    Phosphorus:
      amount: 1
  products:
    Calcigen: 2

- type: reaction
  id: Ferrolysin
  impact: Medium
