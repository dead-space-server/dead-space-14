  name: reagent-name-hemostatin
  group: Medicine
  desc: reagent-desc-hemostatin
  physicalDesc: reagent-physical-desc-viscous
  flavor: medicine
  color: "#8c1d2c"
  metabolisms:
    Medicine:
      effects:
      - !type:LimbMend
        bleed: 0.6
        text: reagent-effect-guidebook-hemostatin
