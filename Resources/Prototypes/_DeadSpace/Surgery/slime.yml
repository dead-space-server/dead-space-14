- type: reagent
  id: SlimeGel
  name: reagent-name-slime-gel
  desc: reagent-desc-slime-gel
  physicalDesc: reagent-physical-desc-viscous
  flavor: bitter
  color: "#6ec8a0"
  boilingPoint: 340
  meltingPoint: 250

- type: reaction
  id: SlimeGel
  reactants:
    Slime:
      amount: 1
    Flour:
      amount: 1
    Sugar:
      amount: 1
  products:
    SlimeGel: 2

- type: entity
  parent: BaseItem
  id: SurgerySlimeGel
  name: slime gel
  description: A tube of mixed slime gel. Packs torn gel and the collagen scaffold.
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Medical/slime_gel.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/glue.rsi
    size: Small
  - type: Tag
    tags:
    - SurgeryTool
  - type: SurgeryTool
    precision: 0.85
    slip: 0.05
    wobble: 10
    verbs: []
    softVerbs:
    - MendBone
  - type: SurgerySlimeGel
    uses: 5
  - type: StaticPrice
    price: 25

- type: entity
  parent: BaseMentalAction
  id: ActionSurgerySlimeRegrow
  name: Regrow a limb
  description: "Spend a large share of your satiation to regrow a missing limb. Priority: head, arm, hand, leg, foot."
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: 6
    useDelay: 30
    icon:
      sprite: _DeadSpace/Interface/Actions/surgery.rsi
      state: slime_regrow
  - type: InstantAction
    event: !type:SurgerySlimeRegrowEvent
  - type: ActionRequireSatiation
    satiation: Hunger
    amount: 80
    spend: true
    failReason: surgery-slime-regrow-hungry

