- type: surgeryOperation
  id: TakeCore
  side: Front
  soft: true
  zone: Torso
  name: surgery-op-take-core
  steps:
  - verb: Incise
    layer: Skin
    hint: SlimeStretch
    undo: MendBone
  - verb: Retract
    layer: Skin
    game: Steady
  - verb: Clamp
    layer: Cavity
    game: Clamp
  - verb: Extract
    layer: Cavity
    game: Dots
    hint: SlimeScoop
    undo: Insert
    organ: Core
  close:
  - verb: MendBone
    layer: Skin
    game: Glue
    hint: SlimeStir
    undo: Incise

