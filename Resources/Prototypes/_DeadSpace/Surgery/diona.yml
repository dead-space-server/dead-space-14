- type: reagent
  id: DionaSap
  name: reagent-name-diona-sap
  desc: reagent-desc-diona-sap
  physicalDesc: reagent-physical-desc-sticky
  flavor: sweet
  color: "#c4a35a"
  boilingPoint: 400
  meltingPoint: 280

- type: entity
  parent: BaseItem
  id: SurgeryDionaSap
  name: diona sap
  description: Thick sap for sealing bark cuts.
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Medical/diona_sap.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/glue.rsi
    size: Small
  - type: Tag
    tags:
    - SurgeryTool
  - type: SurgeryTool
    precision: 0.8
    slip: 0.08
    wobble: 12
    verbs:
    - SealSap
    plantVerbs:
    - SealSap
  - type: SurgeryDionaSap
    uses: 5
  - type: StaticPrice
    price: 20

- type: entity
  parent: BaseItem
  id: SurgeryHatchet
  name: surgical hatchet
  description: A light sterile hatchet with a wrapped grip. Splits diona bark along the seam and takes off a limb.
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Medical/surgical_hatchet.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Hydroponics/hatchet.rsi
    size: Small
  - type: Tag
    tags:
    - SurgeryTool
  - type: SurgeryTool
    precision: 0.85
    slip: 0.12
    wobble: 14
    sawHits: 2
    plantVerbs:
    - Chop
    - Amputate
  - type: Sharp
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    damage:
      types:
        Slash: 7
  - type: StaticPrice
    price: 35

