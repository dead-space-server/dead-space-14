- type: entity
  id: ActionLimbImplantArmBlade
  name: arm blade
  description: Extend or retract the blade in this arm.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: Interface/Actions/changeling.rsi
      state: armblade
    useDelay: 2
    raiseOnAction: true
    itemIconStyle: BigAction
  - type: InstantAction
    event: !type:OnRetractableItemActionEvent
  - type: RetractableItemAction
    spawnedPrototype: ArmBlade
    summonSounds:
      collection: gib
    retractSounds:
      collection: gib

- type: entity
  parent: BaseItem
  id: LimbImplantHudBase
  abstract: true
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Medical/limb_implants.rsi
  - type: Item
    size: Tiny

- type: entity
  parent: LimbImplantHudBase
  id: LimbImplantMedicalHud
  name: ocular medical HUD implant
  description: A surgical ocular implant. Installed in the eyes, it grants a medical overlay.
  components:
  - type: Sprite
    state: medhud
  - type: LimbImplant
    slots:
    - Eyes
    implantComponents:
    - type: ShowHealthBars
    - type: ShowHealthIcons
    - type: ShowMedicalStatusIcons

- type: entity
  parent: [ LimbImplantHudBase, BaseSecurityContraband ]
  id: LimbImplantSecurityHud
  name: ocular security HUD implant
  description: A surgical ocular implant. Installed in the eyes, it shows jobs, records, mindshields and contraband.
  components:
  - type: Sprite
    state: sechud
  - type: LimbImplant
    slots:
    - Eyes
    implantComponents:
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons
    - type: ShowContrabandDetails
    - type: ShowPatrolIcons
    - type: ShowSecurityMedicalStatusIcons
    - type: ShowPersonnelRecordIcons

- type: entity
  parent: LimbImplantHudBase
  id: LimbImplantDiagnosticHud
  name: ocular diagnostic HUD implant
  description: A surgical ocular implant. Installed in the eyes, it shows the integrity of machines and borgs and access reader settings.
  components:
  - type: Sprite
    state: diaghud
  - type: LimbImplant
    slots:
    - Eyes
    implantComponents:
    - type: ShowHealthBars
      damageContainers:
      - Inorganic
      - Silicon
    - type: ShowAccessReaderSettings

- type: entity
  parent: [ LimbImplantHudBase, BaseCommandContraband ]
  id: LimbImplantCommandHud
  name: ocular administration HUD implant
  description: A surgical ocular implant. Installed in the eyes, it shows jobs, personnel records and medical status.
  components:
  - type: Sprite
    state: cmdhud
  - type: LimbImplant
    slots:
    - Eyes
    implantComponents:
    - type: ShowJobIcons
    - type: ShowPersonnelRecordIcons
    - type: ShowMedicalStatusIcons

- type: entity
  parent: LimbImplantHudBase
  id: LimbImplantNutritionHud
  name: ocular nutrition HUD implant
  description: A surgical ocular implant. Installed in the eyes, it shows how hungry and thirsty people are.
  components:
  - type: Sprite
    state: foodhud
  - type: LimbImplant
    slots:
    - Eyes
    implantComponents:
    - type: ShowSatiationIcons
      shownTypes:
      - Hunger
      - Thirst

- type: entity
  parent: [ LimbImplantHudBase, BaseSyndicateContraband ]
  id: LimbImplantSyndicateHud
  name: ocular syndicate HUD implant
  description: A surgical ocular implant. Installed in the eyes, it marks syndicate agents and shows security data.
  components:
  - type: Sprite
    state: synhud
  - type: LimbImplant
    slots:
    - Eyes
    implantComponents:
    - type: ShowSyndicateIcons
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons

- type: entity
  parent: LimbImplantHudBase
  id: LimbImplantFlashShield
  name: ocular flash shield implant
  description: A surgical ocular implant. Installed in the eyes, it shields them from flashes and welding light.
  components:
  - type: Sprite
    state: flashshield
  - type: LimbImplant
    slots:
    - Eyes
    implantComponents:
    - type: FlashImmunity
      showInExamine: false
    - type: EyeProtection

- type: entity
  parent: LimbImplantHudBase
  id: LimbImplantWeldShield
  name: ocular welding shield implant
  description: A surgical ocular implant. Installed in the eyes, it shields them from welding light.
  components:
  - type: Sprite
    state: weldshield
  - type: LimbImplant
    slots:
    - Eyes
    implantComponents:
    - type: EyeProtection

- type: entity
  parent: LimbImplantHudBase
  id: LimbImplantChemicalHud
  name: ocular chemical scanner implant
  description: A surgical ocular implant. Installed in the eyes, it shows the chemical composition of solutions.
  components:
  - type: Sprite
    state: chemhud
  - type: LimbImplant
    slots:
    - Eyes
    implantComponents:
    - type: SolutionScanner

- type: entity
  parent: BaseItem
  id: LimbImplantArmBlade
  name: arm blade implant
  description: A surgical implant for an arm. Once installed, the arm can extend a retractable blade.
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Medical/limb_implants.rsi
    state: armblade
  - type: Item
    size: Small
  - type: LimbImplant
    slots:
    - ArmLeft
    - ArmRight
    size: 1
    implantAction: ActionLimbImplantArmBlade

