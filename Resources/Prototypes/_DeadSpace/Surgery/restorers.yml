- type: entity
  parent: BaseItem
  id: BaseLimbRestorer
  abstract: true
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Medical/limb_restorers.rsi
  - type: Item
    size: Small
  - type: LimbRestorer
    primeSound:
      path: /Audio/Machines/high_tech_confirm.ogg
    useSound:
      path: /Audio/Effects/teleport_arrival.ogg
      params:
        volume: -4

- type: entity
  parent: [ BaseLimbRestorer, BaseSyndicateContraband ]
  id: LimbRestorerSyndicate
  name: Cybersun bluespace reconstructor
  description: A bluespace field rebuilds the patient from a backup scan. Sets bones, stops internal bleeding, pulls shards, mends organs and grows lost ones back. Does not grow limbs.
  components:
  - type: Sprite
    state: syndicate
  - type: LimbRestorer
    charges: 3
    prime: 4
    delay: 8
    selfDelay: 12
    health: 0.6
    heal:
    - Bleed
    - Fracture
    - Shard
    - Flesh
    - Skin
    - Atrophy
    - Health
    - Organs
    - Infection
    - Rejection
    - MissingOrgans
  - type: StaticPrice
    price: 2500

- type: entity
  parent: BaseLimbRestorer
  id: LimbRestorerNecro
  name: necro reliquary
  description: A shard of the Marker in a brass frame. Its whisper knits flesh, bone and organs, and even pushes out new limbs. The body pays for it.
  components:
  - type: Sprite
    state: necro
  - type: LimbRestorer
    charges: 2
    prime: 6
    delay: 10
    selfDelay: 14
    health: 0.5
    regrow: 0.3
    primedLine: limb-restorer-primed-necro
    doneLine: limb-restorer-done-necro
    primeSound:
      path: /Audio/_DeadSpace/Necromorfs/marker_red.ogg
      params:
        volume: -8
    cost:
      types:
        Cellular: 15
    heal:
    - Bleed
    - Fracture
    - Shard
    - Flesh
    - Skin
    - Atrophy
    - Health
    - Organs
    - Infection
    - Rejection
    - MissingOrgans
    - Limbs
  - type: StaticPrice
    price: 2500

- type: entity
  parent: BaseLimbRestorer
  id: LimbRestorerPirate
  name: smuggler's bluespace balm
  description: A tin of stolen bluespace slurry. Sets bones, stops internal bleeding, pulls shards and patches organs. Tastes like a fuel tank.
  components:
  - type: Sprite
    state: pirate
  - type: LimbRestorer
    charges: 2
    prime: 5
    delay: 9
    selfDelay: 12
    health: 0.4
    cost:
      types:
        Poison: 8
    heal:
    - Bleed
    - Fracture
    - Shard
    - Flesh
    - Skin
    - Health
    - Organs
    - Infection
  - type: StaticPrice
    price: 1500

- type: entity
  parent: BaseLimbRestorer
  id: LimbRestorerERT
  name: ERT field autosurgeon
  description: A Nanotrasen field autosurgeon for response team medics. Does a full internal repair and regrows organs, but only on someone else.
  components:
  - type: Sprite
    state: ert
  - type: LimbRestorer
    charges: 6
    prime: 3
    delay: 7
    allowSelf: false
    health: 0.6
    primeSound:
      path: /Audio/Machines/twobeep.ogg
    heal:
    - Bleed
    - Fracture
    - Shard
    - Flesh
    - Skin
    - Atrophy
    - Health
    - Organs
    - Infection
    - Rejection
    - MissingOrgans
  - type: StaticPrice
    price: 2000

- type: entity
  id: ActionLimbRestorerImplant
  name: Emergency reconstruction
  description: Fire the implant. Rebuilds the inside of the body in a second.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: _DeadSpace/Objects/Medical/limb_restorers.rsi
      state: implant
    useDelay: 20
    checkCanInteract: false
  - type: InstantAction
    event: !type:LimbRestorerImplantEvent

- type: entity
  id: ActionLimbRestorerImplantNecro
  parent: ActionLimbRestorerImplant
  name: Marker's heartbeat
  description: Wake the shard under your skin. It knits you together and takes its share.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: _DeadSpace/Objects/Medical/limb_restorers.rsi
      state: implant_necro

- type: entity
  id: LimbRestorerImplantSyndicate
  name: emergency reconstruction implant
  description: A Cybersun bluespace node under the skin. Two charges, fires by itself when the wearer goes critical.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionLimbRestorerImplant
  - type: LimbRestorer
    charges: 2
    autoCrit: true
    health: 0.5
    useSound:
      path: /Audio/Effects/teleport_arrival.ogg
      params:
        volume: -4
    cost:
      types:
        Blunt: -15
        Slash: -15
        Piercing: -15
        Heat: -10
        Cellular: 4
    heal:
    - Bleed
    - Fracture
    - Shard
    - Flesh
    - Skin
    - Atrophy
    - Health
    - Organs
    - Infection
    - Rejection
    - MissingOrgans

- type: entity
  id: LimbRestorerImplantNecro
  name: Marker's heart
  description: A sliver of the Marker sewn under the skin. Two charges, wakes by itself when the wearer goes critical, and even pushes out lost limbs.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionLimbRestorerImplantNecro
  - type: LimbRestorer
    charges: 2
    autoCrit: true
    health: 0.5
    regrow: 0.3
    doneLine: limb-restorer-done-necro
    useSound:
