    - Infection
    - Rejection
    - MissingOrgans
    - Limbs

- type: entity
  id: LimbRestorerImplantPirate
  name: smuggler's patch-up implant
  description: A cheap bluespace capsule under the skin. One charge, cracks open by itself when the wearer goes critical.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionLimbRestorerImplant
  - type: LimbRestorer
    charges: 1
    autoCrit: true
    health: 0.4
    useSound:
      path: /Audio/Effects/teleport_arrival.ogg
      params:
        volume: -4
    cost:
      types:
        Blunt: -10
        Slash: -10
        Piercing: -10
        Poison: 8
    heal:
    - Bleed
    - Fracture
    - Shard
    - Flesh
    - Skin
    - Health
    - Organs
    - Infection

- type: entity
  id: LimbRestorerImplanterSyndicate
  suffix: emergency reconstruction
  parent: BaseImplantOnlyImplanterSyndi
  components:
  - type: Implanter
    implant: LimbRestorerImplantSyndicate

- type: entity
  id: LimbRestorerImplanterNecro
  suffix: Marker's heart
  parent: BaseImplantOnlyImplanterSyndi
  components:
  - type: Implanter
    implant: LimbRestorerImplantNecro

- type: entity
  id: LimbRestorerImplanterPirate
  suffix: smuggler's patch-up
  parent: BaseImplantOnlyImplanterSyndi
  components:
  - type: Implanter
    implant: LimbRestorerImplantPirate

