# ============================================================================
# DUBIOUS GLAND TABLE (real gland drops)
# ============================================================================

- type: entityTable
  id: DubiousGlandTable
  table: !type:GroupSelector
    children:
    # Not-so Annoying - 50% chance
    - !type:GroupSelector
      weight: 50
      children:
      - id: ImplantDubiousHealth
      - id: ImplantDubiousInvisible
      - id: ImplantDubiousArtifact
      - id: ImplantDubiousRepairable

    # Annoying/Disruptive - 35% chance
    - !type:GroupSelector
      weight: 35
      children:
      - id: ImplantDubiousShock

    # Very Disruptive - 15% chance
    - !type:GroupSelector
      weight: 15
      children:
      - id: ImplantDubiousAA

- type: entity
  name: Doubtful Organ Spawner
  id: DubiousOrganSpawner
  suffix: ИВЕНТ Ivan_Kuvalda
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: _DeadSpace/Abductor/dubious_organs.rsi
        state: gland
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: DubiousGlandTable
