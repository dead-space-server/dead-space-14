# ============================================================================
# WEAPONS
# ============================================================================

# Base bullet for the decloner bolt (ported from Goob BaseBulletStarlight).
- type: entity
  id: BaseBulletStarlight
  suffix: ИВЕНТ Ivan_Kuvalda
  name: BaseBullet
  description: If you can see this you're probably dead!
  abstract: true
  components:
  - type: Reflective
  - type: FlyBySound
  - type: Clickable
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: bullet
      shader: unshaded
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0
    angularDamping: 0
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: False
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Piercing: 14
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: TimedDespawn
    lifetime: 10

- type: entity
  id: BulletDeclone
  suffix: ИВЕНТ Ivan_Kuvalda
  name: decloner bolt
  parent: BaseBulletStarlight
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Abductor/abductor_projectiles.rsi
    layers:
    - state: declone
  - type: Projectile
    damage:
      types:
        Radiation: 20
    ignoreResistances: true
    soundHit:
      collection: MeatLaserImpact

- type: entity
  parent: [BaseWeaponBatterySmall, BaseMajorContraband]
  id: WeaponAlien
  suffix: ИВЕНТ Ivan_Kuvalda
  name: alien pistol
  description: Is this a war crime? Probably.
  components:
  - type: Sprite
    sprite: _DeadSpace/Abductor/abductor_pistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: BatteryAmmoProvider
    proto: BulletDisablerTrace # adapted (BulletDisabler in Goob)
    fireCost: 50
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletDisablerTrace # adapted (BulletDisabler in Goob)
      fireCost: 50
    - proto: BulletDeclone
      fireCost: 125
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true

- type: entity
  parent: [BaseWeaponBattery, BaseGunWieldable, BaseMajorContraband]
  id: WeaponDecloner
  suffix: ИВЕНТ Ivan_Kuvalda
  name: decloner
  description: Is this a war crime? Absolutely.
  components:
  - type: Clothing
    sprite: _DeadSpace/Abductor/abductor_decloner.rsi
  - type: Sprite
    sprite: _DeadSpace/Abductor/abductor_decloner.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Item
    shape:
    - 0,0,5,1
  - type: BatteryAmmoProvider
    proto: BulletDeclone
    fireCost: 125
  - type: Battery
    maxCharge: 2000
    startingCharge: 2000
  - type: Appearance
  - type: MagazineVisuals
