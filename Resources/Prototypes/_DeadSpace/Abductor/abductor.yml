# ============================================================================
# ALIEN BLOOD (reagent + flavor)
# ============================================================================

- type: flavor
  id: alienblood
  flavorType: Base
  description: flavor-base-alienblood

- type: reagent
  parent: Blood
  id: AlienBlood
  name: reagent-name-alien-blood
  group: Biological
  desc: reagent-desc-alien-blood
  flavor: alienblood
  color: "#4B076D"
  recognizable: true
  physicalDesc: reagent-physical-desc-glowing

# ============================================================================
# DUBIOUS GLANDS ("weird glands" - experiment results, delivered as implants)
# REHWORK (DS14): glands are no longer surgery organs grafted via the
# experimentator, they are subdermal implants administered with disposable
# implanters. Only effects available natively in dead-space are used.
# ============================================================================

- type: entity
  id: ImplantDubiousBase
  suffix: ИВЕНТ Ivan_Kuvalda
  parent: BaseSubdermalImplant
  name: doubtful gland
  categories: [ HideSpawnMenu ]
  abstract: true
  description: A microscopic alien gland that can be injected under the skin of a test subject.
  components:
  - type: Sprite
    sprite: _DeadSpace/Abductor/dubious_organs.rsi
    state: gland
  - type: AbductorOrgan
  - type: Item
    size: Tiny
  - type: Clickable
  - type: InteractionOutline
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: CollisionWake
  - type: Tag
    tags:
    - SubdermalImplant

- type: entity
  id: ImplantDubiousHealth
  suffix: ИВЕНТ Ivan_Kuvalda
  parent: ImplantDubiousBase
  components:
  - type: Sprite
    state: health
  - type: SubdermalImplant
    implantComponents:
    - type: PassiveDamage
      allowedStates:
      - Alive
      - Critical
      damageCap: 150
      damage:
        groups:
          Brute: -0.14
          Burn: -0.14
          Airloss: -0.14
          Toxin: -0.14
          Genetic: -0.14

- type: entity
  id: ImplantDubiousAA
  suffix: ИВЕНТ Ivan_Kuvalda
  parent: ImplantDubiousBase
  components:
  - type: Sprite
    state: emp
  - type: SubdermalImplant
    implantComponents:
    - type: Access
      enabled: true
      groups:
      - AllAccess
    - type: AccessReader
      access: [["Command"], ["Research"]]

- type: entity
  id: ImplantDubiousShock
  suffix: ИВЕНТ Ivan_Kuvalda
  parent: ImplantDubiousBase
  components:
  - type: Sprite
    state: emp
  - type: SubdermalImplant
    implantComponents:
    - type: Insulated
    - type: LightningArcShooter
      arcDepth: 1
      maxLightningArc: 3
      shootMinInterval: 90
      shootMaxInterval: 300
      shootRange: 5
      lightningPrototype: Lightning

- type: entity
  id: ImplantDubiousInvisible
  suffix: ИВЕНТ Ivan_Kuvalda
  parent: ImplantDubiousBase
  components:
  - type: Sprite
    state: species
  - type: SubdermalImplant
    implantComponents:
    - type: Stealth
      enabledOnDeath: false
      maxVisibility: 1.2
    - type: StealthOnMove
      passiveVisibilityRate: -0.25
      movementVisibilityRate: 0.25

- type: entity
  id: ImplantDubiousArtifact
  suffix: ИВЕНТ Ivan_Kuvalda
  parent: ImplantDubiousBase
  components:
  - type: Sprite
    state: mindshock
  - type: SubdermalImplant
    implantComponents:
    - type: XenoArtifact

- type: entity
  id: ImplantDubiousRepairable
  suffix: ИВЕНТ Ivan_Kuvalda
  parent: ImplantDubiousBase
  components:
  - type: Sprite
    state: species
  - type: SubdermalImplant
    implantComponents:
    - type: Repairable
      fuelCost: 5
      doAfterDelay: 3
      damage:
        types:
          Blunt: -10
          Piercing: -10
          Slash: -10

