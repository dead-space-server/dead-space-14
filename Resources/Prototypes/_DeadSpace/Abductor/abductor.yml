# SPDX-License-Identifier: AGPL-3.0-or-later
#
# All Abductor content, consolidated from Goob-Station:
#   - Resources/Prototypes/_Shitmed/** (abductor species, body, organs, glands,
#     tools, surgery, gizmo, weapons, clothing, structures, roles, objectives,
#     gamerules, datasets, tiles)
#   - Resources/Prototypes/_Goobstation/Reagents/biological.yml (AlienBlood)
#   - Resources/Prototypes/_Goobstation/tags.yml (Wonderprod tag)
#   - Resources/Prototypes/_Goobstation/Flavors/flavors.yml (alienblood flavor)
#
# Textures live under Resources/Textures/_DeadSpace/Abductor/*.rsi (renamed to
# avoid collisions), audio under Resources/Audio/_DeadSpace/Abductor/, maps under
# Resources/Maps/_DeadSpace/Abductor/, guidebook under
# Resources/ServerInfo/_DeadSpace/Abductor/.
#
# ADAPTATIONS vs Goob-Station (dead-space-14 uses the OLD SS14 body system):
#   - BodyPrototype "Abductor" rewritten for the old body system:
#     root "torso", BaseTorso part (no BaseChest/BaseGroin exist here), underscore
#     slot names, groin organs folded into the torso slot.
#   - MobAbductor parent BaseMobDisgust -> BaseMobSpeciesOrganic.
#   - BulletDisabler -> BulletDisablerTrace.
#   - BaseMentalAction -> BaseAction.
#   - LanguageKnowledge languages Xeeplian/TauCetiBasic -> GeneralLanguage.
#   - RustRequiresPathStage dropped from walls (Goob-only).
#   - "Spawner" entity category dropped (not used in dead-space).
#
# NOTE: many referenced components/systems are Goob-Station-only C# code
# (Abductor*, Shitmed surgery, ItemSwitch, CollectiveMind, LanguageKnowledge,
# RandomMetadata, WoundableVisuals, Restrict*ByUserTag, Absorbable,
# GrabIntent/Grabbable, gizmo/vest/experimentator interfaces, organ onAdd
# effects, antag selection config, StationEvent chaos, etc.). Port that code
# before this file can boot.

