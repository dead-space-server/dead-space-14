# Stubs for prototypes referenced by the Abductor maps
# (duo_abductor_shuttle.yml / abductor_shuttle.yml) that are not ported to
# this fork. Remove these once the real systems are ported.

# ============================================================================
# DUBIOUS ORGAN SPAWNER (drops one-shot gland implanters)
# ============================================================================

- type: entity
  name: Doubtful Organ Spawner
  id: DubiousOrganSpawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: _DeadSpace/Abductor/dubious_organs.rsi
        state: gland
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: DubiousImplanterTable

# ============================================================================
# ABDUCTOR PLUSHIE
# ============================================================================

- type: entity
  parent: BasePlushie
  id: PlushieAbductor
  name: abductor plushie
  description: A soft stuffed toy made to look like a little abductor.
  components:
  - type: Sprite
    sprite: _DeadSpace/Abductor/abductor_parts.rsi
    state: full

# ============================================================================
# CYBERNETIC EYES
# ============================================================================

- type: entity
  abstract: true
  parent: BaseItem
  id: CyberneticEyesBase
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Mobs/Customization/eyes.rsi
    state: eyes

- type: entity
  parent: CyberneticEyesBase
  id: BasicCyberneticEyes
  name: basic cybernetic eyes
  description: Implants for the assignment of basic tasks.

- type: entity
  parent: CyberneticEyesBase
  id: MedicalCyberneticEyes
  name: medical cybernetic eyes
  description: Medical AIs look through these and see everything you don't want to explain.

- type: entity
  parent: CyberneticEyesBase
  id: SecurityCyberneticEyes
  name: security cybernetic eyes
  description: Security AIs look through these and see everything you don't want to explain.

# ============================================================================
# BIOFABRICATORS (static placeholders)
# ============================================================================

- type: entity
  name: biofabricator
  id: Biofabricator
  description: >-
    A weird machine meant to fabricate living organs. It hums expectantly,
    but its guts have not been ported yet.
  parent: BaseStructure
  components:
  - type: Sprite
    sprite: Structures/Machines/biofabricator.rsi
    state: icon

- type: entity
  name: medical biofabricator
  id: MedicalBiofabricator
  description: >-
    A medical variant of the biofabricator. Equally nonfunctional for now.
  parent: Biofabricator