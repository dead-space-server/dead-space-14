- type: entity
  id: PartFelinid
  parent: [BaseItem, BasePart]
  name: часть тела фелинида
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: LeftArmFelinid
  name: левая рука фелинида
  parent: [PartFelinid, BaseLeftArm]
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: l_arm

- type: entity
  id: RightArmFelinid
  name: правая рука фелинида
  parent: [PartFelinid, BaseRightArm]
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: r_arm

- type: entity
  id: LeftHandFelinid
