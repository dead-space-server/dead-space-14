- type: entity
  parent: [ BasePDA, BaseSyndicateContraband ]
  id: PDAElite
  name: тактический планшет
  description: В теории, на нём можно запустить DOOM1984-...
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/TheCircle/Gear/accessories/pda.rsi
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda"
    - state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - state: "id_overlay"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false
  - type: PdaBorderColor
    borderColor: "#6f695b"
  - type: Icon
    sprite: _DeadSpace/Necromorfs/TheCircle/Gear/accessories/pda.rsi
    state: pda
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    preinstalled:
      - NotekeeperCartridge
      - NanoTaskCartridge
      - BankCartridge
      - MessengerCartridge

