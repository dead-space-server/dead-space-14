# tools_anomalyscanner.rsi
- type: entity
  parent: AnomalyScanner
  id: AnomalyScannerrudi
  name: сканер аномалий «Оракул»
  description: Портативный исследовательский прибор для обнаружения и анализа аномальных объектов. Быстро считывает их состояние и помогает определить дальнейший порядок работы.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/rudi/tools_anomalyscanner.rsi
    layers:
      - state: icon
        map: ["enum.AnomalyScannerVisualLayers.Base"]
      - map: ["enum.AnomalyScannerVisualLayers.Screen"]
        visible: false
        shader: unshaded
      - state: severity_mask
        map: ["enum.AnomalyScannerVisualLayers.SeverityMask"]
        visible: false
        shader: unshaded
      - map: ["enum.AnomalyScannerVisualLayers.Stability"]
        visible: false
        shader: unshaded
      - visible: false
        map: ["enum.AnomalyScannerVisualLayers.Pulse"]
        shader: unshaded
      - state: supercritical
        map: ["enum.AnomalyScannerVisualLayers.Supercritical"]
        shader: unshaded
        visible: false

