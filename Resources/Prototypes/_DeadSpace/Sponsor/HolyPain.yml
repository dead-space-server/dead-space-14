#Сумка
- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackHolyPain
  name: блюспейс кристал HolyPain
  categories: [ HideSpawnMenu ]
  description: Уникальный артефакт на золотой цепи — творение мастера HolyPain, стабилизированный в условиях мёртвого космоса и вручаемый как знак заслуг за вклад в одноимённый проект.
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/HolyPain/backpack.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,13,5
    storageOpenSound:
      collection: CrystalBagOpening
      params:
        variation: 0.125
    storageCloseSound:
      collection: CrystalBagClosing
      params:
        variation: 0.125
    storageInsertSound: 
      collection: CrystalBagItemInsert
      params:
        variation: 0.125
    storageRemoveSound:
      collection: CrystalBagItemRemove
      params:
        variation: 0.125
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: Clothing
    sprite: _DeadSpace/Sponsor/HolyPain/backpack.rsi
    quickEquip: false
    slots:
    - back
    equipSound:
      collection: CrystalBagEquip
      params:
        volume: -9
        variation: 0.125
    unequipSound:
      collection: CrystalBagUnequip
      params:
        volume: -9
        variation: 0.125
  - type: EmitSoundOnPickup
    sound:
      collection: CrystalBagPickup
      params:
        volume: -9
        variation: 0.125
  - type: EmitSoundOnDrop
    sound:
      collection: CrystalBagDrop
      params:
        volume: -11
        variation: 0.125
  - type: EmitSoundOnLand
    sound:
      collection: CrystalBagLand
      params:
        volume: -11
        variation: 0.125
  - type: StorageFill
    contents:
      - id: PillCanisterBicaridine
      - id: PillCanisterDylovene
      - id: PillCanisterDermaline
      - id: PillCanisterHyronalin
      - id: ClothingHandsGlovesHolyPainSecond
      - id: SyringeHolyPain
      - id: ClothingEyesGlassesHolyPain
      - id: BluespaceBeakerHolyPain
      - id: ClothingShoesBootsHolyPain
      - id: JetInjectorHolyPain
      - id: JawsOfLife
      - id: PowerDrill
      - id: WelderExperimental
      - id: Multitool
      - id: MedkitAdvancedFilled
  - type: Tag
    tags: []
  - type: HardsuitIdentification
    nonlethal: true
    wrongOwnerSound:
      path: /Audio/_DeadSpace/Sponsor/HolyPain/CrystalBag/BagDelete.ogg
  - type: ToggleableClothing
    clothingPrototype: ClothingOuterHardsuitHolyPain
    requiredSlot: BACK
    slot: outerClothing
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
      storagebase: !type:Container
        ents: []

# RIG hardsuit
- type: entity
  parent: ClothingOuterHardsuitSecurity
  id: ClothingOuterHardsuitHolyPain
  name: доспех HolyPain
  description: Адский кузнец, по горло набитый чужими дугами, без устали бьёт молотом под непрестанные вопли слабых. Вопросы морали и судьбы его не интересуют. Совестью пусть мучаются те, кому больше нечем заняться.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/HolyPain/hardsuit.rsi
  - type: Clothing
    sprite: _DeadSpace/Sponsor/HolyPain/hardsuit.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitHolyPain
  - type: Item
    size: Huge
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.6
        Heat: 0.5
        Radiation: 0.5
        Caustic: 0.5
  - type: HardsuitSpeedBuff
  - type: PowerCellDraw
    drawRate: 3.6
    enabled: false
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: false
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
      toggleable-clothing: !type:ContainerSlot {}
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        disableEject: true
        whitelist:
          tags:
          - PowerCell
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase]
  id: ClothingHeadHelmetHardsuitHolyPain
  name: энергошлем HolyPain
  description: Если вы хотите познать секреты вселенной — мыслите единицами измерения энергии, частоты и вибрации...
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/HolyPain/helmet.rsi
  - type: Clothing
    sprite: _DeadSpace/Sponsor/HolyPain/helmet.rsi
  - type: PointLight
    color: "#2b7cd9"
    radius: 7
    energy: 8
  - type: PressureProtection
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

