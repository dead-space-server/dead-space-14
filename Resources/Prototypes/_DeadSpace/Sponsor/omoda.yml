# tools_jawsoflife.rsi
- type: entity
  parent: JawsOfLife
  id: JawsOfLifeomoda
  name: челюсти жизни «Санкция»
  description: Мощный гидравлический инструмент для силового вскрытия шлюзов. Любая закрытая дверь перед ним — лишь временное препятствие.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/omoda/tools_jawsoflife.rsi
    state: syn_jaws_pry
  - type: Item
    inhandVisuals:
      left:
      - state: syn_inhand-left
      right:
      - state: syn_inhand-right
    size: Normal
  - type: MultipleTool
    entries:
      - behavior: [ Prying ]
        sprite:
          sprite: _DeadSpace/Sponsor/omoda/tools_jawsoflife.rsi
          state: syn_jaws_pry
        useSound: /Audio/Items/jaws_pry.ogg
        changeSound: /Audio/Items/change_jaws.ogg
      - behavior: [ Cutting ]
        sprite:
          sprite: _DeadSpace/Sponsor/omoda/tools_jawsoflife.rsi
          state: syn_jaws_cutter
        useSound: /Audio/Items/jaws_cut.ogg
        changeSound: /Audio/Items/change_jaws.ogg
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 10

# tools_powerdrill.rsi
- type: entity
  parent: PowerDrill
  id: PowerDrillomoda
  name: электродрель «Конструктив»
  description: Надёжная дрель с электроприводом в чёрно-золотом корпусе для быстрой разборки и монтажа оборудования. Незаменима в случаях, когда чью-то сомнительную архитектурную задумку проще разобрать по винтикам, чем пытаться понять.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/omoda/tools_powerdrill.rsi
    state: drill_screw
  - type: Item
    sprite: _DeadSpace/Sponsor/omoda/tools_powerdrill.rsi
    size: Small
  - type: MultipleTool
    statusShowBehavior: true
    entries:
      - behavior: [ Screwing ]
        sprite:
          sprite: _DeadSpace/Sponsor/omoda/tools_powerdrill.rsi
          state: drill_screw
        useSound:
          path: /Audio/Items/drill_use.ogg
        changeSound:
          path: /Audio/Items/change_drill.ogg
      - behavior: [ Anchoring ]
        sprite:
          sprite: _DeadSpace/Sponsor/omoda/tools_powerdrill.rsi
          state: drill_bolt
        useSound:
          path: /Audio/Items/drill_use.ogg
        changeSound:
          path: /Audio/Items/change_drill.ogg

