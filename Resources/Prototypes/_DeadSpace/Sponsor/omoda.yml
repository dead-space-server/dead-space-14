# hardsuit.rsi
- type: entity
  parent: ClothingOuterHardsuitDominator
  id: ClothingOuterHardsuitomoda
  name: скафандр «Монолит»
  description: Герметичный боевой скафандр в чёрно-золотом исполнении, созданный для тех, кто привык диктовать свои правила в любой среде. Выглядит так, словно его владелец спустился на станцию исключительно для вынесения окончательного приговора.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/omoda/hardsuit.rsi
  - type: Clothing
    sprite: _DeadSpace/Sponsor/omoda/hardsuit.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitomoda
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.6
        Heat: 0.5
        Radiation: 0.5
        Caustic: 0.5
        Stun: 0.65
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: HideLayerClothing
    clothingSlots: 
    - belt
    - back
  - type: HardsuitIdentification
    nonlethal: true
  - type: Tag
    tags: [ ]

