# tools_anomalyscanner.rsi
- type: entity
  parent: AnomalyScanner
  id: AnomalyScanneromoda
  name: сканер аномалий «Ревизор»
  description: Ручной прибор в чёрно-золотом корпусе для анализа нестабильных аномальных объектов. Позволяет безошибочно определить, где естественное явление, а где чья-то халатность на грани катастрофы.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/omoda/tools_anomalyscanner.rsi
    layers:
      - state: icon
        map: ["enum.AnomalyScannerVisualLayers.Base"]
      - map: ["enum.AnomalyScannerVisualLayers.Screen"]
        visible: false
        shader: unshaded
      - state: severity_mask
        map: ["enum.AnomalyScannerVisualLayers.SeverityMask"]
