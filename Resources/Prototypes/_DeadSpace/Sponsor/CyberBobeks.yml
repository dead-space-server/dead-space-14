# tools_anomalyscanner.rsi
- type: entity
  parent: AnomalyScannerPvrsifvlAlt2
  id: AnomalyScannerCyberBobeks
  name: сканер аномалий mil.FORECAST // gen.1
  description: Another evening, I'll be sitting reading in-between your lines.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/pvrsifvlAlt2/tools_anomalyscanner.rsi
    layers:
      - state: icon
        map: ["enum.AnomalyScannerVisualLayers.Base"]
      - map: ["enum.AnomalyScannerVisualLayers.Screen"]
        visible: false
        shader: unshaded
      - state: severity_mask
        map: ["enum.AnomalyScannerVisualLayers.SeverityMask"]
        visible: false
        shader: unshaded
      - map: ["enum.AnomalyScannerVisualLayers.Stability"]
        visible: false
        shader: unshaded
      - visible: false
        map: ["enum.AnomalyScannerVisualLayers.Pulse"]
