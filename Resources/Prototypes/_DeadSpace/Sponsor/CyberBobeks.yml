# tools_jawsoflife.rsi
- type: entity
  parent: JawsOfLife
  id: JawsOfLifeCyberBobeks
  name: челюсти жизни Syn.V // Gen.2
  description: На первый взгляд обычные челюсти жизни, пока не замечаешь пару кровавых пятен на рабочей части устройства. Кажется, владельца лучше не задерживать на стойке...
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/CyberBobeks/tools_jawsoflife.rsi
    state: syn_jaws_pry
  - type: Item
    inhandVisuals:
      left:
      - state: syn_inhand-left
      right:
      - state: syn_inhand-right
    size: Normal
  - type: MultipleTool
    entries:
      - behavior: Prying
        sprite:
          sprite: _DeadSpace/Sponsor/CyberBobeks/tools_jawsoflife.rsi
          state: syn_jaws_pry
        useSound: /Audio/Items/jaws_pry.ogg
        changeSound: /Audio/Items/change_jaws.ogg
      - behavior: Cutting
        sprite:
          sprite: _DeadSpace/Sponsor/CyberBobeks/tools_jawsoflife.rsi
          state: syn_jaws_cutter
        useSound: /Audio/Items/jaws_cut.ogg
        changeSound: /Audio/Items/change_jaws.ogg
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 10
  - type: Tool
    speedModifier: 1.0

