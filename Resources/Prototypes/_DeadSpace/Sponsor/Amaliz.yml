# Backpack
- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackAmaliz
  name: сумка Fashion Dynamics
  description: Тёмная сумка с бирюзовой застёжкой, на лямке имеется красный значок изображающий пульсар. На боковых карманах имеется аккуратная гравировка "by Fashion Dynamics".
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/Amaliz/backpack.rsi
    layers:
    - state: icon
      map: [ base ]
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }
    netsync: false
  - type: Appearance
    netsync: false
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,15,10
  - type: StorageFill
    contents:
    - id: ClothingHandsGlovesAmaliz
    - id: ClothingOuterHardsuitAmaliz
    - id: ClothingMaskGasPrometheus3 # Разрешил использовать маску
    - id: ClothingHeadsetAmaliz
    - id: ClothingShoesBootsMagAmaliz
    - id: ClothingEyesHudAmaliz
    - id: JetpackVoidFilledAmaliz
    - id: DefibrillatorAmaliz
    - id: HyposprayAmaliz
    - id: ClothingNeckCloakAmaliz
    - id: MedkitAdvancedFilled
    - id: DoubleEmergencyOxygenTank
    - id: PaperAmaliz
    - id: ClothingUniformTurtleneckTactic
    - id: PDAAmaliz
    - id: PlushieRuniAmaliz
    - id: JawsOfLifeAmaliz
    - id: PowerDrillAmaliz
    - id: WelderExperimentalAmaliz
    - id: MultitoolAmaliz
    - id: RCDAmaliz
    - id: HolofanProjectorTheZuTi # Разрешил использовать голопроектор
    - id: ADTtelescopicBaton
    - id: JukeboxMK
    - id: TapeRecorderr
    - id: TapeEmpty
    - id: ClothingUnderwearBottomBoxersAmaliz
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

# Hardsuit
- type: entity
  parent: ClothingOuterHardsuitSecurity
  id: ClothingOuterHardsuitAmaliz
  name: скафандр "Вихрь туманности"
  description: Скафандр с малиново-красновыми вставками. Пластины скафандра сделаны из Титана и прошиты углеродным волокном. Судя по внешнему виду, скафандр был создан индивидуально для владельца. Ручная работа.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/Amaliz/hardsuit.rsi
  - type: Clothing
    sprite: _DeadSpace/Sponsor/Amaliz/hardsuit.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitAmaliz
  - type: Item
    size: Huge
  - type: HardsuitIdentification
    nonlethal: true
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.50
        Slash: 0.50
        Piercing: 0.60
        Heat: 0.50
        Radiation: 0.50
        Caustic: 0.50
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HideLayerClothing
    clothingSlots: 
    - belt
    - jumpsuit
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase]
  id: ClothingHeadHelmetHardsuitAmaliz
  categories: [ HideSpawnMenu ]
  name: шлем "Вихрь туманности"
  description: Шлем от одноименного скафандра, с двумя антеннами и встроенными в них фонариками. Имеет большой обзорный визор. На затылке шлема красуется инициалы мастера, который его создавал.
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/Amaliz/helmet.rsi
  - type: Clothing
    sprite: _DeadSpace/Sponsor/Amaliz/helmet.rsi
  - type: PointLight
    color: "#379CCFFF"
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
      - state: on-unshaded
        shader: unshaded
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: EyeProtection
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
    - FacialHair
    clothingSlots:
    - ears
    - mask
    bodyLayers:
    - Head
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

