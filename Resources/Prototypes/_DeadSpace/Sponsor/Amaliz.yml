    - id: PDAAmaliz
    - id: PlushieRuniAmaliz
    - id: JawsOfLifeAmaliz
    - id: PowerDrillAmaliz
    - id: WelderExperimentalAmaliz
    - id: MultitoolAmaliz
    - id: RCDAmaliz
    - id: JukeboxMK
    - id: TapeRecorderr
    - id: TapeEmpty
    - id: ClothingUnderwearBottomBoxersAmaliz
    - id: WeaponCrusherAmaliz
    - id: WeaponProtokineticAmaliz
    - id: ClothingMaskGasAmaliz
