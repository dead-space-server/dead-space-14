  - type: Sprite
    sprite: _DeadSpace/Sponsor/Amaliz/tools_powerdrill.rsi
    state: drill_screw
  - type: Item
    sprite: _DeadSpace/Sponsor/Amaliz/tools_powerdrill.rsi
    size: Small
    inhandVisuals:
      left:
      - state: screw-inhand-left
      right:
      - state: screw-inhand-right
  - type: MultipleTool
    statusShowBehavior: true
    entries:
      - behavior: Screwing
        sprite:
          sprite: _DeadSpace/Sponsor/Amaliz/tools_powerdrill.rsi
          state: drill_screw
        useSound:
          path: /Audio/Items/drill_use.ogg
        changeSound:
          path: /Audio/Items/change_drill.ogg
      - behavior: Anchoring
        sprite:
          sprite: _DeadSpace/Sponsor/Amaliz/tools_powerdrill.rsi
