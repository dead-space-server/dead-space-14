# pda.rsi
- type: entity
  parent: BaseMedicalPDA
  id: PDAAmaliz
  name: гейм-бой планшет
  description: Странный планшет, похожий на модернизированный КПК для игр. Имеет Джойстик и кнопки управления. Либо так запланировано, либо это чья-то шутка при модификации КПК.
  categories: [ HideSpawnMenu ]
  components:
  - type: Icon
    sprite: _DeadSpace/Sponsor/Amaliz/pda.rsi
    state: pda
  - type: Sprite
    sprite: _DeadSpace/Sponsor/Amaliz/pda.rsi
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: pda
    - state: light_overlay
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: unshaded
      visible: false
    - state: light_overlay
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: unshaded
      visible: false
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    preinstalled:
      - CrewManifestCartridge
      - NotekeeperCartridge
      - NanoTaskCartridge
      - NewsReaderCartridge
      - MedTekCartridge
      - AstroNavCartridge
      - MessengerCartridge
  - type: PdaBorderColor
    borderColor: "#0b0817"
    accentHColor: "#242424"
    accentVColor: "#1d1d22"
  - type: Tag
    tags: [ ]

# tools_jawsoflife.rsi
- type: entity
  parent: JawsOfLife
  id: JawsOfLifeAmaliz
  name: металлополимерные челюсти жизни
  description: Металлополимер позволяет использовать инструмент в качестве монтировки и резака, крайне прочный и лёгкий. Интересное инженерное решение.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/Amaliz/tools_jawsoflife.rsi
    state: jaws_pry
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
    size: Normal
  - type: MultipleTool
    entries:
      - behavior: Prying
        sprite:
          sprite: _DeadSpace/Sponsor/Amaliz/tools_jawsoflife.rsi
          state: jaws_pry
        useSound: /Audio/Items/jaws_pry.ogg
        changeSound: /Audio/Items/change_jaws.ogg
      - behavior: Cutting
        sprite:
          sprite: _DeadSpace/Sponsor/Amaliz/tools_jawsoflife.rsi
          state: jaws_cutter
        useSound: /Audio/Items/jaws_cut.ogg
        changeSound: /Audio/Items/change_jaws.ogg
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 10
  - type: Tool
    speedModifier: 1.0

# tools_powerdrill.rsi
- type: entity
  parent: PowerDrillPvrsifvlAlt2
  id: PowerDrillAmaliz
  name: кастомизированная дрель
  description: Кастомизированная дрель, подходящая для работы с различными материалами. Имеет бирюзовые и малиново-красные вставки. 
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/Amaliz/tools_powerdrill.rsi
    state: drill_screw
  - type: Item
    sprite: _DeadSpace/Sponsor/Amaliz/tools_powerdrill.rsi
    size: Small
    inhandVisuals:
      left:
      - state: screw-inhand-left
      right:
      - state: screw-inhand-right
  - type: MultipleTool
    statusShowBehavior: true
    entries:
      - behavior: Screwing
        sprite:
          sprite: _DeadSpace/Sponsor/Amaliz/tools_powerdrill.rsi
          state: drill_screw
        useSound:
          path: /Audio/Items/drill_use.ogg
        changeSound:
          path: /Audio/Items/change_drill.ogg
      - behavior: Anchoring
        sprite:
          sprite: _DeadSpace/Sponsor/Amaliz/tools_powerdrill.rsi
          state: drill_bolt
        useSound:
          path: /Audio/Items/drill_use.ogg
        changeSound:
          path: /Audio/Items/change_drill.ogg

