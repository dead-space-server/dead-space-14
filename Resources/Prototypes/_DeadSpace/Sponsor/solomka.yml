# pda.rsi
- type: entity
  parent: BaseMedicalPDA
  id: PDASolomka
  name: КПК "Белая Пурга"
  description: Кастомизированный КПК НаноТрейзен. Блестит на солнце как утренний снег.
  categories: [ HideSpawnMenu ]
  components:
  - type: Icon
    sprite: _DeadSpace/Sponsor/solomka/pda.rsi
    state: pda
  - type: Sprite
    sprite: _DeadSpace/Sponsor/solomka/pda.rsi
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: pda
    - state: light_overlay
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: unshaded
      visible: false
    - state: id_overlay
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: unshaded
      visible: false
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    preinstalled:
      - CrewManifestCartridge
      - NotekeeperCartridge
      - NanoTaskCartridge
      - NewsReaderCartridge
      - MedTekCartridge
      - AstroNavCartridge
      - MessengerCartridge
  - type: PdaBorderColor
    borderColor: "#ffffff"
    accentHColor: "#00a7f4"
    accentVColor: "#f9f9f9"
  - type: Tag
    tags: [ ]

# tools_jawsoflife.rsi
- type: entity
  parent: JawsOfLife
  id: JawsOfLifeSolomka
  name: металлополимерные челюсти жизни "Белая Пурга"
  description: Металлополимер позволяет использовать инструмент в качестве монтировки и резака. Интересная технология...
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/solomka/tools_jawsoflife.rsi
    state: jaws_pry
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
    size: Normal
  - type: MultipleTool
    entries:
      - behavior: Prying
        sprite:
          sprite: _DeadSpace/Sponsor/solomka/tools_jawsoflife.rsi
          state: jaws_pry
        useSound: /Audio/Items/jaws_pry.ogg
        changeSound: /Audio/Items/change_jaws.ogg
      - behavior: Cutting
        sprite:
          sprite: _DeadSpace/Sponsor/solomka/tools_jawsoflife.rsi
          state: jaws_cutter
        useSound: /Audio/Items/jaws_cut.ogg
        changeSound: /Audio/Items/change_jaws.ogg
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 10
  - type: Tool
    speedModifier: 1.0
  # На поясе не рисуем: в .rsi нет состояния equipped-BELT.
  - type: Clothing
    sprite: _DeadSpace/Sponsor/solomka/tools_jawsoflife.rsi

# tools_powerdrill.rsi
- type: entity
  parent: PowerDrillPvrsifvlAlt2
  id: PowerDrillSolomka
  name: кастомизированная дрель "Белая Пурга"
  description: Кастомизированная белоснежная дрель, подходящая для любых работ. 
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/solomka/tools_drill.rsi
    state: drill_screw
  - type: Item
    sprite: _DeadSpace/Sponsor/solomka/tools_drill.rsi
    size: Small
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: MultipleTool
    statusShowBehavior: true
    entries:
      - behavior: Screwing
        sprite:
          sprite: _DeadSpace/Sponsor/solomka/tools_drill.rsi
          state: drill_screw
        useSound:
          path: /Audio/Items/drill_use.ogg
        changeSound:
          path: /Audio/Items/change_drill.ogg
      - behavior: Anchoring
        sprite:
          sprite: _DeadSpace/Sponsor/solomka/tools_drill.rsi
          state: drill_bolt
        useSound:
          path: /Audio/Items/drill_use.ogg
        changeSound:
          path: /Audio/Items/change_drill.ogg

