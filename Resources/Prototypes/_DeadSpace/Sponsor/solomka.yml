# Backpack
- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackSolomka
  name: сумка "Белая Пурга"
  description: Плотная блоснежная сумка из углеволокна. Сделана искусным мастером. Имеет расширенный отсек для сворачивания костюма.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/solomka/backpack.rsi
    layers:
    - state: icon
      map: [ base ]
  - type: Appearance
    netsync: false
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,15,10
  - type: StorageFill
    contents:
    - id: ClothingHandsGlovesSolomka
    - id: ClothingOuterHardsuitSolomka
    - id: ClothingHeadsetSolomka
    - id: ClothingShoesBootsMagSolomka
    - id: ClothingEyesHudSolomka
    - id: JetpackVoidFilledSolomka
    - id: ClothingNeckScarfSolomka
    - id: ClothingHeadHelmetSolomka
    - id: ClothingUniformJumpsuitSolomka
    - id: ClothingUnderwearBottomBoxersSolomka
    - id: ClothingMaskGasSolomka
    - id: PDASolomka
    - id: PlushieSolomka
    - id: ClothingBeltSolomka
    - id: PaperSolomka
    - id: DoubleEmergencyOxygenTankFilled
    - id: MedkitAdvancedFilled
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

# Hardsuit
- type: entity
  parent: ClothingOuterHardsuitSecurity
  id: ClothingOuterHardsuitSolomka
  name: экзо-костюм "Белая Пурга"
  description: Белоснежный модернизированный экзо-костюм с хорошей мобильностью, защитой и встроенными механическими крыльями, которые дают хорошую подвижность в космосе и пространствах с низкой гравитацией. Обладает искусственным интеллектом, которые предовтращает посторонние использование, а так же помогает владельцу в случае опасности. Данный костюм специально разработан для ведения в боевых условиях и космосе.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/solomka/hardsuit.rsi
  - type: Clothing
    sprite: _DeadSpace/Sponsor/solomka/hardsuit.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitSolomka
  - type: Item
    size: Huge
  - type: HardsuitIdentification
    nonlethal: true
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.50
        Slash: 0.50
        Piercing: 0.60
        Heat: 0.50
        Radiation: 0.50
        Caustic: 0.50
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HideLayerClothing
    clothingSlots:
    - belt
    - jumpsuit
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase]
  id: ClothingHeadHelmetHardsuitSolomka
  categories: [ HideSpawnMenu ]
  name: шлем экзо-костюма "Белая Пурга"
  description: Шлем от одноимённого скафандра. Имеет встроенный излучатель фотонов, а так же встроенный модуль с искусственным интеллектом костюма.
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/solomka/hardsuit_helmet.rsi
  - type: Clothing
    sprite: _DeadSpace/Sponsor/solomka/hardsuit_helmet.rsi
  - type: PointLight
    color: "#faf9f7"
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
      - state: on-unshaded
        shader: unshaded
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: EyeProtection
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
        Radiation: 0.5
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
    - FacialHair
    clothingSlots:
    - ears
    - mask
    bodyLayers:
    - Head
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

