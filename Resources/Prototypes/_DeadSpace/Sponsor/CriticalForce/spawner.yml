- type: jobIcon
  parent: JobIcon
  id: JobIconCriticalForce
  icon:
    sprite: /Textures/_DeadSpace/Sponsor/CriticalForce/misc/icon.rsi
    state: tti

- type: startingGear
  id: CriticalForceOfficerEMT
  equipment:
    jumpsuit: ClothingJumpsuitCriticalForce
    back: ClothingBackpackCriticalForce
    mask: ClothingMaskGasOfficerCriticalForce
    eyes: ClothingEyesHudMedical
    ears: ClothingHeadsetAltCriticalForce
    gloves: ClothingHandsGlovesCombatCriticalForce
    outerClothing: ClothingOuterHardsuitOfficerCriticalForce
    suitstorage: WeaponSubMachineGunC20r
    shoes: ClothingShoesMagBootsCriticalForce
    id: CriticalForceOfficerEMTIDCard
    belt: ClothingBeltWisdomCriticalForceSec
    pocket1: PinpointerVipClient
    pocket2: DoubleEmergencyOxygenTankFilled
  storage:
    back:
    - CrowbarRed
    - BoxMRE
    - MedkitFilled
    - EmergencyRollerBedSpawnFolded
    - BodyBagFolded
    - HandheldGPSBasic

- type: entity
  parent: ClothingBeltStorageBase
  id: ClothingBeltWisdomCriticalForceSec 
  name: разгрузка спасателя CriticalForce
  description: Разгрузочный жилет, необходимый для спасения жизней в экстремальных условиях.
  components:
  - type: Storage
  - type: Sprite
    sprite: _DeadSpace/Sponsor/Wisdom/belt.rsi
  - type: Clothing
    sprite: _DeadSpace/Sponsor/Wisdom/belt.rsi
  - type: Item
    size: Huge
  - type: StorageFill
    contents:
      - id: WeaponPistolMk58
      - id: MagazinePistol
      - id: MagazinePistolSubMachineGun
      - id: HandheldHealthAnalyzer
      - id: EmergencyMedipen

- type: entity
  parent: IDCardStandard
  categories: [ HideSpawnMenu ]
  id: CriticalForceOfficerEMTIDCard
  name: ID-карта Офицера безопасности CriticalForce
  description: Карта контрагента корпорации.
  components:
  - type: IdCard
    jobTitle: job-title-tti-officer
    jobIcon: JobIconCriticalForce
  - type: Access
    tags:
    - CounterpartyNT
    - Medical
    - Paramedic
    - Coroner
    - Maintenance
    - External
  - type: Sprite
    layers:
    - state: silver
    - state: idbrigmedic

- type: randomHumanoidSettings
  id: EventHumanoidCriticalForceOfficer
  parent: EventHumanoidERT
  components:
    - type: AutoImplant
      implants:
      - MindShieldImplant
    - type: GhostRole
      name: Офицер CriticalForce
      description: Стабилизируйте указанного пациента и организуйте медицинскую эвакуацию. Согласуйте действия с медотделом и службой безопасности станции.
      rules: ghost-role-information-tti-rules
      requirements:
        - !type:DepartmentTimeRequirement
          department: Medical
          time: 36000 # 10 hours
        - !type:DepartmentTimeRequirement
          department: Security
          time: 36000 # 10 hours
      raffle:
        settings: short
    - type: Loadout
      prototypes: [ CriticalForceOfficerEMT ]
    - type: RandomMetadata
      nameSegments:
      - NamesCriticalForceOfficerEMT
      - NamesLastERT
      nameFormat: name-format-ert
    - type: NpcFactionMember
      factions:
      - NanoTrasen

- type: entity
  id: RandomHumanoidSpawnerCriticalForceOfficerEMT
  # categories: [ HideSpawnMenu ]
  parent: RandomHumanoidSpawnerERTMedicalAmber
  name: Офицер Критикал-Форс
  components:
    - type: RandomHumanoidSpawner
      settings: EventHumanoidCriticalForceOfficer
