# EncryptionKey

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyCriticalForce
  name: ключ шифрования CriticalForce
  description: Ключ шифрования CriticalForce.
  components:
  - type: EncryptionKey
    channels:
    - CriticalForce
    defaultChannel: CriticalForce
  - type: Sprite
    layers:
    - state: crypt_blue
    - state: nano_label

- type: radioChannel
  id: CriticalForce
  name: chat-radio-tti
  keycode: 'з'
  frequency: 2707
  color: "#00d0ff"
  longRange: true

- type: entity
  name: пинпоинтер
  suffix: вип
  id: PinpointerVipClient
  categories: [ HideSpawnMenu ]
  description: Указатель местоположения пациента медицинской эвакуационной службы.
  parent: [ PinpointerBase, BaseCommandContraband ]
  components:
  - type: Sprite
    layers:
    - state: pinpointer-way
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Pinpointer
    updateTargetName: true

- type: entity
  parent: BaseSubdermalImplant
  id: TrackingImplantCriticalForce
  name: имплант медицинского вызова CriticalForce
  description: Передаёт запрос на медицинскую эвакуацию при критическом состоянии носителя. Рассчитан на один принятый вызов.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionCallErtHelp
    whitelist:
      components:
      - MobState
  - type: ResponseErtImplant
    team: CriticalForce
    allowedStates:
    - Critical

- type: entity
  parent: BaseImplantOnlyImplanter
  id: DeathRattleImplanterCriticalForce
  name: имплантер медицинского вызова CriticalForce
  categories: [ HideSpawnMenu ]
  components:
  - type: Implanter
    implant: TrackingImplantCriticalForce

