# Hardsuit
- type: entity
  parent: ClothingOuterHardsuitSecurity
  id: ClothingOuterHardsuitAnarchistVanity
  name: тяжелый скафандр «Патриот»
  categories: [ HideSpawnMenu ]
  description: Тяжёлый, израненный временем скафандр, ставший последней опорой умирающего воина. Его системы поддерживают жизнь Патриота, пока массивные пластины защищают истощённое тело. Каждая трещина, вмятина и заменённая деталь хранит историю десятилетий войны и память о павших братьях, которых он пережил. Она стала последним панцирем старого солдата — тем, что осталось между его разрушенным телом и миром, против которого он продолжал идти вперёд.
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/AnarchistVanity/hardsuit.rsi
  - type: Clothing
    sprite: _DeadSpace/Sponsor/AnarchistVanity/hardsuit.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.6
        Heat: 0.5
        Radiation: 0.5
        Caustic: 0.5
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitAnarchistVanity
  - type: Item
    size: Huge
  - type: Tag
    tags: []


- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitAnarchistVanity
  categories: [ HideSpawnMenu ]
  name: шлем скафандра «Потерянный Лик Добродетеля»
  description: Массивный закрытый шлем, полностью скрывающий лицо Патриота. Потёртый металл покрыт шрамами старых сражений, а встроенная система дыхания помогает поддерживать жизнь умирающего воина. За его безликой маской скрывается не только измученное тело, но и память о павших братьях.
