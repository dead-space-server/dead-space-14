# jacket
- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterCoatAnarchistVanity
  name: пальто Млечной пути
  description: Длинное аристократическое пальто глубокого тёмно-бордового оттенка, отделанное алыми вставками и потускневшим золотом. Тяжёлая ткань почти достигает земли, а чрезмерно длинные рукава свободно свисают по бокам — владелец практически никогда не надевает их, предпочитая носить пальто наброшенным на плечи, словно королевскую мантию. Золотые эполеты и декоративные элементы придают ему вид старинного военного облачения. За благородной внешностью скрывается древнее существо чудовищной силы, некогда мечтавшее о мире, где люди и вампиры смогут существовать вместе.
