  suffix: Filled
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/MrGman/emergency_double.rsi
    state: icon
  - type: Item
    sprite: _DeadSpace/Sponsor/MrGman/emergency_double.rsi
