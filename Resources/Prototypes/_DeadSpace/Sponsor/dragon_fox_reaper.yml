- type: entity
  parent: CrateGeneric
  id: CrateDragonFoxReaper
  name: каменный ящик
  components:
  - type: Icon
    sprite: _DeadSpace/Sponsor/DragonFox/Reaper/crate.rsi
  - type: Sprite
    sprite: _DeadSpace/Sponsor/DragonFox/Reaper/crate.rsi
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
    - state: paper
      sprite: Structures/Storage/Crates/labels.rsi
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialBasalt1:
            min: 3
            max: 5

