# Coat2
- type: entity
  parent: ClothingOuterWinterCoatToggleable
  id: ClothingOuterCoatDragonFoxReaper2
  name: плащ "Смерти"
  description: плащ из теней, сотканный из шёпота ушедших эпох — его края растворяются в сумраке, стирая грань между мирами. Капюшон скрывает лик вечности, обрамлённый бахромой из застывшего времени.
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/DragonFox/Reaper/outer2.rsi
  - type: Clothing
    sprite: _DeadSpace/Sponsor/DragonFox/Reaper/outer2.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodDragonFoxReaper2

- type: entity
  parent: ClothingHeadHatHoodWinterBase
  id: ClothingHeadHatHoodDragonFoxReaper2
  categories: [ HideSpawnMenu ]
  name: капюшон "Смерти"
  description: Капюшон "Смерти" — не просто деталь одежды, а врата между мирами, сотканные из самой тишины, что наступает после последнего вздоха. Его ткань не имеет привычной текстуры это переплетение сумеречных нитей и остывшего света — они не отражают ни луну, ни звёзды, а будто втягивают свет внутрь, превращая капюшон в сгусток первозданной темноты. 
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/DragonFox/Reaper/helmet2.rsi
  - type: Clothing
    sprite: _DeadSpace/Sponsor/DragonFox/Reaper/helmet2.rsi
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
    - FacialHair
    clothingSlots:
    - ears
    bodyLayers:
    - Head

- type: entity
  parent: ClothingHandsGlovesColorWhite
  id: ClothingHandsGlovesDragonFoxReaper2
  name: перчатки Смерти
  description: Перчатки Смерти — будто сотканы из тишины, которая наступает после последнего вздоха. Ткань не похожа ни на кожу, ни на бархат - это переплетение сумеречных нитей, каждая из которых — оборванная нить судьбы; в полумраке они слабо мерцают тусклым серебром, а на свету словно растворяются, оставляя лишь едва заметную дымку вокруг силуэта.
  components:
    - type: Sprite
      sprite: _DeadSpace/Sponsor/DragonFox/Reaper/gloves2.rsi
    - type: Clothing
      sprite: _DeadSpace/Sponsor/DragonFox/Reaper/gloves2.rsi
    - type: Item
      sprite: _DeadSpace/Sponsor/DragonFox/Reaper/gloves2.rsi

- type: entity
  parent: ADTClothingFootWrapsHighWhite
  id: ClothingFootDragonFoxReaper2
  name: ботинки "Жнеца"
  description: Ботинки "Жнеца" будто выкованы из застывшей тишины между ударами сердца. Их тёмно‑серая кожа не просто тёмная — она словно поглощает свет, делая каждый шаг почти невидимым - кажется, что фигура не идёт, а сама тень подтягивает её вперёд.
  components:
    - type: Sprite
      sprite: _DeadSpace/Sponsor/DragonFox/Reaper/boots2.rsi
    - type: Clothing
      sprite: _DeadSpace/Sponsor/DragonFox/Reaper/boots2.rsi
    - type: Item
      sprite: _DeadSpace/Sponsor/DragonFox/Reaper/boots2.rsi

- type: entity
  parent: ToySword
  id: ToyScytheDragonFoxReaper2
  name: Игрушечная Коса "Смерти и Жнеца"
  description: Игрушечная Коса "Смерти и Жнеца"- это не просто игрушечное орудие, а ключ к вратам между мирами — изогнутое лезвие будто выковано из застывшего мгновения, когда свет окончательно уступает место тени.
  components:
  - type: EnergySword
    colorOptions:
      - Black
  - type: Sprite
    sprite: _DeadSpace/Sponsor/3eilado/e_scythe.rsi
    layers:
      - state: e_sword
        shader: shaded
      - state: e_sword_blade
        color: "#FFFFFF"
        visible: false
        shader: unshaded
        map: [ "blade" ]
      - sprite: _DeadSpace/Sponsor/DragonFox/Reaper/c.rsi
        state: t
  - type: ToggleableVisuals
    spriteLayer: blade
    inhandVisuals:
      left:
        - state: inhand-left-blade
          shader: unshaded
      right:
        - state: inhand-right-blade
          shader: unshaded
  - type: Item
    size: Normal
    sprite: _DeadSpace/Sponsor/3eilado/e_scythe.rsi

- type: entity
  parent: BasePlushie
  id: PlushieDragonFoxReaper2
  name: плюшевый "Жнец"
  description: парадокс уюта и тайны - серая ворсистая ткань будто впитывает полумрак, превращая игрушку в сгусток тишины. Лик‑череп с наивно‑огромными глазами хранит секрет — в них мерцает отблеск далёких звёзд, виденных лишь на пороге сна. Пухлые белые «ладошки» будто готовы поймать падающую звезду или удержать ускользающий миг. Пушистый помпон‑«штрих» над головой — намёк на искру жизни, тлеющую даже в самой глубокой тьме.
  components:
  - type: Sprite
    sprite: _DeadSpace/Sponsor/DragonFox/Reaper/toy.rsi
    state: toy


