- type: entity
  parent: CustomizableSpawnerCentralCommandOfficer
  id: CustomizableSpawnerCentralCommandOfficerAlt
  name: Офицер безопасности ЦК (второй сет)
  suffix: ОЦК, Призрачная роль, Кастомизируемый персонаж
  components:
  - type: Sprite
    layers:
    - state: timed
    - sprite: Markers/jobs.rsi
      state: centcom
  - type: CustomizableHumanoidSpawner
    jobPrototype: CentralCommandOfficerAlt
    allowedSpecies:
    - Human
    - Shark
    - Demon
    - Reptilian
    - Arachnid
    - SlimePerson
    - Tajaran
  - type: GhostRole
    name: ghost-role-information-centcomofficer-name
    description: ghost-role-information-centcomofficer-description
    rules: ghost-role-information-centcom-personal-rules
    category: ghost-role-information-centcomm-category
    job: CentralCommandOfficerAlt
    raffle:
      settings: short

- type: roleLoadout
  id: JobCentralCommandOfficerAlt
  groups:
  - CentralCommandOfficerAltLoadout
  - Survival
  - GroupSpeciesBreathTool
  - CentcommOfficerUnderwear

- type: loadoutGroup
  id: CentralCommandOfficerAltLoadout
  name: spawner-loadout-centcomm-officer
  hidden: true
  loadouts:
  - CentralCommandOfficerAltLoadout

- type: loadout
  id: CentralCommandOfficerAltLoadout
  equipment:
    jumpsuit: ClothingUniformJumpsuitCentcomOfficerGreen
    neck: SecurityWhistle
    back: ClothingBackpackMilitarySatchel
    shoes: ClothingShoesBootsCombatFilled
    eyes: ClothingEyesGlassesHiddenSecurity
    suitstorage: WeaponEnergyShotgun
    pocket1: TelescopicShield
    pocket2: WeaponPistolX01
  storage:
    back:
    - BoxZiptie

