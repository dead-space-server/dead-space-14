- type: entity
  parent: GasCanister
  id: GasCanisterPsychogen
  name: psychogen canister
  description: Open the release valve and it floods the room. Breathing it gives a biological schizophrenia.
  components:
  - type: Sprite
    layers:
    - state: greenys
  - type: GasCanister
    gasMixture:
      volume: 1500
      moles:
        Psychogen: 2769.36
      temperature: 293.15
