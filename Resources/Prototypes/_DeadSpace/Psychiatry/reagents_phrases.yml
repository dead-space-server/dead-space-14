- type: reagent
  id: PsychogenGas
  name: reagent-name-psychogen-gas
  desc: reagent-desc-psychogen-gas
  physicalDesc: reagent-physical-desc-gaseous
  color: "#c8b4f0"
  boilingPoint: -20
  meltingPoint: -80
  metabolisms:
    Gas:
      effects:
      - !type:PsychiatryInhale
        minScale: 0.15

- type: reagent
  id: Schizotoxin
  name: reagent-name-schizotoxin
  group: Toxins
  desc: reagent-desc-schizotoxin
  physicalDesc: reagent-physical-desc-opaque
  flavor: bitter
  color: "#4B0082"
  metabolisms:
    Poison:
      metabolismRate: 0.5
      effects:
      - !type:HealthChange
        probability: 0.1
        damage:
          types:
            Cellular: 0.2

- type: reagent
  id: NeuroClarity
  name: reagent-name-neuroclarity
  group: Medicine
  desc: reagent-desc-neuroclarity
  physicalDesc: reagent-physical-desc-shiny
  flavor: medicine
  color: "#E8F7FF"
  metabolisms:
    Medicine:
      metabolismRate: 0.05
      effects:
      - !type:PsychiatryClarityDose
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: NeuroClarity
          min: 16
        damage:
          types:
            Poison: 1
            Asphyxiation: 1
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: NeuroClarity
          min: 16
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: NeuroClarity
          min: 16
        type: Local
        visualType: Medium
        messages: [ "generic-reagent-effect-nauseous" ]
        probability: 0.25
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: NeuroClarity
          min: 16
        probability: 0.5

- type: reagent
  id: PsychiatryRemedy
  name: reagent-name-psychiatry-remedy
  group: Medicine
  desc: reagent-desc-psychiatry-remedy
  physicalDesc: reagent-physical-desc-shiny
  flavor: medicine
  color: "#F4E7B2"
  metabolisms:
    Medicine:
      metabolismRate: 1.0
      effects: []

- type: reagent
  id: PsychogenLatent
  name: reagent-name-psychogen-latent
  group: Toxins
  desc: reagent-desc-psychogen-latent
  physicalDesc: reagent-physical-desc-powdery
  flavor: bitter
  color: "#6B5B95"
  metabolisms:
    Poison:
      metabolismRate: 1.0
      effects:
      - !type:PsychiatryPsychogenDose

