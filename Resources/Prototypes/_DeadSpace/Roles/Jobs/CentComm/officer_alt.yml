  description: job-description-centcom-officer
  playTimeTracker: JobCentralCommandOfficerAlt
  setPreference: false
  requirements:
    - !type:DepartmentTimeRequirement
      department: Security
      time: 72000 # 20 hours
  startingGear: CentcomOfficerAltGear
  icon: "JobIconNanotrasen"
  supervisors: job-supervisors-centcom-administrator
  canBeAntag: false
  accessGroups:
  - AllAccess
  access:
  - CentralCommand
  - ErtTeamLeader
  special:
