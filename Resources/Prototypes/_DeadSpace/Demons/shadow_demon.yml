- type: damageModifierSet
  id: DemonShadow
  coefficients:
    Blunt: 1
    Slash: 1
    Piercing: 1
    Shock: 1
    Cold: 0
    Heat: 0.4
    Poison: 0
    Radiation: 0

- type: entity
  id: MobDemonShadow
  parent:
  - MobCombat
  - FlyingMobBase
  - MobDamageable
  - BaseMob
  name: неизвестный
  suffix: Теневой демон
  description: Жуткий демон.
  components:
  - type: StaminaResistance
    damageCoefficient: 0.2
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: MovementIgnoreGravity
  - type: Clickable
  - type: CantGetMagicOnSwap
  - type: CameraArchiveIgnore
  - type: Sprite
    noRot: true
    overrideContainerOcclusion: true
    drawdepth: Ghosts
    sprite: _DeadSpace/Demons/demon_shadow.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: running
  - type: DamageStateVisuals
    states:
      Alive:
        Base: running
      Dead:
        Base: running
  - type: Input
    context: "ghost"
  - type: Hands
    hands:
      hand_right:
        location: Right
    sortedHands:
    - hand_right
    activeHandId: hand_right
    canBeStripped: false
  - type: ContainerFill
    containers:
      hand_right:
      - WeaponDemonShadowHand
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 15
  - type: Damageable
    damageContainer: BiologicalMetaphysical
    damageModifierSet: DemonShadow
  - type: DamagedByFlashing
    flashDamage:
      types:
        Heat: 2
  - type: NoSlip
  - type: Examiner
    skipChecks: true
  - type: Eye
    visMask:
      - Normal
      - Astral
  - type: Visibility
    layer: 16
  - type: ContentEye
    maxZoom: 1.2, 1.2
  - type: Speech
    speechVerb: Ghost
  - type: MobThresholds
    thresholds:
      0: Alive
      250: Dead
  - type: DemonShadow
  - type: Demon
  - type: MeleeWeapon
    altDisarm: false
    hidden: true
    angle: 45
    soundHit:
        path: /Audio/Effects/demon_attack1.ogg
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
        Blunt: 7
        Piercing: 3
        Heat: 10
        Structural: 40
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: NightVision
    animation: true
    transitionSpeed: 100
    color: "#DC143C11"
  - type: AutoDeleteOnDeath
  - type: ZombieImmune
  - type: ImmunitetInfectionDead
  - type: Stamina
  - type: Vocal
    sounds:
      Male: Demon
      Female: Demon
      Unsexed: Demon
  - type: LockCocoon
    allowedStates:
    - Dead
    - Critical
    isHumanoid: true
    lockCocoon: ActionLockShadowCocoon
    cocoon: ShadowCocoon
  - type: GhostTakeoverAvailable
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-shadow-name
    description: ghost-role-information-shadow-description
    rules: ghost-role-information-shadow-rules
    raffle:
      settings: default
    requirements:
    - !type:OverallPlaytimeRequirement
      time: 720000 # 200 hours
  - type: Tag
    tags:
      - CannotSuicide
  - type: Language
    selectedLanguage: DemonLanguage
    knownLanguages:
    - DemonLanguage
    - GeneralLanguage
  - type: GhostRoleNotifys
    groupPrototype: DemonShadowping

- type: entity
  id: MobGhostShadowDemon
  parent:
  - BaseMob
  name: неизвестный
  components:
  - type: MindContainer
  - type: InputMover
  - type: MobMover
  - type: Input
    context: "ghost"
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 6
  - type: Sprite
    noRot: true
    drawdepth: Ghosts
    sprite: _DeadSpace/Demons/demon_shadow.rsi
    layers:
    - state: running
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 15
  - type: MovementIgnoreGravity
  - type: Damageable
    damageContainer: Biological
  - type: Examiner
  - type: NoSlip
  - type: Actions
  - type: Eye
    drawFov: false
    visMask:
      - Normal
      - Ghost
  - type: ContentEye
    maxZoom: 1.2, 1.2
  - type: DoAfter
  - type: Alerts
  - type: NameIdentifier
    group: GenericNumber
  - type: Visibility
    layer: 2
  - type: NightVision
    isNightVision: true
    animation: true
    transitionSpeed: 100
    color: "#DC143C11"
    actionToggleNightVision: ActionToggleNightVision
  - type: Speech
    speechVerb: Ghost
  - type: Language
    selectedLanguage: DemonLanguage
    knownLanguages:
    - DemonLanguage
    - GeneralLanguage
  - type: DemonShadowGhost
  - type: GhostTakeoverAvailable
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-shadow-name
    description: ghost-role-information-shadow-description
    rules: ghost-role-information-shadow-rules
    raffle:
      settings: default
    requirements:
    - !type:OverallPlaytimeRequirement
      time: 720000 # 200 hours
  - type: Vocal
    sounds:
      Male: Demon
      Female: Demon
      Unsexed: Demon
  - type: GhostRoleNotifys
    groupPrototype: DemonShadowping

- type: entity
  name: теневая рука
  id: ShadowHand
  parent: BaseLightning
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/_DeadSpace/Demons/shadow_hand.rsi
    drawdepth: Effects
    layers:
    - state: "hand"
      shader: unshaded
  - type: Beam
    sound: /Audio/_DeadSpace/Demons/shadow_hand.ogg
  - type: TimedDespawn
    lifetime: 1

- type: entity
  id: WeaponDemonShadowHand
  name: теневая рука
  description: Теневая длань демона, способная выстрелить крюком или ударить вблизи.
  parent: BaseItem
  categories: [ HideSpawnMenu ]
  components:
  - type: DemonShadowHand
  - type: Unremoveable
    deleteOnDrop: false
  - type: Sprite
    sprite: /Textures/_DeadSpace/Demons/shadow_hand_weapon.rsi
    layers:
    - state: hand
      shader: unshaded
  - type: Item
    size: Normal
  - type: MeleeWeapon
    attackRate: 1
    animation: WeaponArcClaw
    useWeaponSpriteForAnimation: false
    soundHit:
      path: /Audio/Effects/demon_attack1.ogg
    damage:
      types:
        Slash: 4
        Blunt: 6
        Piercing: 2
        Heat: 8
        Structural: 40
  - type: Gun
    fireRate: 0.5
    soundGunshot:
      path: /Audio/_DeadSpace/Demons/shadow_hand.ogg
  - type: BasicEntityAmmoProvider
    proto: DemonShadowHandProjectile
    capacity: 1
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 25
    rechargeSound:
      path: /Audio/_DeadSpace/Demons/shadow.ogg
      params:
        volume: -10
  - type: AltFireMelee
    attackType: Heavy
  - type: NinjaJohyo
    pullAcceleration: 400
    maxPullSpeed: 15
    arrivalDistance: 1.5
    maxDistance: 10

- type: entity
  id: DemonShadowHandProjectile
  name: теневой крюк
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: EmbeddableProjectile
    deleteOnRemove: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    noRot: false
    sprite: /Textures/_DeadSpace/Demons/shadow_hand.rsi
    rotation: 180
    layers:
    - state: hand
      shader: unshaded
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0
    angularDamping: 0
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Slash: 5
    soundHit:
      path: /Audio/_DeadSpace/Demons/shadow_hand.ogg
  - type: NinjaJohyoProjectile
  - type: StunOnCollide
    stunAmount: 3
    knockdownAmount: 3
    refresh: false
    drop: true

- type: entity
  id: ShadowCocoon
  name: теневой кокон
  description: В нём что-то есть.
  categories: [ HideSpawnMenu ]
  components:
  - type: Clickable
  - type: RequireProjectileTarget
    active: False
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.5
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _DeadSpace/Demons/shadow_cocoon.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: cocoon
  - type: DamageStateVisuals
    states:
      Alive:
        Base: cocoon
      Dead:
        Base: dead
  - type: Butcherable
    spawned:
    - id: ShardCrystalPink
      amount: 1
  - type: ShadowCocoon
  - type: Cocoon
  - type: Tag
    tags:
      - CannotSuicide
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: Stamina
  - type: Appearance
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Demon
  - type: ZombieImmune
  - type: ImmunitetInfectionDead
  - type: PassiveDamage
    intervalHaltOnDamageTaken: 5s
    allowedStates:
    - Alive
    damageCap: 0
    damage:
      types:
        Poison: -2
        Holy: -1
      groups:
        Brute: -2
        Burn: -2
