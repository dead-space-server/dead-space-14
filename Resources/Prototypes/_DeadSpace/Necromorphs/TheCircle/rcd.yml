- type: entity
  parent: BaseSubdermalImplant
  id: ArchitectIntegratedArmImplant
  name: имплант встроенной руки Зодчего
  description: Позволяет владельцу вызвать или убрать встроенную строительную руку.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionRetractableArchitectIntegratedArm
    whitelist:
      components:
      - Hands

- type: entity
  parent: BaseAction
  id: ActionRetractableArchitectIntegratedArm
  name: "[color=red]Освободить руку Зодчего[/color]"
  description: Вызвать или убрать встроенную строительную руку.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    raiseOnAction: true
    itemIconStyle: BigAction
    icon:
      sprite: _DeadSpace/Necromorfs/TheCircle/Weapon/tools/architect-arm.rsi
      state: icon
  - type: InstantAction
    event: !type:OnRetractableItemActionEvent
  - type: RetractableItemAction
    spawnedPrototype: ArchitectIntegratedArm
    summonSounds:
      collection: splinter-blade-extend
    retractSounds:
      collection: splinter-blade-retract
- type: entity
  parent: RCDRecharging
  id: ArchitectIntegratedArm
  name: встроенная рука Зодчего
  description: Встроенный боевой и строительный инструмент Зодчего.
  components:
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/TheCircle/Weapon/tools/architect-arm.rsi
    state: icon
  - type: Item
    sprite: _DeadSpace/Necromorfs/TheCircle/Weapon/tools/architect-arm.rsi
  - type: ArchitectArm
    dashObjectsPerSlowdown: 5
    dashSpeedReduction: 5
    dashMinimumSpeed: 1
    dashObstacleRestartDelay: 1.5
    dashUnbreakablePrototypes:
    - WallPlastitaniumIndestructible
    - WallPlastitanium
    - WallPlastitaniumDiagonalIndestructible
    - WallPlastitaniumDiagonal
    - WallTitanaluminum
    - WallTitanaluminumDiagonal
    - PlastitaniumWindowIndestructible
    - PlastitaniumWindow
    - PlastitaniumWindowDiagonalIndestructible
    - PlastitaniumWindowDiagonal
    - PlastitaniumPlasmaWindowIndestructible
    - PlastitaniumPlasmaWindow
    - PlastitaniumPlasmaWindowDiagonalIndestructible
    - PlastitaniumPlasmaWindowDiagonal
  - type: ComponentModeSwitcher
    currentMode: 0
    modes:
    - name: component-mode-switcher-architect-construction
      components:
      - type: RCD
        availablePrototypes:
        - WallSolid
        - FloorSteel
        - Plating
        - Catwalk
        - Grille
        - Window
        - WindowDirectional
        - WindowReinforcedDirectional
        - ReinforcedWindow
        - Airlock
        - AirlockGlass
        - Firelock
        - TubeLight
        - BulbLight
        - LVCable
        - MVCable
        - HVCable
        - CableTerminal
        - Deconstruct
        - CircleTriggerKudzu
        - CircleTriggerMeleeTentacle
        - CircleTriggerRangedTentacle
    - name: component-mode-switcher-architect-combat
      components:
      - type: MeleeWeapon
        wideAnimationRotation: 55
        damage:
          types:
            Heat: 10
            Slash: 7
            Structural: 50
        soundHit:
          collection: splinter-blade-attack
        soundNoDamage:
          collection: splinter-blade-miss

- type: rcd
  id: CircleTriggerKudzu
  name: Триггер кудзу
  category: NecromorphTriggers
  sprite: { sprite: /Textures/Tiles/Misc/floortrap.rsi, state: floortrapspawn }
  mode: ConstructObject
  prototype: CircleRcdTriggerKudzu
  cost: 2
  delay: 1
  rotation: Fixed

- type: rcd
  id: CircleTriggerMeleeTentacle
  name: Триггер атакующей тентакли
  category: NecromorphTriggers
  sprite: { sprite: /Textures/_DeadSpace/Necromorfs/tentacle.rsi, state: tentacle }
  mode: ConstructObject
  prototype: CircleRcdTriggerMeleeTentacle
  cost: 3
  delay: 1
  rotation: Fixed

- type: rcd
  id: CircleTriggerRangedTentacle
  name: Триггер стрелковой тентакли
  category: NecromorphTriggers
  sprite: { sprite: /Textures/_DeadSpace/Necromorfs/bone_tentacle.rsi, state: bonetentacle }
  mode: ConstructObject
  prototype: CircleRcdTriggerRangedTentacle
  cost: 3
  delay: 1
  rotation: Fixed

- type: alert
  id: ArchitectArmDashCooldown
  icons:
  - sprite: /Textures/_DeadSpace/Necromorfs/TheCircle/Weapon/tools/architect-arm.rsi
    state: icon
  name: alerts-architect-dash-name
  description: alerts-architect-dash-description
