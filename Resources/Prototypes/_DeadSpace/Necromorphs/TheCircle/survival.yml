- type: roleLoadout
  id: RoleSurvivalTheCircle
  groups:
  - SurvivalExtended
  - GroupSpeciesBreathTool
  - GroupTankHarness
  - TheCircleEmergencyTank

# Starting gear is equipped before role loadouts. Keep the Geist's pocket2 implanter
# and put its species-appropriate tank into the backpack instead.
- type: roleLoadout
  id: RoleSurvivalTheCircleGeist
  groups:
  - SurvivalExtended
  - GroupSpeciesBreathTool
  - GroupTankHarness
  - TheCircleEmergencyTankGeist

- type: roleLoadout
  id: RoleTheCircleShockTrooper
  groups:
  - SurvivalExtended
  - GroupSpeciesBreathTool
  - GroupTankHarness
  - TheCircleEmergencyTankGeist
  - TheCircleGeistStyle

- type: loadoutGroup
  id: TheCircleGeistStyle
  name: loadout-group-the-circle-geist-style
  minLimit: 1
  maxLimit: 1
  loadouts:
  - TheCircleGeistOldStyle
  - TheCircleGeistNewStyle

- type: entity
  id: TheCircleGeistOldStylePreview
  categories: [ HideSpawnMenu ]
  name: классический стиль Гейста
  description: Классический скафандр «Морс», лицевые обмотки и порванный плащ.
  components:
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/TheCircle/Helmet/geist.rsi
    state: icon

- type: entity
  id: TheCircleGeistNewStylePreview
  categories: [ HideSpawnMenu ]
  name: золотой стиль Гейста
  description: Новый скафандр «Морс», лицевая маска и порванный плащ.
  components:
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/TheCircle/Helmet/geist-new.rsi
    state: icon

- type: loadout
  id: TheCircleGeistOldStyle
  dummyEntity: TheCircleGeistOldStylePreview
  equipment:
    outerClothing: ClothingOuterHardsuitUnitologyGeist
    head: ClothingHeadHelmetUnitologyGeist
    neck: ClothingNeckUnitologyGeistMantle

- type: loadout
  id: TheCircleGeistNewStyle
  dummyEntity: TheCircleGeistNewStylePreview
  equipment:
    outerClothing: ClothingOuterHardsuitUnitologyGeistNew
    head: ClothingHeadHelmetUnitologyGeistNew
    neck: ClothingNeckUnitologyGeistMantleNew

- type: loadoutGroup
  id: TheCircleEmergencyTank
  name: loadout-group-survival-military
  minLimit: 1
  maxLimit: 1
  hidden: true
  loadouts:
  - TheCircleEmergencyNitrogenTank
  - TheCircleEmergencyOxygenTank
  - TheCircleEmergencyOxygenTankDwarf
  - TheCircleEmergencyOxygenTankMoth

- type: loadoutGroup
  id: TheCircleEmergencyTankGeist
  name: loadout-group-survival-military
  minLimit: 1
  maxLimit: 1
  hidden: true
  loadouts:
  - TheCircleEmergencyNitrogenTankGeist
  - TheCircleEmergencyOxygenTankGeist
  - TheCircleEmergencyOxygenTankDwarfGeist
  - TheCircleEmergencyOxygenTankMothGeist

- type: loadout
  id: TheCircleEmergencyNitrogenTank
  effects:
  - !type:GroupLoadoutEffect
    proto: NitrogenBreather
  equipment:
    pocket2: DoubleEmergencyNitrogenTankFilled

- type: loadout
  id: TheCircleEmergencyOxygenTank
  effects:
  - !type:GroupLoadoutEffect
    proto: OxygenBreather
  equipment:
    pocket2: DoubleEmergencyOxygenTankFilled

- type: loadout
  id: TheCircleEmergencyOxygenTankDwarf
  effects:
  - !type:GroupLoadoutEffect
    proto: EffectSpeciesDwarf
  equipment:
    pocket2: DoubleEmergencyOxygenTankFilled

- type: loadout
  id: TheCircleEmergencyOxygenTankMoth
  effects:
  - !type:GroupLoadoutEffect
    proto: EffectSpeciesMoth
  equipment:
    pocket2: DoubleEmergencyOxygenTankFilled

- type: loadout
  id: TheCircleEmergencyNitrogenTankGeist
  effects:
  - !type:GroupLoadoutEffect
    proto: NitrogenBreather
  storage:
    back:
    - DoubleEmergencyNitrogenTankFilled

- type: loadout
  id: TheCircleEmergencyOxygenTankGeist
  effects:
  - !type:GroupLoadoutEffect
    proto: OxygenBreather
  storage:
    back:
    - DoubleEmergencyOxygenTankFilled

- type: loadout
  id: TheCircleEmergencyOxygenTankDwarfGeist
  effects:
  - !type:GroupLoadoutEffect
    proto: EffectSpeciesDwarf
  storage:
    back:
    - DoubleEmergencyOxygenTankFilled

- type: loadout
  id: TheCircleEmergencyOxygenTankMothGeist
  effects:
  - !type:GroupLoadoutEffect
    proto: EffectSpeciesMoth
  storage:
    back:
    - DoubleEmergencyOxygenTankFilled
