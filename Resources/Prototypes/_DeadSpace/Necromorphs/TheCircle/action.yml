- type: entity
  id: ActionObeliskActivate
  name: Начать активацию обелиска
  description: Провести ритуал активации обелиска.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 3
    icon: /Textures/_DeadSpace/Interface/Actions/obelisk.png
  - type: TargetAction
    checkCanAccess: false
    range: 2
  - type: EntityTargetAction
    event: !type:ObeliskActivateActionEvent

- type: entity
  id: ActionSummonUnitologyObelisk
  name: Призвать обелиск
  description: Использовать осколок в активной руке, чтобы призвать обелиск после выполнения целей.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 3
    icon: /Textures/_DeadSpace/Interface/Actions/obelisk.png
  - type: InstantAction
    event: !type:ObeliskActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionTheCircleGeistInvisibility
  name: Войти в невидимость
  description: Вы способны ненадолго стать невидимым для других, с возможостью самому выбрать тип невидимости для вашей ситуации.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: _DeadSpace/Demons/ability_icons/shadowling_ghost_action.png
    itemIconStyle: BigAction
  - type: InstantAction
    event: !type:OpenGeistInvisibilityMenuEvent

- type: entity
  parent: BaseAction
  id: ActionDreadnoughtLastStand
  name: Последний рубеж Дредноута
  description: В течении 5 минут вы теряете критическое и пред-критическое состояния, но взамен получаете порог в жизни до 165, а не 100, а также +30% к скорости, но когда проходит 5 минут после активации, вы умираете от передоза фентанила в организме.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: Interface/Actions/actions_crit.rsi
      state: lastwords
    itemIconStyle: BigAction
  - type: InstantAction
    event: !type:DreadnoughtLastStandActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionLegionRage
  name: бешенство Легионера
  description: Ускоряет Легионера на 35%. Удары продлевают бешенство, но третий удар по одной цели завершит его.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: _DeadSpace/Necromorfs/TheCircle/Weapon/melee/legion-knife.rsi
      state: icon
    itemIconStyle: BigAction
  - type: InstantAction
    event: !type:LegionRageActionEvent

- type: alert
  id: LegionRage
  icons:
  - sprite: /Textures/_DeadSpace/Necromorfs/TheCircle/Weapon/melee/legion-knife.rsi
    state: icon
  name: Бешенство Легионера
  description: Показывает оставшееся время бешенства или его отката.

- type: entity
  parent: BaseAction
  id: ActionSeraphimMend
  name: Сшивание плоти
  description: За пять секунд срастить союзнику переломы и разрывы и обновить повреждённые органы. После процедуры нужна минута, чтобы собраться с силами.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: _DeadSpace/Necromorfs/TheCircle/Gear/tools/hypo_2.rsi
      state: hypo
    itemIconStyle: BigAction
  - type: TargetAction
    range: 1.5
  - type: EntityTargetAction
    event: !type:SeraphimMendActionEvent

- type: entity
  parent: BaseAction
  id: ActionSeraphimBond
  name: Некроволокна
  description: Связать себя с союзником некроволокнами. Лечение одного достаётся и другому, передозы союзника делятся с вами пополам, а переломы и кровотечения у обоих медленно заживают. Повторное использование рвёт связь.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 3
    icon:
      sprite: _DeadSpace/Necromorfs/TheCircle/Weapon/melee/hand-hook.rsi
      state: rope
    itemIconStyle: BigAction
  - type: TargetAction
    range: 3
  - type: EntityTargetAction
    event: !type:SeraphimBondActionEvent
