- type: entity
  id: Tripwire
  name: растяжка
  description: Тонкий провод, способный мгновенно активировать подключённые мультитулом устройства.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Appearance
  - type: Sprite
    sprite: Structures/Power/Cables/lv_cable.rsi
    state: lvcable_0
    color: "#80808080"
    drawdepth: ThinWire
  - type: CableVis
    node: cordage
  - type: NodeContainer
    nodes:
      cordage:
        !type:CableNode
        nodeGroupID: ExCable
  - type: CableVisualizer
    statePrefix: lvcable_
  - type: Tripwire
    port: Pressed
    immediateTriggerKey: timer
    disarmTime: 10
    attachTime: 1
    attachedExplosiveFadeTime: 10
    detachExplosiveTime: 30
  - type: TrapIgnore
    factions:
    - Necromorfs
  - type: DeviceLinkSource
    range: 3
    ports:
    - Pressed
  - type: StepTrigger
    intersectRatio: 0.1
    requiredTriggeredSpeed: 0
    stepOn: false
  - type: Physics
    bodyType: Static
    canCollide: true
    fixedRotation: true
  - type: Fixtures
    fixtures:
      trigger:
        shape: !type:PhysShapeAabb
          bounds: "-0.48,-0.48,0.48,0.48"
        hard: false
        layer:
        - LowImpassable

- type: entity
  parent: CableStack
  id: TripwireStack
  name: жгут нитей для растяжки
  suffix: Полный
  description: Моток тонкой растяжки.
  components:
  - type: Stack
    stackType: Tripwire
    baseLayer: base
    layerStates:
    - coilex-10
    - coilex-20
    - coilex-30
  - type: Sprite
    state: coilex-30
    layers:
    - state: coilex-30
      map: ["base"]
  - type: Item
    heldPrefix: coilex
  - type: CablePlacer
    cablePrototypeID: Tripwire
    blockingWireType: ExCable
    blacklist:
      components:
      - Tripwire
    overTile: true
  - type: Appearance

- type: entity
  parent: TripwireStack
  id: TripwireStack1
  suffix: 1
  components:
  - type: Stack
    count: 1

- type: entity
  parent: GrenadeBase
  id: TripwireExplosiveGrenade
  name: разрывной заряд для растяжки
  description: Разрывной заряд без ручного взрывателя. Срабатывает только после подключения к растяжке.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/grenade.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: TimerTrigger
    examinable: false
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: Default
    maxIntensity: 10
    intensitySlope: 3
    totalIntensity: 120
    canCreateVacuum: false

# Triggers constructed by the Circle engineer RCD.
- type: entity
  id: BaseCircleRcdTrigger
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Tiles/Misc/floortrap.rsi
    state: floortrapspawn
  - type: Physics
  - type: Fixtures
    fixtures:
      trigger:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        hard: false
        mask:
        - ItemMask
        layer:
        - SlipLayer
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: BaseCircleRcdTrigger
  id: CircleRcdTriggerKudzu
  name: некротриггер кудзу
  components:
  - type: CircleRcdTrigger
    flashTarget: true
    spawnPrototype: NecroKudzu

- type: entity
  parent: BaseCircleRcdTrigger
  id: CircleRcdTriggerMeleeTentacle
  name: некротриггер тентакли
  components:
  - type: CircleRcdTrigger
    flashTarget: true
    spawnPrototype: WeaponTentacleNecro

- type: entity
  parent: BaseCircleRcdTrigger
  id: CircleRcdTriggerRangedTentacle
  name: некротриггер стрелковой тентакли
  components:
  - type: CircleRcdTrigger
    spawnPrototype: WeaponBoneTentacleNecro

- type: stack
  parent: BaseMediumStack
  id: Tripwire
  name: stack-tripwire
  icon: { sprite: "/Textures/Objects/Tools/cable-coils.rsi", state: coilex-30 }
  spawn: TripwireStack1

- type: entity
  parent: BaseItem
  id: BearTrap
  name: капкан
  description: Тяжёлый капкан, который... Стоп, а почему он полупрозрачный?
  components:
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/TheCircle/Weapon/traps/bear_trap.rsi
    state: idle
    drawdepth: Items
    layers:
    - state: idle
      map: [ "base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BearTrapVisuals.Armed:
        base:
          True: { state: armed }
          False: { state: idle }
  - type: BearTrap
    armingTime: 1
    stunTime: 10
    minimumOpacity: 0.35
    disarmTime: 15
    damage:
      types:
        Slash: 50
  - type: TrapIgnore
    factions:
    - Necromorfs
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      trigger:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.35,0.4,0.35"
        hard: false
        layer:
        - LowImpassable
        mask:
        - MobMask
      item:
        shape: !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 30
        mask:
        - ItemMask

- type: entity
  parent: GrenadeBase
  id: TripwireNecroGasGrenade
  name: газовый заряд для растяжки (некрогаз)
  description: Заряженный баллон с некрогазом без ручного взрывателя. Срабатывает только после подключения к растяжке и заполняет газом около десяти тайлов.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/tear_gas.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: TimerTrigger
    examinable: false
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound: /Audio/Items/smoke_grenade_smoke.ogg
    positional: true
  - type: ReleaseGasOnTrigger
    keysIn:
    - timer
    removeFraction: 0.25
    air:
      volume: 1000
      moles:
        InfectionDeadSpace: 1039.28
      temperature: 293.15

- type: entity
  parent: TripwireNecroGasGrenade
  id: TripwireFrezonGasGrenade
  name: газовый заряд для растяжки (фрезон)
  description: Заряженный баллон с фрезоном без ручного взрывателя. Срабатывает только после подключения к растяжке и заполняет газом около шести тайлов.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/smoke.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: ReleaseGasOnTrigger
    keysIn:
    - timer
    removeFraction: 0.25
    air:
      volume: 1000
      moles:
        Frezon: 623.57
      temperature: 293.15

- type: entity
  parent: BaseItem
  id: GeistThreadSpool
  name: катушка тонкой нити
  description: Почти невидимая нить на маленькой катушке. Привязанную к вещи нить можно тянуть издалека.
  components:
  - type: Sprite
    sprite: _DeadSpace/Necromorfs/TheCircle/Weapon/traps/geist_thread.rsi
    state: icon
  - type: Item
    size: Tiny
    sprite: _DeadSpace/Necromorfs/TheCircle/Weapon/traps/geist_thread.rsi
  - type: GeistThreadSpool
