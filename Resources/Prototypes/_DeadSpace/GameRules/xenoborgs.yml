- type: entity
  parent: BaseXenoborgsRule
  id: XenoborgOutbreak
  components:
  - type: StationEvent
    earliestStart: 60
    minimumPlayers: 30
    weight: 1
    duration: null # XenoborgsRule must stay active for shuttle/round-end checks
    reoccurrenceDelay: 60
    maxOccurrences: 1
    occursDuringRoundEnd: false
  - type: GameRule
    minPlayers: 30
    cancelPresetOnTooFewPlayers: false
  - type: AntagMultipleRoleSpawner
    antagRoleToPrototypes:
      MothershipCore: [ MothershipCore ]
      Xenoborg: [ XenoborgEngi, XenoborgHeavy, XenoborgScout, XenoborgStealth, XenoborgMiner ] # DS14
    pickAndTake: true
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    definitions:
    - prefRoles: [ MothershipCore ]
      fallbackRoles: [ Xenoborg ]
      spawnerPrototype: SpawnPointGhostRoleMothershipCore
      mindRoles:
      - MindRoleMothershipCore
      sponsorsPriority: true
    - prefRoles: [ Xenoborg ]
      fallbackRoles: [ MothershipCore ]
      spawnerPrototype: SpawnPointGhostRoleXenoborg
      mindRoles:
      - MindRoleXenoborg
      sponsorsPriority: true
      min: 5
      max: 5
  - type: DynamicRuleCost
    cost: 200
