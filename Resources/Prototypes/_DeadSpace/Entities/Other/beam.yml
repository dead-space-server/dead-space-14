- type: entity
  name: след блинка
  id: NinjaBeam
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/_DeadSpace/Objects/Misc/ninja_beam.rsi
    drawdepth: Effects
    layers:
    - state: beam
      shader: unshaded
  - type: Beam
    sound: null
  - type: TimedDespawn
    lifetime: 1
  - type: Tag
    tags:
      - HideContextMenu
  - type: Physics
    canCollide: false
  - type: PointLight
    enabled: true
    color: "#77FF49"
    radius: 3.5
    softness: 1
    autoRot: true
    castShadows: false