#DS14 - длинные комфортные скамейки (левая/средняя/правая секции)

- type: entity
  name: длинная скамейка
  id: BenchComfyMiddle
  parent: BenchComfy
  suffix: Середина
  description: Длинная скамейка с невероятно удобной спинкой.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _DeadSpace/Structures/Furniture/Bench/comf_bench.rsi
    layers:
    - state: bench_middle_base
      color: "#767e82"
    - state: bench_middle_cover
  - type: Construction
    graph: LongBench
    node: longComfBenchMiddle

