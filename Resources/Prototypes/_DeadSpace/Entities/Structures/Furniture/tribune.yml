- type: entity
  id: NTTribune
  parent: BaseStructure
  name: трибуна
  description: Деревянная трибуна с логотипом NanoTrasen. Отсюда удобно толкать пламенные речи.
  components:
  - type: Sprite
    sprite: _DeadSpace/Structures/Furniture/tribune.rsi
    state: nt_tribune
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.4,0.2,0.2"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
    - Wooden
  - type: Anchorable
  - type: Rotatable
  - type: Construction
    graph: NTTribune
    node: tribune
