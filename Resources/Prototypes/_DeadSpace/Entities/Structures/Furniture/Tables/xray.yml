- type: entity
  id: XrayTable
  parent: BaseStructure
  name: x-ray table
  description: A fixed X-ray. Strap the patient in and open the exam. The machine itself does not irradiate.
  components:
  - type: Appearance
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Sprite
    sprite: _DeadSpace/Structures/Furniture/Tables/xraytable.rsi
    layers:
    - state: table
      map: [ "enum.AutopsyTableLayers.Base" ]
    - state: device
      map: [ "enum.AutopsyTableLayers.WithDevice" ]
      shader: unshaded
      visible: false
    - state: device1
      map: [ "enum.AutopsyTableLayers.WithDevice1" ]
      shader: unshaded
      visible: false
    - state: device2
      map: [ "enum.AutopsyTableLayers.WithDevice2" ]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: _DeadSpace/Structures/Furniture/Tables/xraytable.rsi
    state: table
  - type: Strap
    position: Down
    rotation: -90
  - type: Construction
    graph: XrayTable
    node: xray
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
  - type: Transform
    anchored: true
    noRot: true
  - type: Anchorable
  - type: Pullable
  - type: SurgerySurface
    place: Table
  - type: SurgeryTankMount
  - type: ContainerContainer
    containers:
      surgery_tank: !type:ContainerSlot
  - type: ItemSlots
    slots:
      surgery_tank:
        name: surgery-tank-slot
        whitelist:
          components:
          - GasTank
  - type: SurgeryXrayTable
  - type: ActivatableUI
    key: enum.SurgeryXrayTableUiKey.Key
    verbOnly: true
    verbText: surgery-xray-open
    verbPriority: 1000
    verbIcon: /Textures/Interface/VerbIcons/examine.svg.192dpi.png
  - type: UserInterface
    interfaces:
      enum.SurgeryXrayTableUiKey.Key:
        type: SurgeryXrayTableBoundUserInterface
