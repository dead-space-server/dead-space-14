- type: entity
  parent: Bed
  id: Futon
  name: Футон
  description: Традиционный японский матрас.
  components:
  - type: Sprite
    sprite: _DeadSpace/Structures/Furniture/bed.rsi
    state: bed-1
  - type: Damageable
    damageModifierSet: Inflatable

- type: entity
  parent: Bed
  id: BedWood
  name: деревянная кровать
  description: Неудобная кровать из дерева, не показывайте её ортопеду.
  components:
  - type: Sprite
    sprite: _DeadSpace/Structures/Furniture/bed.rsi
    state: bed_wood
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 3
            max: 5
  - type: Construction
    graph: BedWood
    node: bedWood

- type: entity
  parent: Bed
  id: BunkBed
  name: двухъярусная койка
  description: РОТА, ПОДЪЁМ!
  components:
  - type: Sprite
    sprite: _DeadSpace/Structures/Furniture/bed.rsi
    state: bunk_bed_bottom
  - type: BunkBed
    overlay: BunkBedTop
  - type: Construction
    graph: bed
    node: bunkbed
  - type: Strap
    position: Down
    rotation: -90
    maxCapacity: 2
    multiBuckleOffsets:
      0: "0,0.18"
      1: "0,-0.18"
    modifyBuckleDrawDepth: false
    multiBuckleDrawDepths:
      0: 7
      1: 5

- type: entity
  id: BunkBedTop
  name: верхняя часть двухъярусной койки
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
  - type: BunkBedOverlay
  - type: Sprite
    sprite: _DeadSpace/Structures/Furniture/bed.rsi
    state: bunk_bed_top
    noRot: true
    drawdepth: Mobs
