- type: entity
  id: HolosignRND
  parent: BaseHoloSign
  name: РНД голобарьер
  description: Барьер из твёрдого света, не пропускает через себя аномальных сущностей, но довольно хрупкий.
  components:
    - type: Sprite
      sprite: _DeadSpace/Structures/Holo/rnd.rsi
      state: icon
    - type: Physics
      bodyType: Static
      canCollide: true
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
          hard: true
          mask:
            - TableLayer
          layer:
            - TableLayer
    - type: EntityFilterBarrier
      blockedPrototypes:
        - MobFleshLover
        - MobFleshGolem
        - MobFleshJared
        - MobFleshClamp
        - MobLuminousEntity
        - MobLuminousObject
        - MobLuminousPerson
        - MobCoalCrab
        - MobGoldCrab
        - MobQuartzCrab
        - MobSilverCrab
        - MobTinCrab
        - MobUraniumCrab
        - MobBananiumCrab
        - ReagentSlime
        - ReagentSlimeBeer
        - ReagentSlimePax
        - ReagentSlimeNocturine
        - ReagentSlimeTHC
        - ReagentSlimeBicaridine
        - ReagentSlimeToxin
        - ReagentSlimeNapalm
        - ReagentSlimeOmnizine
        - ReagentSlimeMuteToxin
        - ReagentSlimeNorepinephricAcid
        - ReagentSlimeEphedrine
        - ReagentSlimeRobustHarvest
    - type: TimedDespawn
      lifetime: 300
    - type: PointLight
      enabled: true
      radius: 3
      color: violet
    - type: Clickable

- type: entity
  id: HolosignBulletShield
  parent: BaseHoloSign
  name: holographic matrix
  description: A barrier of hard light that absorbs bullets, but lets anything else pass through.
  components:
    - type: Physics
      bodyType: Static
      canCollide: true
    - type: Sprite
      sprite: _DeadSpace/Structures/Holo/bullet_shield.rsi
      state: icon
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
          hard: true
          layer:
            - BulletImpassable
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 40
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]

    - type: Damageable
      damageContainer: Inorganic
      damageModifierSet: HolosignBulletShieldResist #60% resist Piercing & Burn
    - type: PointLight
      enabled: true
      radius: 3
      color: orange
      energy: 4
