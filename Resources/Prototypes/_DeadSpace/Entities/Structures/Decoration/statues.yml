  name: статуя дракона
  description: Массивная каменная статуя восточного дракона. На золотой табличке имеется надпись "Лишь истинный воин сможет противостоять самому себе".
  components:
  - type: Sprite
    scale: 1.5, 1.5
    sprite: _DeadSpace/Structures/Decoration/dragon_statue.rsi
    state: normal
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.88,-1.35,0.88,0.55"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

