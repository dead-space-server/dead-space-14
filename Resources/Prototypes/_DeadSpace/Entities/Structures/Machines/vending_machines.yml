    dataset: CaptainDrobeAds
  - type: Store
    categories:
    - CaptainDrobeBerets
    - CaptainDrobeHats
    - CaptainDrobeCloaks
    - CaptainDrobeMantles
    - CaptainDrobeOuter
    - CaptainDrobeJumpsuits
    - CaptainDrobeJumpskirts
    - CaptainDrobeTurtlenecks
