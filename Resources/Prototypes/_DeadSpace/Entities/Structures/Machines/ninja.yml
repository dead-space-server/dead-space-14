- type: entity
  name: зелёный кристалл
  parent: [BaseItem, BaseMajorContraband]
  id: NinjaRefreshToken
  description: Кажется, он пульсирует подозрительно заманчивой энергией.
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Specific/Ninja/refreshCrystal.rsi
    state: icon
  - type: Item
    sprite: _DeadSpace/Objects/Specific/Ninja/refreshCrystal.rsi
    size: Tiny
  - type: Stack
    count: 1
    stackType: NinjaRefreshToken
  - type: StaticPrice
    price: 0
  - type: StackPrice
    price: 500
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_DeadSpace/Items/Handing/pill_bottle_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_DeadSpace/Items/Handing/pill_bottle_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_DeadSpace/Items/Handing/pill_bottle_drop.ogg

- type: stack
  id: NinjaRefreshToken
  name: stack-ninja-refresh-token
  icon: { sprite: /Textures/_DeadSpace/Objects/Specific/Ninja/refreshCrystal.rsi, state: icon }
  spawn: NinjaRefreshToken

