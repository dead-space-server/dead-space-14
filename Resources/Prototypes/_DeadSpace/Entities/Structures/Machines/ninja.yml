- type: sourcePort
  id: NinjaScannerPort
  name: Сканер разума
  description: Порт для передачи данных и команд между консолью и сканером.

- type: sinkPort
  id: NinjaScannerPort
  name: Сканер разума
  description: Порт для передачи данных и команд между консолью и сканером.

- type: entity
  parent: BaseStructure
  id: NinjaInfoScanner
  name: сканер разума
  description: Высокотехнологичная капсула для извлечения данных из живых субъектов.
  components:
  - type: NinjaInfoScanner
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: DeviceLinkSource
    ports:
    - NinjaScannerPort
  - type: Sprite
    sprite: _DeadSpace/Structures/Machines/ninja_scan.rsi
    layers:
    - map: ["base"]
      state: icon_open
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.NinjaInfoScannerVisuals.VisualState:
        base:
          Open: { state: icon_open }
          Closed: { state: icon_closed }
          Scan: { state: icon_scan }
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 150
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ContainerContainer
    containers:
      entity_storage: !type:ContainerSlot
  - type: Climbable

- type: entity
  parent: BaseStructure
  id: NinjaInfoConsole
  name: консоль сканера разума
  description: Терминал управления капсулой сканирования разума.
  components:
  - type: NinjaInfoConsole
  - type: DeviceLinkSink
    ports:
    - NinjaScannerPort
  - type: ActivatableUI
    key: enum.NinjaInfoScannerUiKey.Key
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["Ninja"]]
  - type: UserInterface
    interfaces:
      enum.NinjaInfoScannerUiKey.Key:
        type: NinjaInfoScannerBoundUserInterface
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - state: computer
    - state: request-sec
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 150
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
  parent: BaseMajorContraband
  id: NinjaHackBeacon
  name: старая запчасть механизма
  description: Выглядит как старая и совершенно ненужная деталь некогда работавшего механизма. Откуда она — сказать сложно. Видимо, обычный космический мусор.
  components:
  - type: NinjaHackBeacon
  - type: Item
    size: Normal
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.4,0.25,0.1"
        density: 20
        mask:
          - Impassable
  - type: Foldable
    folded: true
  - type: Clickable
  - type: InteractionOutline
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FoldedVisuals.State:
        foldedLayer:
          True: { state: folded_extraction }
          False: { state: extraction_point }
  - type: Sprite
    sprite: Objects/Tools/thief_beacon.rsi
    drawdepth: SmallObjects
    noRot: true
    layers:
      - state: extraction_point
        map: [ "foldedLayer" ]
  - type: AccessReader
    access: [["Ninja"]]
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: ActivatableUIRequiresAccess
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: Store
    name: store-ui-ninja-hack-title
    categories:
    - NinjaHackCategory
    currencyWhitelist:
    - NinjaHackCurrency
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: AmbientSound
    volume: 10
    range: 25
    enabled: false
    sound:
      path: /Audio/Ambience/Objects/server_fans.ogg

