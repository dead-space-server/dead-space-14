- type: entity
  id: MachinePdaPainter
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: PDA painter
  description: A machine that paints PDAs, either by hand or using a template.
  components:
  - type: Sprite
    sprite: Structures/Machines/flatpacker.rsi
    snapCardinals: true
    layers:
    - state: base
    - state: unlit
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: PdaPainter
  - type: ItemSlots
    slots:
      pda_slot:
        name: pda-painter-slot-name
        whitelist:
          components:
          - Pda
  - type: ContainerContainer
    containers:
      pda_slot: !type:ContainerSlot
  - type: WiresPanel
  - type: WiresVisuals
  - type: Appearance
  - type: Machine
    board: PdaPainterMachineCircuitboard
  - type: ActivatableUI
    key: enum.PdaPainterUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.PdaPainterUiKey.Key:
        type: PdaPainterBoundUserInterface

- type: entity
  parent: BaseMachineCircuitboard
  id: PdaPainterMachineCircuitboard
  name: PDA painter machine board
  components:
  - type: MachineBoard
    prototype: MachinePdaPainter
    stackRequirements:
      Manipulator: 2
      Steel: 2
      Glass: 1
