- type: entity
  id: AirlockSerpentAssembly
  parent: AirlockAssembly
  name: каркас шлюза
  description: Он открывается, он закрывается, и он может вас раздавить.
  suffix: Серпент
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _DeadSpace/Structures/Doors/Airlocks/Standard/taipan_basic.rsi
    state: assembly
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: AirlockTaipan
    node: assembly

- type: entity
  parent: AirlockSerpentAssembly
  id: AirlockSerpentGlassAssembly
  name: каркас шлюза
  description: Он открывается, он закрывается, и он может вас раздавить.
  suffix: Серпент, Стеклянный
  components:
  - type: Sprite
    sprite: _DeadSpace/Structures/Doors/Airlocks/Glass/taipan_glass.rsi
    state: assembly

- type: entity
  parent: Airlock
  id: AirlockSerpent
  name: шлюз
  description: Он открывается, он закрывается, и он может вас раздавить.
  suffix: Серпент
  components:
  - type: Sprite
    sprite: _DeadSpace/Structures/Doors/Airlocks/Standard/taipan_basic.rsi
    snapCardinals: true
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: closed_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseUnlit"]
      visible: false
    - state: welded
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: bolted_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseBolted"]
    - state: emergency_unlit
      map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
      shader: unshaded
    - state: panel_open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]
  - type: Paintable
    group: SerpentAirlockStandard
  - type: Construction
    graph: AirlockTaipan
    node: airlock
    containers:
    - board
  - type: StaticPrice
    price: 235

