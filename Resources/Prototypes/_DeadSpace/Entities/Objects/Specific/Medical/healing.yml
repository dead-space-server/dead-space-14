- type: entity
  name: нанопаста
  description: Медицинский препарат, используемый для лечения повреждений у синтетических и кибернетических организмов. Она содержит наноботов, которые восстанавливают поврежденные ткани и улучшают функциональность систем организма.
  parent: BaseHealingItem
  id: Nanopaste
  suffix: Полный
  components:
  - type: Tag
    tags:
    - Nanopaste
  - type: Sprite
    sprite: _DeadSpace/Objects/Specific/Medical/medical.rsi
    state: nanopaste
  - type: Item
    heldPrefix: nanopaste
  - type: Healing
    healEyeDamage: true
    damageContainers:
    - Silicon
    damage:
      types:
        Heat: -10
        Shock: -10
        Blunt: -10
        Slash: -10
        Piercing: -10
    healingBeginSound:
      path: "/Audio/Items/Medical/ointment_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"
  - type: Stack
    stackType: Nanopaste
    count: 10
  - type: StackPrice
    price: 0

