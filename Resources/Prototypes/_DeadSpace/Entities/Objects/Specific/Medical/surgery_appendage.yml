- type: entity
  parent: BaseItem
  id: SurgeryAppendageTailBase
  abstract: true
  name: tail
  description: A severed tail. With a marker in the other hand it can be sewn onto any patient's groin.
  components:
  - type: Sprite
    sprite: _DeadSpace/Mobs/Surgery/human_male.rsi
    state: none
  - type: Item
    size: Small
  - type: SurgeryAppendage
    appendage: Tail

- type: entity
  parent: SurgeryAppendageTailBase
  id: SurgeryAppendageTail
  categories: [ HideSpawnMenu ]

