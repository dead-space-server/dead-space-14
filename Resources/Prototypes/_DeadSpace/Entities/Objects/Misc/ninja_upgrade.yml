- type: entity
  id: NinjaUpgradeDamage
  parent: BaseItem
  name: модификация для катаны
  description: Модификация для катаны, которая позволяет ей наносить больше урона и добавляет возможность наносить яды на лезвие.
  components:
  - type: Sprite
    sprite: _DeadSpace/Other/katana_mods.rsi
    layers:
    - state: red
    - state: red-unshaded
      shader: unshaded
  - type: Tag
    tags:
    - EnergyKatanaDamageUpgrade
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_DeadSpace/Items/Handing/disk_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_DeadSpace/Items/Handing/disk_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_DeadSpace/Items/Handing/disk_drop.ogg

