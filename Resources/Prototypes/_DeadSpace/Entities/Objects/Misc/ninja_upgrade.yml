- type: entity
  id: NinjaUpgradeCase
  parent: BaseItem
  name: набор модификаций для катаны
  description: Набор модификаций для катаны, в котором содержатся все три модификации.
  components:
  - type: Sprite
    sprite: _DeadSpace/Other/katana_mods.rsi
    layers:
    - state: case
    - state: case-unshaded
      shader: unshaded
  - type: Item
    size: Normal
  - type: ThiefUndeterminedBackpack
    toolName: ninja-mod-case-loadout-tool-name
    toolDesc: ninja-mod-case-loadout-tool-description
    maxSelectedSets: 1
    possibleSets:
    - NinjaUpgradeDamage
    - NinjaUpgradeReflect
    - NinjaUpgradeRecharge
  - type: ActivatableUI
    key: enum.ThiefBackpackUIKey.Key
  - type: UserInterface
    interfaces:
      enum.ThiefBackpackUIKey.Key:
        type: ThiefBackpackBoundUserInterface