- type: entity
  parent: FoodBase
  id: HalloweenCandy
  components:
  - type: Candy
  - type: Sprite
    sprite: _DeadSpace/Halloween/candy_halloween.rsi
    layers:
    - state: candy1
      map: [ "candyVariant" ]
  - type: RandomSprite
    available:
    - candyVariant:
        candy1: ""
        candy2: ""
        candy3: ""
        candy4: ""
        candy5: ""
        candy6: ""
        candy7: ""
        candy8: ""
        candy9: ""
        candy10: ""
        candy11: ""
        candy12: ""
        candy13: ""
        candy14: ""
        candy15: ""
        candy16: ""
  - type: Item
    size: Tiny
    sprite: _DeadSpace/Halloween/candy_halloween.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: Sugar
          Quantity: 3
  - type: Tag
    tags:
    - FoodSnack
    - Pill

