#RIFLES

- type: entity
  parent: BaseMagazineRifle
  id: MagazineSmartWeaponSaidwinder
  name: магазин (5.56х45 мм Smart™)
  description: Магазин на 30 патронов калибра 5.56х45 мм Smart™ с интегрированной системой сопряжения с имплантом «Смартлинк». Каждый патрон несёт микрочип коррекции траектории, позволяя оружию вести огонь с самонаведением. Произведено военным концерном Vitezstvi.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeSaidwinder
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/bullet_insert.ogg
    capacity: 30
    whitelist:
      tags:
        - CartridgeSaidwinder
  - type: Sprite
    scale: 1, 1
    sprite: _DeadSpace/Objects/Weapons/Guns/Ammunition/Magazine/Smart/saidwinder.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag
    shape:
      - 0,0,1,0
  - type: Tag
    tags:
      - MagazineSmartWeaponSaidwinder

