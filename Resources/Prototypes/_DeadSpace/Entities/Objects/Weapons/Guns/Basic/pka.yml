- type: entity
  id: WeaponProtoKineticAcceleratorReapeter
  parent: [ WeaponProtoKineticAcceleratorBase, BaseCargoContraband ]
  name: протокинетический повторитель
  description: Поздний, модифицированный прототип протокинетического ускорителя с возможностью накапливать заряды для важной ситуации.
  components:
  - type: AttachmentHolder
    slotOverlays:
      bayonet_slot:
        sprite: _DeadSpace/Lavaland/Objects/Weapons/pka_attachments.rsi
        state: bayonet
        offset: 0.59375,0.375
      light_slot:
        sprite: _DeadSpace/Lavaland/Objects/Weapons/pka_attachments.rsi
        state: flight
        stateOn: flight_on
        offset: 0.46875,0.3125
  - type: Akimbo
  - type: AmmoCounter
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        empty-icon:
          True: { visible: False }
          False: { visible: True }
        #todo: add other 'empty' animations
  - type: BasicEntityAmmoProvider
    proto: BulletKinetic
    capacity: 3
    count: 3
  - type: Gun
    fireRate: 1.5
    selectedMode: SemiAuto
    angleDecay: 45
    minAngle: 44
    maxAngle: 45
    availableModes:
    - FullAuto
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Guns/Basic/reapeterpka.rsi
    layers:
    - state: icon
    - state: animation-icon
      visible: false
      map: [ "empty-icon" ]
  - type: Item
    sprite: _DeadSpace/Objects/Weapons/Guns/Basic/reapeterpka.rsi
    shape:
    - 0,0,2,1
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 2.5
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
  - type: Clothing
    sprite: _DeadSpace/Objects/Weapons/Guns/Basic/reapeterpka.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt

- type: entity
  id: WeaponProtoKineticAcceleratorShotgun
  parent: [ WeaponProtoKineticAcceleratorBase, BaseGunWieldable, BaseCargoContraband ]
  name: протокинетический дробовик
  description: Новейший модифицированный прототип протокинетического ускорителя, что работает как дробовик
  components:
  - type: AttachmentHolder
    slotOverlays:
      bayonet_slot:
        sprite: _DeadSpace/Lavaland/Objects/Weapons/pka_attachments.rsi
        state: bayonet
        offset: 0.625,0.375
      light_slot:
        sprite: _DeadSpace/Lavaland/Objects/Weapons/pka_attachments.rsi
        state: flight
        stateOn: flight_on
        offset: 0.4375,0.3125
  - type: GunSpreadModifier
    spread: 0.85
  - type: AmmoCounter
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        empty-icon:
          True: { visible: False }
          False: { visible: True }
        #todo: add other 'empty' animations
  - type: BasicEntityAmmoProvider
    proto: BulletKineticShotgunSpread
    capacity: 1
    count: 1
  - type: Gun
    fireRate: 1
    selectedMode: SemiAuto
    angleDecay: 45
    minAngle: 44
    maxAngle: 45
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Guns/Basic/shotgunpka.rsi
    layers:
    - state: icon
      scale: 1.2, 1.2
    - state: animation-icon
      visible: false
      map: [ "empty-icon" ]
  - type: Item
    sprite: _DeadSpace/Objects/Weapons/Guns/Basic/shotgunpkahand64.rsi
    shape:
    - 0,0,3,1
    heldPrefix: energy
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 2
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
  - type: Clothing
    sprite: _DeadSpace/Objects/Weapons/Guns/Basic/shotgunpka.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: GunRequiresWield

- type: entity
  id: WeaponShotgunSawnKinetik
  parent: [ BaseItem, BaseCargoContraband ]
  name: протокинетический обрез
  description: Зачем было резать и так исправное оружие?
  components:
  - type: AttachmentHolder
    slots:
    - bayonet_slot
    - light_slot
    bayonetSlot: bayonet_slot
    bayonetAnimation: WeaponArcClaw
    lightSlot: light_slot
    slotOverlays:
      bayonet_slot:
        sprite: _DeadSpace/Lavaland/Objects/Weapons/pka_attachments.rsi
        state: bayonet
        offset: 0.46875,0.375
      light_slot:
        sprite: _DeadSpace/Lavaland/Objects/Weapons/pka_attachments.rsi
        state: flight
        stateOn: flight_on
        offset: 0.46875,0.28125
    slotComponents:
      bayonet_slot:
      - type: MeleeWeapon
        wideAnimationRotation: -135
        damage:
          types:
            Blunt: 0
        soundHit:
          path: /Audio/Weapons/bladeslice.ogg
      - type: AltFireMelee
        attackType: Heavy
  - type: ItemSlots
    slots:
      bayonet_slot:
        name: attachment-slot-bayonet
        whitelist:
          components:
          - KineticBayonet
      light_slot:
        name: attachment-slot-light
        whitelist:
          components:
          - KineticFlashlight
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 6
  - type: Akimbo
  - type: AmmoCounter
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        empty-icon:
          True: { visible: False }
          False: { visible: True }
        #todo: add other 'empty' animations
  - type: BasicEntityAmmoProvider
    proto: BulletKinetic
    capacity: 1
    count: 1
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    minAngle: 45
    maxAngle: 55
    angleIncrease: 4
    angleDecay: 16
    availableModes:
    - FullAuto
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Guns/Basic/sawnpka.rsi
    layers:
    - state: icon
    - state: animation-icon
      visible: false
      map: [ "empty-icon" ]
  - type: Item
    sprite: _DeadSpace/Objects/Weapons/Guns/Basic/sawnpka.rsi
    size: Small
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.5
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
  - type: Clothing
    sprite: _DeadSpace/Objects/Weapons/Guns/Basic/sawnpka.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Construction
    graph: ShotgunSawnKinetik
    node: shotgunsawnkinetik
    deconstructionTarget: null
  - type: UpgradeableGun
    blacklist:
      components:
      - ExplosivePkaUpgrade
    whitelist:
      tags:
      - PKAUpgrade
  - type: ContainerContainer
    containers:
      upgrades: !type:Container
      bayonet_slot: !type:ContainerSlot
      light_slot: !type:ContainerSlot
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_DeadSpace/Items/Handing/gun/gun_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_DeadSpace/Items/Handing/gun/gun_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_DeadSpace/Items/Handing/gun/gun_drop.ogg

