- type: entity
  name: SWC-432-5 "Арес"
  parent: [BaseItem, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponShotgunAresSWC
  description: Автоматический дробовик. Совершенно новый аналог нашумевшей "Сайге". Обладает барабанным магазином и общей мобильностью для тактических действий. Создано по предварительному договору NanoTrasen с SWC.
  suffix: Дробовик
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Guns/Shotguns/ares.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Large
    shape:
      - 0,0,4,1
  - type: Clothing
    sprite: _DeadSpace/Objects/Weapons/Guns/Shotguns/ares.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: GunRequiresWield
  - type: Gun
    fireRate: 1.65
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/_DeadSpace/_Soyuz/Weapons/Guns/Gunshots/saiga.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineShotgun
        priority: 2
        whitelist:
          tags:
          - MagazineShotgun
        whitelistFailPopup: gun-magazine-whitelist-fail
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineAmmoProvider
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 500

- type: entity
  name: одноствольный багет
  parent: [BaseWeaponShotgun, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponShotgunBreadBaguette
  description: Содержит в себе - 550 грамм муки, 0.5 литра воды и 1 патрон. Использует патроны калибра 12х70.
  suffix: Дробовик
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Guns/Shotguns/bread.rsi
  - type: Item
    sprite: _DeadSpace/Objects/Weapons/Guns/Shotguns/bread.rsi
  - type: Clothing
    sprite: _DeadSpace/Objects/Weapons/Guns/Shotguns/bread.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: GunRequiresWield
  - type: Gun
    fireRate: 3
    soundGunshot:
      path: /Audio/_Corvax/Weapons/Guns/Gunshots/shotgun_sawed.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: GunSpreadModifier
    spread: 0.6
  - type: BallisticAmmoProvider
    capacity: 1
    proto: null
  - type: Edible
    transferAmount: 6
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Silicon
          Quantity: 13
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: Vitamin
          Quantity: 1
        - ReagentId: TableSalt
          Quantity: 1
        - ReagentId: Blackpepper
          Quantity: 1
  - type: Construction
    graph: ImprovisedShotgunGraph
    node: shotgunBread
    deconstructionTarget: null

- type: entity
  parent: WeaponShotgunBreadBaguette
  id: WeaponShotgunBreadBaguetteLoaded
  suffix: Дробовик, Заряжен
  components:
  - type: BallisticAmmoProvider
    proto: ShellShotgunImprovised
