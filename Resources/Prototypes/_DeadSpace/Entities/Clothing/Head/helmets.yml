# Sec helmets

- type: entity
  parent: [ClothingHeadHatHardhatBase, BaseSecurityContraband]
  id: ClothingHeadHelmetSecurityFlashlight
  name: тактический шлем
  description: Стандартная защитная экипировка со встроенным фонариком. Защищает голову от ударов.
  components:
  - type: Sprite
    sprite: _DeadSpace/Clothing/Head/Helmets/securityflash.rsi
    layers:
    - state: icon
    - state: light-icon
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: Clothing
    sprite: _DeadSpace/Clothing/Head/Helmets/securityflash.rsi
    clothingVisuals: {}
  - type: ToggleableVisuals
    spriteLayer: light
    inhandVisuals:
      left:
      - state: on-inhand-left
      right:
      - state: on-inhand-right
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.7
  - type: Tag
    tags:
    - WhitelistChameleon
    - SecurityHelmet
  - type: Construction
    graph: ClothingHeadHelmetSecurityFlashlight
    node: securityHelmetFlashlight

- type: entity
  parent: ClothingHeadHelmetBasic
