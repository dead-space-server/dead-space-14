# by chuiomoio

- type: entity
  parent: ClothingUniformSkirtBase
  id: ClothingUniformJumpskirtPencilBlack
  name: чёрный костюм в стиле "карандаш"
  description: Чёрный костюм в стиле "карандаш" представляет собой сочетание строгой элегантности и современного стиля. Облегающий пиджак и прямая юбка создают идеальный силуэт, а черный цвет придает нотку классики. Подходит для деловых встреч и официальных мероприятий.
  components:
  - type: Sprite
    sprite: _DeadSpace/Clothing/Uniforms/Jumpskirt/pencil_black.rsi
  - type: Clothing
    sprite: _DeadSpace/Clothing/Uniforms/Jumpskirt/pencil_black.rsi

- type: entity
  parent: ClothingUniformSkirtBase
  id: ClothingUniformJumpskirtPencilBurgandy
  name: элегантный костюм в стиле "карандаш"
  description: Элегантный костюм в стиле "карандаш" в бургундском цвете придает образу изысканности и индивидуальности. Обтягивающий пиджак и стройная юбка создают стильный силуэт, делая этот костюм подходящим для особых случаев и вечерних мероприятий.
  components:
  - type: Sprite
    sprite: _DeadSpace/Clothing/Uniforms/Jumpskirt/pencil_burgandy.rsi
  - type: Clothing
    sprite: _DeadSpace/Clothing/Uniforms/Jumpskirt/pencil_burgandy.rsi

- type: entity
  parent: ClothingUniformSkirtBase
  id: ClothingUniformJumpskirtPencilCheckered
  name: костюм в клетку в стиле "карандаш"
  description: Костюм в клетку в стиле "карандаш" придает образу современный и модный вид. Элегантный пиджак и прямая юбка с интересным узором создают стильный и необычный образ. Подходит для креативных встреч и мероприятий.
  components:
  - type: Sprite
    sprite: _DeadSpace/Clothing/Uniforms/Jumpskirt/pencil_checkered.rsi
  - type: Clothing
    sprite: _DeadSpace/Clothing/Uniforms/Jumpskirt/pencil_checkered.rsi

