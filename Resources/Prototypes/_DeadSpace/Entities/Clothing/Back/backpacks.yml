        - id: InjectorCaseERTFilled
        - id: InjectorCaseStimFilled
        - id: ADTCombatHypo
        - id: PinpointerNuclear
        - id: SpeedLoaderMagnum
        - id: SpeedLoaderMagnum
        - id: SpeedLoaderMagnum
        - id: SpeedLoaderMagnum
        - id: MagazineBoxMagnum
        - id: MacroBombImplanter
  - type: ExplosionResistance
    damageCoefficient: 0.6