- type: entity
  parent: ClothingHandsButcherable
  id: ClothingHandsGlovesArkalyse
  name: перчатки "Аркалис"
  description: Перчатки подпитанные наномашинными, которые усиливают удары носителя.
  components:
  - type: Sprite
    sprite: _DeadSpace/Clothing/Hands/gloves_arkalis.rsi
  - type: Clothing
    sprite: _DeadSpace/Clothing/Hands/gloves_arkalis.rsi
    unequipDelay: 1.5
    equipDelay: 1
  - type: Fiber
    fiberMaterial: fibers-nanomachines
  - type: ArkalyseGloves
    params:
      staminaDamageMuteAtack: 25.0
      paralyzeTimeMuteAtack: 4
      hitDamageForDamageAtack: 15
      hitDamageForMuteAtack: 5
      paralyzeTimeStunAtack: 0.3
      ignoreResist: false
      damageTypeForDamageAtack: Piercing
      damageTypeForMuteAtack: Blunt
      effectPunchForDamageAtack: WeaponArcKick
      effectPunchForStunAtack: WeaponArcDisarm
      hitSoundForDamageAtack: 
        path: /Audio/_DeadSpace/Arkalyse/sound_effects_hit_kick.ogg
      hitSoundForStunAtack: 
        path: /Audio/_DeadSpace/Arkalyse/sound_effects_hit_punch.ogg