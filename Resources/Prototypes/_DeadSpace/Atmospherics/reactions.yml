- type: gasReaction
  id: NitrousOxideProduction
  priority: 3
  minimumTemperature: 200
  maximumTemperature: 250
  minimumRequirements:
    Nitrogen: 20
    Oxygen: 10
    Brizidium: 5 # катализатор
  effects:
  - !type:NitrousOxideProductionReaction {}

- type: gasReaction
  id: HyperNobliumProduction
  priority: 3
  maximumTemperature: 25
  minimumRequirements:
    Nitrogen: 10
    Tritium: 5
    # Без бризидума будет огромное количество энергии и бум
  effects:
  - !type:HyperNobliumProductionReaction {}

# Глушилка. Пока Гипер нобилиума больше 5 моль и темпа больше 30K, то останавливает все реакции.
- type: gasReaction
  id: HyperNobliumSuppression
  priority: 100
  minimumTemperature: 30
  minimumRequirements:
    HyperNoblium: 5
  effects:
  - !type:HyperNobliumSuppressionReaction {}

