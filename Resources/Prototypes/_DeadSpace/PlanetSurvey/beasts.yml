- type: entity
  parent: MobBear
  id: SurveyMobBear
  name: лесной медведь
  description: Хозяин этого леса. Ревёт, и стая отвечает.
  components:
  - type: SurveyMember
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: MobThresholds
    thresholds:
      0: Alive
      130: Critical
      170: Dead
  - type: HTN
    rootTask:
      task: SurveyBeastCompound
    blackboard:
      VisionRadius: !type:Single
        8
      AggroVisionRadius: !type:Single
        10
      IdleRange: !type:Single
        5
      SurveyPostRange: !type:Single
        1.5
      SurveyHomeRange: !type:Single
        10
      SurveyCallRange: !type:Single
        3
      SurveyWaitMin: !type:Single
        2
      SurveyWaitMax: !type:Single
        5

