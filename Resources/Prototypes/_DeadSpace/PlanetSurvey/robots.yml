- type: entity
  abstract: true
  parent: MobHivebot
  id: SurveyRobotBase
  components:
  - type: SurveyMember
    robot: true
  - type: Access
    tags:
    - SurveyNative
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: HTN
    rootTask:
      task: SurveyRobotCompound
    blackboard:
      NavInteract: !type:Bool
        true
      NavClimb: !type:Bool
        true
      VisionRadius: !type:Single
        11
      AggroVisionRadius: !type:Single
        14
      IdleRange: !type:Single
        4
      SurveyFireRange: !type:Single
        11
      SurveyPostRange: !type:Single
        1.5
      SurveyErrandRange: !type:Single
        1.2
      SurveyErrandWait: !type:Single
        1
      SurveyHomeRange: !type:Single
        6
      SurveyGuardRange: !type:Single
        3

- type: entity
  parent: SurveyRobotBase
  id: SurveyMobDrone
  name: заводской дрон
  description: Свежий оттиск штампа. Быстрый, вертлявый, режет ближнего.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Silicon/drone.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: drone
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: BorgDead
    showOverlays: false
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.6
    baseSprintSpeed: 3.8
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    attackRate: 1.4
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 9

- type: entity
  parent: SurveyRobotBase
  id: SurveyMobWelder
  name: сварочный дрон
  description: Варит швы и всё, что подвернётся.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Silicon/engineering_drone.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: engineering_drone_alt
  - type: MobThresholds
    thresholds:
      0: Alive
      55: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: BorgDead
    showOverlays: false
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.3
    baseSprintSpeed: 3.4
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    attackRate: 1.2
    soundHit:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
    animation: WeaponArcClaw
    damage:
      types:
        Heat: 11

- type: entity
  parent: SurveyRobotBase
  id: SurveyMobGunner
  name: дрон-стрелок
  description: Держит дистанцию и сыплет очередями, переступая с места на место.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/hivebot.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: ranged_attack
  - type: HTN
    rootTask:
      task: SurveyRobotCompound
    blackboard:
      NavInteract: !type:Bool
        true
      NavClimb: !type:Bool
        true
      VisionRadius: !type:Single
        12
      AggroVisionRadius: !type:Single
        15
      IdleRange: !type:Single
        4
      SurveyFireRange: !type:Single
        11
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: BorgDead
    showOverlays: false
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3
  - type: Gun
    fireRate: 3
    useKey: false
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/smg.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletLightRifleTrace
    capacity: 8
    count: 8
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.4

