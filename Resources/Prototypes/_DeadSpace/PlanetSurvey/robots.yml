- type: entity
  parent: SurveyRobotBase
  id: SurveyMobWatcher
  name: дрон-наблюдатель
  description: Глаз ядра. Летает по цехам и зовёт стражу, как только увидит чужого.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Silicon/chassis.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: xenoborg_scout
    - state: xenoborg_scout_e
      shader: unshaded
  - type: SurveyMember
    robot: true
    scout: true
    sight: 16
  - type: HTN
    rootTask:
      task: SurveyScoutCompound
    blackboard:
      NavInteract: !type:Bool
        true
      IdleRange: !type:Single
        6
      SurveyErrandRange: !type:Single
        1.5
      SurveyErrandWait: !type:Single
        1
  - type: MobThresholds
    thresholds:
      0: Alive
      45: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: BorgDead
    showOverlays: false
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.4
    baseSprintSpeed: 4.4
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 40
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: PointLight
    radius: 5
    energy: 1.8
    color: "#ff3a3a"
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0
