- type: entity
  parent: SurveyRobotBase
  id: SurveyMobAssembler
  name: собранная форма
  description: Корпус из чужих деталей, собранный ядром на конвейере. Медленный, тяжёлый, бьёт навылет.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Silicon/chassis.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: derelict
    - state: derelict_e
      shader: unshaded
  - type: HTN
    rootTask:
      task: SurveyRobotCompound
    blackboard:
      NavInteract: !type:Bool
        true
      NavClimb: !type:Bool
        true
      VisionRadius: !type:Single
        12
      AggroVisionRadius: !type:Single
        15
      IdleRange: !type:Single
        3
      SurveyFireRange: !type:Single
        10
  - type: MobThresholds
    thresholds:
      0: Alive
      220: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: BorgDead
    showOverlays: false
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 2.1
  - type: MeleeWeapon
    altDisarm: false
