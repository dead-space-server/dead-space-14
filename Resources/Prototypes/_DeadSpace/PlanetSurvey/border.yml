- type: entity
  parent: WallPlastitaniumIndestructible
  id: SurveyCliff
  name: скала
  description: Отвесная порода. Дальше этой планеты не пройти.
  components:
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: Icon
    sprite: Structures/Walls/rock.rsi
    state: rock
  - type: SmoothEdge
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    layers:
    - state: rock
    - map: [ "enum.EdgeLayer.South" ]
      state: rock_south
    - map: [ "enum.EdgeLayer.East" ]
      state: rock_east
    - map: [ "enum.EdgeLayer.North" ]
      state: rock_north
    - map: [ "enum.EdgeLayer.West" ]
      state: rock_west

- type: entity
  parent: SurveyCliff
  id: SurveyCliffSnow
  components:
  - type: Icon
    sprite: Structures/Walls/rock.rsi
    state: rock_snow
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    layers:
    - state: rock_snow
    - map: [ "enum.EdgeLayer.South" ]
      state: rock_snow_south
    - map: [ "enum.EdgeLayer.East" ]
      state: rock_snow_east
    - map: [ "enum.EdgeLayer.North" ]
      state: rock_snow_north
    - map: [ "enum.EdgeLayer.West" ]
      state: rock_snow_west
